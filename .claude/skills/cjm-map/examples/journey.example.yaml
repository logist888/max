  text: Переключатель направлений на каждой странице; запоминать последнее направление клиента
- row: ideas
  col: 9
  kind: w
  text: Вопрос «Нужна помощь с выбором направления?» ведёт в профориентацию, выдачу не скрывает
- row: ideas
  col: 10
  kind: w
  text: 'Не спрашивать известное: страну, язык, ответы квиза и запроса подставлять сами'
- row: ideas
  col: 11
  kind: w
  text: Разделить текущую локацию и гражданство; страна обязательна, город — по желанию
- row: ideas
  col: 12
  kind: w
  text: Развести «пока не определился» и «без ограничения» в бюджете; валюту и единицу периода определить отдельно
- row: ideas
  col: 13
  kind: w
  text: Для коротких программ спрашивать период (сезон, месяц, даты), для длинных — год; точные даты не требовать
- row: ideas
  col: 14
  kind: w
  text: 'Квиз в 3–5 шагов: решение о достаточности данных принимается до компоновки шагов'
- row: ideas
  col: 15
  kind: w
  text: Календарь цен и сроков, как в авиабилетах; спрос и зарплаты по месяцам
- row: ideas
  col: 17
  kind: w
  text: 'Под подборкой: «Сохранить», «Поделиться» и вопрос «Подошла?»; ответы да и нет копить в статистику'
- row: ideas
  col: 18
  kind: w
  text: 'Две двери в одну услугу: войти через вуз или через профессию; соседнее направление — в один клик'
- row: ideas
  col: 20
  kind: w
  text: 'Профориентация даёт индекс соответствия: варианты ранжируются под ребёнка'
- row: ideas
  col: 21
  kind: w
  text: 'Правило вставок: ни одной плашки до первой полезной выдачи, не больше одной на экран'
- row: ideas
  col: 23
  kind: w
  text: 'Вузы, профессии и курсы — отдельные страницы выдачи; курсы пока в проработке: контакт и лист ожидания'
- row: ideas
  col: 25
  kind: w
  text: Из профессии одна кнопка ведёт к вузам, колледжам и коротким программам; фильтры уже подставлены
- row: ideas
  col: 27
  kind: w
  text: 'Первый запуск без усложнения: циклы «подборка — профориентация — переход на сайт»; главное — взять email и вернуться письмом'
- row: ideas
  col: 29
  kind: w
  text: 'Окно у большой кнопки: переход на сайт (оплата за клик), заявка через портал, услуги и пакеты («поступление плюс виза»)'
- row: ideas
  col: 31
  kind: w
  text: 'Монетизация гибридная: клики, затем лиды и заявки, затем услуги'
- row: ideas
  col: 33
  kind: w
  text: 'Лист ожидания на услуги и программы: проверить спрос, не строя продукт'
- row: ideas
  col: 36
  kind: w
  text: 'Запустить вручную: считать плашки → записи → состоявшиеся звонки'
- row: ideas
  col: 40
  kind: w
  text: Сравнить автоматику и автоматику плюс звонок по оплатам
- row: ideas
  col: 43
  kind: w
  text: Лимит слотов в день и очередь ожидания
- row: ideas
  col: 47
  kind: w
  text: 'Подставлять результат диагностики в фильтры «что изучать»: мост между отчётом и поиском'
- row: ideas
  col: 51
  kind: w
  text: Показывать баннер только после первой выдачи; считать баннер → скрининг → оплата
- row: ideas
  col: 55
  kind: w
  text: Проверить разные цены и каналы и выяснить, почему часть клиентов не доходит до оплаты
- row: ideas
  col: 60
  kind: w
  text: Собрать реестр пакетов и цены до запуска плашки
- row: ideas
  col: 64
  kind: w
  text: Показывать плашку только у выбранного варианта; считать плашка → заявка → оплата
- row: ideas
  col: 68
  kind: w
  text: Проверить спрос на одном направлении до каталога
- row: ideas
  col: 72
  kind: w
  text: Проверить окно после первого и после третьего сердечка
- row: ideas
  col: 76
  kind: w
  text: Измерить долю «Позже» и возвратов по ссылке из тоста
- row: ideas
  col: 80
  kind: w
  text: Следить за временем доставки и спамом у письма с кодом
- row: ideas
  col: 83
  kind: w
  text: Измерить долю дошедших от сохранения до сравнения
- row: ideas
  col: 86
  kind: w
  text: Пометка «лучшее» не должна выглядеть рекомендацией платных карточек
- row: ideas
  col: 89
  kind: w
  text: Для профессий добавить в сравнение зарплаты по странам
- row: inserts
  col: 0
  kind: gr
  text: 'Вставок нет: человек ещё не на портале'
- row: inserts
  col: 5
  kind: gr
  text: 'Вставок нет: сначала польза'
- row: inserts
  col: 9
  kind: gr
  text: Переключатель направлений — на каждой странице; это не плашка, а часть поиска
- row: inserts
  col: 17
  kind: b
  id: i10
  dy: 640
  min_h: 150
  text: 'Сравнение и «Сохранённое»: при сохранённых вариантах — панель «Сравнить» и сердечко в шапке → блок 10, подпроцесс правее'
- row: inserts
  col: 18
  kind: b
  id: i9
  dy: 480
  min_h: 150
  text: 'Сердечко у карточки: сохранение без блокировки, затем окно аккаунта → блок 9, подпроцесс правее'
- row: inserts
  col: 21
  kind: b
  id: i6
  dy: 160
  min_h: 150
  text: Сменяющийся баннер «Не знаете, с чего начать? Начните с бесплатного теста» — на главной и после первой выдачи → блок 7, подпроцесс правее
- row: inserts
  col: 22
  kind: b
  id: i5
  min_h: 150
  text: Плашка «Не уверены? 15 минут с консультантом» — при сравнении 3 и более вариантов и при повторном возвращении → блок 6, подпроцесс правее (статус под вопросом)
- row: inserts
  col: 24
  kind: b
  id: i7
  dy: 320
  min_h: 150
  text: Плашка «Поможем построить путь» — у избранного и после выбора варианта → блок 8, подпроцесс правее
- row: inserts
  col: 36
  kind: y
  id: w5
  min_h: 150
  text: 'Плашка в выдаче и в сравнении: при сравнении 3 и более вариантов, при повторном возвращении в поиск, при выборе страны с другим языком или визой'
- row: inserts
  col: 37
  kind: gr
  min_h: 150
  text: 'Правило: не до первой полезной выдачи; закрытая плашка не возвращается в этой сессии'
- row: inserts
  col: 46
  kind: y
  id: w6
  dy: 160
  min_h: 150
  text: 'Сменяющийся баннер «Не знаете, с чего начать?»: при широком поиске без направления, после первой выдачи; плашка в избранном «подберём направление под ребёнка»'
- row: inserts
  col: 47
  kind: gr
  dy: 160
  min_h: 150
  text: 'Правило: не до первой полезной выдачи; закрытый баннер не возвращается в этой сессии'
- row: inserts
  col: 59
  kind: y
  id: w7
  dy: 320
  min_h: 150
  text: 'Плашка у избранного и после перехода на сайт учреждения: «Поможем подать документы»; письмо с дедлайном и предложением помощи'
- row: inserts
  col: 60
  kind: gr
  dy: 320
  min_h: 150
  text: 'Правило: только после выбора конкретного варианта'
- row: inserts
  col: 71
  kind: y
  id: w9
  dy: 480
  min_h: 150
  text: Сердечко у каждой карточки в выдаче, в сравнении и у статьи; окно аккаунта показывается при первом сохранении
- row: inserts
  col: 72
  kind: gr
  dy: 480
  min_h: 150
  text: 'Правило: окно показывается один раз за сессию; после «Позже» — только тост со ссылкой'
- row: inserts
  col: 83
  kind: y
  id: w10
  dy: 640
  min_h: 150
  text: Сердечко в шапке со счётчиком; панель «Сравнить» в выдаче, когда в направлении сохранены варианты
- row: inserts
  col: 84
  kind: gr
  dy: 640
  min_h: 150
  text: 'Короткий список до 4: предел сравнения'
