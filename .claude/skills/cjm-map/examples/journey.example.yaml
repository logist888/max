meta:
  title: 'Поиск и подбор на портале Mainexperts: вузы, колледжи, профессии и короткие программы'
  subtitle: Единый поток слева направо. Портал разделён на дорожки по направлениям; клиент выбирает направление в переключателе и может сменить его в любой момент. Блоки 6, 7, 8 показываются плашками и баннерами; в конце каждого блока возврат в основной путь.
  date: '2026-11-06'
  version: '1.0'
  source: docs/26, docs/27, docs/28; образец результата — vault/40-reports/2026-11-03-cjm-poisk-vse-napravleniya-shema-i-stikery.svg
  flow_title: 'Блок-схема пути клиента: поиск и подбор на портале — вузы, колледжи, профессии, короткие программы'
header:
  job: 'Найти для ребёнка подходящую учёбу или профессию в любой стране: выбрать направление, сравнить варианты, дойти до заявки или услуги'
  assumption: 'Допущение карты: в базе есть все вузы, колледжи, профессии и короткие программы мира, на всех языках, с ценами, сроками, требованиями, спросом и зарплатными вилками; всё проиндексировано. Клиент из любой страны ищет для ребёнка учёбу или профессию в любой стране, как билеты: вверху переключатель «Вузы · Колледжи · Профессии · Короткие программы», направление можно сменить в любой момент. Внутри портала у каждого направления своя выдача и своя дорожка; сердечко и «Сохранённое», консультации и пакеты общие.'
  drivers:
  - 'Всё в одном месте: вузы, колледжи, профессии, короткие программы'
  - 'Переключатель направлений: поиск не нужно начинать заново'
  - Цены, спрос и сроки в своей валюте и на своём языке
  - Из профессии — к вузам, из вуза — к профессиям
  - Шансы по баллам, сроки подачи, зарплатные вилки — в карточке
  - Слежение за сроками, ценой и спросом
  - Видеозвонок до покупки (его просит большинство опрошенных родителей)
  barriers:
  - 'Перегруз выбором: четыре направления и тысячи вариантов'
  - Доверие к незнакомому бренду
  - 'Данные устаревают: нужны свежие цены, сроки и зарплаты'
  - Плашки и баннеры, показанные рано, ломают доверие
  - Возможна низкая конверсия в оплату
  - «Зачем ребёнку профориентация, ему же в вуз?» — слово «профориентация» клиент не ищет
  - Клиент уходит на сайт учреждения и может не вернуться
  - Состав и цены дополнительных пакетов не заданы
  - Открытые спрос и зарплаты по профессиям спорят с платным модулем Профиля 360
