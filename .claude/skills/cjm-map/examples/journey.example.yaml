screens:
- {col: 5, span: 2, image: screens/home_cookie.jpg, caption: 'Первый вход: заставка, затем уведомление о cookies'}
- {col: 7, span: 2, image: screens/home.jpg, caption: 'Главная: слоган, вкладки направлений, поиск, баннер'}
- {col: 9, span: 2, image: screens/form_vuz.jpg, caption: 'Форма «Вузы»: откуда, где учиться, когда, что изучать, куда поступаете'}
- {col: 11, span: 2, image: screens/where.jpg, caption: 'Окно «Где учиться»: регионы, страны, «Где угодно», «Онлайн»'}
- {col: 13, span: 2, image: screens/miss.jpg, caption: Незаполненные обязательные поля подсвечены}
- {col: 15, span: 3, image: screens/results_vuz.jpg, caption: 'Выдача вузов: цены в валюте, совпадение с профилем, сердечко'}
- {col: 18, span: 2, image: screens/auth_fav.jpg, caption: 'После сердечка: окно «Не потеряйте сохранённое»'}
- {col: 20, span: 2, image: screens/results_pro.jpg, caption: 'Другое направление: профессии (спрос, зарплата, риск)'}
- {col: 22, span: 2, image: screens/results_kp.jpg, caption: 'Короткие программы: даты, формат, цена'}
- {col: 26, span: 2, image: screens/big.jpg, caption: '«Большая кнопка»: сайт, заявка через портал, услуги'}
- {col: 28, span: 2, image: screens/auth_site.jpg, caption: 'Перед переходом на сайт: email (можно пропустить)'}
- {col: 30, span: 2, image: screens/outbound.jpg, caption: Переход на сайт учреждения; вкладка портала остаётся}
- {col: 32, span: 2, image: screens/returned.jpg, caption: 'Возврат на портал: статус «подал, записался, думает»'}
- {col: 36, span: 2, image: screens/plashka.jpg, caption: 'Блок 6. Плашка «Не уверены? Поможем сузить выбор»'}
- {col: 39, span: 2, image: screens/consult.jpg, caption: Блок 6. Анкета на консультацию}
- {col: 46, span: 2, image: screens/banner_test.jpg, caption: 'Блок 7. Баннер «Не знаете, с чего начать?»'}
- {col: 49, span: 2, image: screens/orient.jpg, caption: Блок 7. Бесплатный скрининг}
- {col: 52, span: 2, image: screens/orient_result.jpg, caption: 'Блок 7. Карта: первые направления'}
- {col: 60, span: 2, image: screens/services.jpg, caption: Блок 8. Услуги и пакеты}
- {col: 73, span: 2, image: screens/auth_fav.jpg, caption: Блок 9. Окно «Не потеряйте сохранённое»}
- {col: 77, span: 2, image: screens/auth_code.jpg, caption: Блок 9. Код из письма}
- {col: 80, span: 2, image: screens/toast.jpg, caption: Блок 9. Тост «Сохранено» со ссылкой «Посмотреть»}
- {col: 82, span: 3, image: screens/cabinet.jpg, caption: 'Блок 10. «Сохранённое»: короткий список, коллекции'}
- {col: 85, span: 2, image: screens/coll.jpg, caption: 'Блок 10. Коллекция: список, напоминание о сроке'}
