<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MainExperts Management System — Система бордов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#13202F;
  --panel:#1A2B3E;
  --panel-2:#21384F;
  --raised:#284763;
  --line:#33526E;
  --line-soft:#27415A;
  --ink:#E9F0F6;
  --ink-2:#A9BED2;
  --ink-3:#6F889F;
  --steel:#7FB2D9;
  --steel-deep:#4E86B4;
  --gold:#C9A227;
  --gold-soft:#3a3320;
  --ok:#4FB286;
  --warn:#E0A458;
  --crit:#D96A6A;
  --na:#5B7088;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 28px rgba(0,0,0,.35);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, #1c3550 0%, transparent 60%),
    var(--canvas);
  color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:inherit}
::selection{background:rgba(127,178,217,.28)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1b2d41,#16263a);
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.brand .mark{
  font-family:"IBM Plex Mono";font-weight:600;letter-spacing:.14em;font-size:12px;
  color:var(--canvas);background:var(--steel);padding:4px 8px;border-radius:5px;
}
.brand .ttl{font-weight:600;letter-spacing:.01em}
.brand .sub{color:var(--ink-3);font-size:12px}

.streamwrap{display:flex;align-items:center;gap:9px}
.streamwrap .lab{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.12em}
.seg{display:flex;background:#14263a;border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--ink-2);
  font:inherit;font-size:13px;padding:6px 13px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--canvas);font-weight:600}
.seg button[data-stream="all"][aria-pressed="true"]{background:var(--steel)}
.seg button[data-stream="founder"][aria-pressed="true"]{background:var(--gold)}
.seg button[data-stream="platform"][aria-pressed="true"]{background:var(--steel)}
.dotmini{width:7px;height:7px;border-radius:50%}
.dotmini.f{background:var(--gold)}
.dotmini.p{background:var(--steel-deep)}

.topright{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--ink-3);font-size:12.5px}
.period{display:flex;align-items:center;gap:7px}
.period b{color:var(--ink-2);font-weight:500}
.menutgl{display:none}

.body{display:grid;grid-template-columns:288px 1fr;min-height:0}

/* ---------- Rail ---------- */
.rail{
  border-right:1px solid var(--line);background:var(--panel);
  overflow:auto;padding:14px 12px 40px;
}
.rail .grp{margin:14px 6px 7px;color:var(--ink-3);font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase}
.rail .grp:first-child{margin-top:2px}
.navitem{
  width:100%;text-align:left;appearance:none;border:0;background:transparent;
  color:var(--ink-2);font:inherit;cursor:pointer;border-radius:9px;
  padding:9px 11px;display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;
  transition:.13s;margin-bottom:2px;
}
.navitem:hover{background:#1f3450;color:var(--ink)}
.navitem.active{background:var(--panel-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--steel)}
.navitem .nm{display:flex;flex-direction:column;line-height:1.25}
.navitem .nm small{color:var(--ink-3);font-size:11px;font-weight:400}
.navitem.active .nm small{color:var(--ink-2)}
.navitem .rhythm{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink-3);
  border:1px solid var(--line-soft);border-radius:5px;padding:2px 5px;white-space:nowrap}
.sd{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.sd.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(79,178,134,.16)}
.sd.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(224,164,88,.16)}
.sd.crit{background:var(--crit);box-shadow:0 0 0 3px rgba(217,106,106,.16)}
.sd.na{background:transparent;border:1.5px solid var(--na)}
.navitem.dim{opacity:.38;pointer-events:none}
.railnote{margin:18px 8px 0;padding:11px 12px;border:1px solid var(--line-soft);
  border-radius:9px;color:var(--ink-3);font-size:11.5px;line-height:1.45;background:#172838}
.railnote b{color:var(--ink-2);font-weight:600}

/* ---------- Main ---------- */
.main{overflow:auto;padding:26px 30px 80px;min-width:0}
.crumbs{color:var(--ink-3);font-size:12px;margin-bottom:14px;font-family:"IBM Plex Mono"}
.crumbs b{color:var(--ink-2);font-weight:500}

.bhead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:4px}
.bhead .lvl{font-family:"IBM Plex Mono";font-size:11px;color:var(--canvas);
  background:var(--ink-3);border-radius:5px;padding:3px 7px;margin-top:6px;letter-spacing:.08em}
.bhead h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}
.bhead .one{color:var(--ink-2);max-width:62ch;font-size:13.5px}
.bmeta{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:#172838;border-radius:8px;padding:7px 11px;font-size:12px;color:var(--ink-2)}
.chip .k{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}
.chip b{color:var(--ink);font-weight:500}

.streambadge{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.pill{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.pill.f{color:var(--gold);border-color:#5a4d20;background:var(--gold-soft)}
.pill.p{color:var(--steel);border-color:#26465f;background:#16314a}

.sec{margin-top:26px}
.sec > h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 13px;display:flex;align-items:center;gap:10px}
.sec > h2::after{content:"";height:1px;flex:1;background:var(--line-soft)}

/* AI brief / questions */
.brief{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.brief{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--shadow)}
.aibrief{padding:16px 18px}
.aibrief .h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.aibrief .h .ai{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.12em;color:var(--steel);
  border:1px solid #2a4a64;border-radius:5px;padding:2px 7px}
.aibrief .h b{font-weight:600}
.empty{color:var(--ink-3);font-size:13px;line-height:1.5}
.empty u{color:var(--ink-2);text-decoration:none;border-bottom:1px dotted var(--ink-3)}
.qlist{padding:16px 18px}
.qlist ol{margin:6px 0 0;padding-left:20px;color:var(--ink-2)}
.qlist li{margin:6px 0}

/* KPI cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:13px 14px 12px;cursor:pointer;position:relative;transition:.14s;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--line);transform:translateY(-1px)}
.kpi .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi .code{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.kpi .nm{font-weight:500;margin-top:5px;font-size:13.5px;line-height:1.25}
.kpi .desc{color:var(--ink-3);font-size:11.5px;margin-top:2px;min-height:16px}
.kpi .val{font-family:"IBM Plex Mono";font-size:23px;font-weight:500;margin-top:11px;letter-spacing:-.01em}
.kpi .val.na{color:var(--ink-3);font-weight:400}
.kpi .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--ink-3)}
.kpi .src{display:flex;align-items:center;gap:6px;min-width:0}
.kpi .src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.06em;padding:2px 6px;
  border-radius:5px;white-space:nowrap;text-transform:uppercase}
.state.live{color:var(--ok);background:rgba(79,178,134,.1);border:1px solid #2c5345}
.state.model{color:var(--warn);background:rgba(224,164,88,.09);border:1px solid #4d3f26}
.state.none{color:var(--na);background:#1a2c3e;border:1px solid var(--line-soft)}
.kpi .strk{position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r)}
.kpi.f .strk{background:var(--gold)}
.kpi.p .strk{background:var(--steel-deep)}
.kpi.b .strk{background:linear-gradient(var(--gold),var(--steel-deep))}

/* areas */
.areas{display:flex;flex-wrap:wrap;gap:8px}
.area{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink-2);
  background:#16273a}
.area b{color:var(--ink);font-weight:500;font-size:11.5px;display:block;margin-bottom:1px}
.area small{color:var(--ink-3);font-size:11px}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:9px}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 14px}
.alert .bar{width:4px;height:100%;border-radius:3px;min-height:34px}
.alert.warn .bar{background:var(--warn)}
.alert.crit .bar{background:var(--crit)}
.alert .meta{min-width:0}
.alert .ttl{font-weight:500;font-size:13.5px}
.alert .sub{color:var(--ink-3);font-size:12px;margin-top:2px}
.alert .sub b{color:var(--ink-2);font-weight:500}
.pb{appearance:none;border:1px solid #2a4a64;background:#16314a;color:var(--steel);
  font:inherit;font-size:11.5px;font-family:"IBM Plex Mono";padding:7px 11px;border-radius:7px;
  cursor:pointer;white-space:nowrap;transition:.13s}
.pb:hover{background:#1b3c57;color:#a8cdec}

/* drill tree */
.tree{font-family:"IBM Plex Mono";font-size:12.5px}
.tnode{display:flex;align-items:center;gap:9px;padding:6px 0}
.tnode .tw{color:var(--steel-deep)}
.tnode .lbl{color:var(--ink)}
.tnode .dim2{color:var(--ink-3)}
.tchild{margin-left:20px;border-left:1px solid var(--line-soft);padding-left:16px}
.texp{appearance:none;border:1px solid var(--line-soft);background:#17283a;color:var(--ink-2);
  width:18px;height:18px;border-radius:5px;cursor:pointer;font-family:"IBM Plex Mono";font-size:12px;
  line-height:1;display:inline-flex;align-items:center;justify-content:center}
.texp:hover{color:var(--ink);border-color:var(--line)}

/* generic two-col tables (rhythm / framework) */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl th{color:var(--ink-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.tbl td.mono{font-family:"IBM Plex Mono";color:var(--ink-2);white-space:nowrap}
.tbl tr:hover td{background:#17283a}
.lvltag{display:inline-block;font-family:"IBM Plex Mono";font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:#1a2c3e;border:1px solid var(--line-soft);color:var(--ink-2)}

/* playbook view */
.pbcard{padding:20px 22px}
.pbcard .pbid{font-family:"IBM Plex Mono";color:var(--steel);font-size:13px;letter-spacing:.06em}
.pbcard h3{margin:4px 0 14px;font-size:20px;font-weight:600}
.pbrow{display:grid;grid-template-columns:140px 1fr;gap:6px 18px;padding:9px 0;border-top:1px solid var(--line-soft)}
.pbrow .k{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.pbrow .v{color:var(--ink)}
.pbrow .v ul{margin:2px 0;padding-left:18px;color:var(--ink-2)}
.pbback{appearance:none;border:1px solid var(--line);background:#16273a;color:var(--ink-2);
  font:inherit;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;margin-bottom:16px}
.pbback:hover{color:var(--ink)}
.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pbtile{padding:15px 16px;cursor:pointer}
.pbtile:hover{border-color:var(--line)}
.pbtile .pbid{font-size:12px}
.pbtile h4{margin:4px 0 7px;font-size:15px;font-weight:600}
.pbtile .cond{color:var(--ink-3);font-size:12px;line-height:1.4}

/* passport drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.6);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:.18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:.22s cubic-bezier(.4,0,.2,1);
  z-index:41;overflow:auto;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer.on{transform:none}
.dwhead{padding:20px 22px 14px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;
  background:linear-gradient(180deg,#1d2f44,#1a2b3e)}
.dwhead .code{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink-3)}
.dwhead h3{margin:5px 0 3px;font-size:19px;font-weight:600}
.dwhead .pp{color:var(--ink-3);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.dwx{position:absolute;top:16px;right:18px;appearance:none;border:1px solid var(--line);
  background:#16273a;color:var(--ink-2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.dwx:hover{color:var(--ink)}
.dwbody{padding:8px 22px 30px}
.field{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.field .fk{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.field .fv{color:var(--ink);font-size:13.5px}
.field .fv.mono{font-family:"IBM Plex Mono";font-size:12.5px}
.thr{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap}
.thr span{font-family:"IBM Plex Mono";font-size:11px;padding:3px 8px;border-radius:6px}
.thr .n{color:var(--ok);background:rgba(79,178,134,.1);border:1px solid #2c5345}
.thr .w{color:var(--warn);background:rgba(224,164,88,.09);border:1px solid #4d3f26}
.thr .c{color:var(--crit);background:rgba(217,106,106,.1);border:1px solid #523035}

.note-inline{color:var(--ink-3);font-size:12.5px;background:#16273a;border:1px solid var(--line-soft);
  border-radius:9px;padding:11px 14px;line-height:1.5}
.note-inline b{color:var(--ink-2)}

.footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line-soft);
  color:var(--ink-3);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer .mono{color:var(--na)}

/* responsive */
@media(max-width:820px){
  .body{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:57px;bottom:0;width:300px;z-index:25;transform:translateX(-105%);
    transition:.2s;box-shadow:20px 0 50px rgba(0,0,0,.4)}
  .rail.open{transform:none}
  .menutgl{display:inline-flex;align-items:center;gap:7px;appearance:none;border:1px solid var(--line);
    background:#16273a;color:var(--ink-2);font:inherit;font-size:13px;padding:7px 11px;border-radius:8px;cursor:pointer}
  .main{padding:20px 18px 70px}
  .bhead h1{font-size:22px}
  .topright{display:none}
}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="menutgl" id="menutgl" aria-label="Меню">☰ Борды</button>
    <div class="brand">
      <span class="mark">MMS</span>
      <span class="ttl">Система бордов</span>
      <span class="sub">MainExperts · v0.1</span>
    </div>
    <div class="streamwrap">
      <span class="lab">Поток</span>
      <div class="seg" id="seg" role="group" aria-label="Поток выручки">
        <button data-stream="all" aria-pressed="true">Оба</button>
        <button data-stream="founder" aria-pressed="false"><span class="dotmini f"></span>Founder Premium</button>
        <button data-stream="platform" aria-pressed="false"><span class="dotmini p"></span>Platform</button>
      </div>
    </div>
    <div class="topright">
      <div class="period">Период <b id="periodlbl">— · текущий</b></div>
      <div class="mono" id="curlbl">₽ / £</div>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Навигация по бордам"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Паспорт KPI">
  <div class="dwhead">
    <button class="dwx" id="dwx" aria-label="Закрыть">×</button>
    <div class="code" id="dwcode"></div>
    <h3 id="dwname"></h3>
    <div class="pp">Паспорт показателя</div>
  </div>
  <div class="dwbody" id="dwbody"></div>
</aside>

<script>
/* =====================================================================
   ДАННЫЕ. Состав бордов синтезирован из Тома I (Business Architecture)
   и Тома II (Functional Specification). Значения KPI пока отсутствуют:
   платформа в предзапуске. Каждый показатель несёт источник и состояние:
   live  — может считаться сейчас (источник подключаем),
   model — может моделироваться/планироваться сейчас,
   none  — требует запуска платформы/продаж.
   ===================================================================== */

var STREAMS = {
  all:     {label:"Оба потока", cur:"₽ / £", note:"Консолидация — только на уровне Owner: Cash, Runway, EBITDA. Юнит-экономика, конверсия, CAC, DRR, LTV по потокам не суммируются."},
  founder: {label:"Founder Premium", cur:"£", note:"Личная экспертиза основателя. Привлечение — рекомендации HNW, без платного трафика. Цены: профориентация £3 000, поступление UCAS £2 000, полный пакет £5 000."},
  platform:{label:"Platform", cur:"₽", note:"Масштабируемая часть: эксперты + AI + цифровые продукты. Воронка: бесплатный скрининг → Профиль 10 → Профиль 360. Пакеты: Free / Pro 2 990 ₽ / Ultima 9 990 ₽, пакет «50К»."}
};

function k(code,nm,desc,src,state,stream){return {code:code,nm:nm,desc:desc||"",src:src,state:state,stream:stream||"both"};}

var BOARDS = [
  {
    id:"owner", lvl:"L0", name:"Owner",
    owner:"Основатель (Макс)", rhythm:"ежедневно", streams:["founder","platform"],

function curOf(kpi){ if(stream==="founder") return "£"; if(stream==="platform") return "₽"; return kpi.stream==="founder"?"£":(kpi.stream==="platform"?"₽":"₽/£"); }

function sevRank(b){
  if(!visibleBoard(b)) return "na";
  var rel = (b.alerts||[]).filter(function(a){return alertVisible(b,a);});
  if(rel.some(function(a){return a.sev==="crit";})) return "crit";
  if(rel.some(function(a){return a.sev==="warn";})) return "warn";
  // если у борда есть хоть один live/model KPI — считаем «наблюдение», иначе нет данных
  var anyData = b.kpis.some(function(x){return kpiVisible(x) && x.state!=="none";});
  return anyData ? "ok" : "na";
}
function visibleBoard(b){ if(stream==="all") return true; return b.streams.indexOf(stream)>=0; }
function kpiVisible(x){ if(stream==="all") return true; return x.stream==="both" || x.stream===stream; }
function alertVisible(b,a){ return true; }

function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

function navItem(b){

function sysItem(id,name,sub){

function render(){

function streamClass(x){ return x.stream==="founder"?"f":(x.stream==="platform"?"p":"b"); }

/* drill tree builder with expand/collapse */
function buildTree(node,open){
  var wrap = el("div");
  var line = el("div","tnode");
  var hasChildren = node.c && node.c.length;
  if(hasChildren){
    var btn = el("button","texp", open?"−":"+");
    line.appendChild(btn);
  } else {
    var sp = el("span"); sp.style.width="18px"; sp.style.display="inline-block"; line.appendChild(sp);
  }
  line.appendChild(el("span","lbl mono",node.n));
  wrap.appendChild(line);
  if(hasChildren){
    var kids = el("div","tchild");
    node.c.forEach(function(ch){ kids.appendChild(buildTree(ch,false)); });
    kids.style.display = open?"block":"none";
    wrap.appendChild(kids);
    btn.onclick = function(){
      var vis = kids.style.display!=="none";
      kids.style.display = vis?"none":"block";
      btn.textContent = vis?"+":"−";
    };
  }
  return wrap;
}

  body.innerHTML = "";
  body.appendChild(field("Описание", x.desc || "—"));
  body.appendChild(field("Текущее значение", "<span class='mono' style='color:var(--ink-3)'>— · нет данных</span>"));
  body.appendChild(field("Состояние источника", "<span class='state "+stateCls(x.state)+"' style='display:inline-block'>"+STATE_LABEL[x.state]+"</span>"));
  body.appendChild(field("Источник", x.src, true));
  body.appendChild(field("Валюта", curOf(x), true));
  body.appendChild(field("Поток", x.stream==="both"?"Оба (раздельный учёт)":(x.stream==="founder"?"Founder Premium · £":"Platform · ₽")));
  body.appendChild(field("Ответственный", b.owner.split(";")[0]));
  body.appendChild(field("Частота обновления", b.rhythm, true));
  var thr = el("div","field");
  thr.appendChild(el("div","fk","Пороговые значения"));
  thr.appendChild(el("div","thr","<span class='n'>норма</span><span class='w'>предупреждение</span><span class='c'>критическое</span>"));
  body.appendChild(thr);
  body.appendChild(field("Drill Down", "Раскрытие до первичного события — см. дерево декомпозиции борда."));
  document.getElementById("scrim").classList.add("on");
  document.getElementById("drawer").classList.add("on");
}
function field(kk,vv,mono){ var f=el("div","field"); f.appendChild(el("div","fk",kk)); f.appendChild(el("div","fv"+(mono?" mono":""),vv)); return f; }
function closeDrawer(){ document.getElementById("scrim").classList.remove("on"); document.getElementById("drawer").classList.remove("on"); }

function footer(){
  var f = el("div","footer");
  f.innerHTML = "<span>MainExperts Management System · Том I (Business Architecture) + Том II (Functional Specification)</span>"+
                "<span class='mono'>значения KPI отсутствуют — предзапуск · состояние источника указано на каждой карточке</span>";
  return f;
}

/* -------- Rail toggle (mobile) -------- */
function closeRail(){ document.getElementById("rail").classList.remove("open"); }
document.getElementById("menutgl").onclick=function(){ document.getElementById("rail").classList.toggle("open"); };

/* -------- Stream toggle -------- */
document.querySelectorAll(".seg button").forEach(function(btn){
  btn.onclick = function(){ stream = btn.dataset.stream; render(); };
});
document.getElementById("dwx").onclick = closeDrawer;
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeDrawer(); closeRail(); }});

render();
</script>
</body>
</html>
