  text: Q01.01 · Определить запрос обучающегося → сформулированная образовательная цель с носителем.
- row: detail
  col: 0
  kind: gr
  text: Q01.02 · Интерпретировать диагностику → результат измерения интересов или способностей с методикой.
- row: detail
  col: 0
  kind: gr
  text: Q01.03 · Установить ограничения выбора → индивидуальный профиль обязательных требований.
- row: detail
  col: 0
  kind: gr
  text: Q01.04 · Зафиксировать личные предпочтения → профиль желательных параметров и приоритетов.
- row: detail
  col: 0
  kind: gr
  text: Q01.05 · Связать желаемую роль с обучением → маршрут от текущей подготовки к компетенциям и квалификации.
- row: detail
  col: 0
  kind: gr
  text: Q01.06 · Определить ближайший шаг → следующее действие с входным условием и результатом.
- row: detail
  col: 0
  kind: gr
  text: Q01.07 · Построить запасной маршрут → альтернативная последовательность действий для известного риска.
- row: detail
  col: 0
  kind: gr
  text: Q01.08 · Выявить противоречие обязательных ограничений маршрута → перечень несовместимых требований с основанием.
- row: detail
  col: 0
  kind: gr
  text: Q01.09 · Установить исходную точку маршрута → подтверждённое состояние образования человека на дату.
- row: detail
  col: 0
  kind: gr
  text: Q01.10 · Согласовать цель обучающегося и законного представителя → зафиксированная общая цель либо остающееся
    разногласие.
- row: detail
  col: 0
  kind: gr
  text: Q01.11 · Проверить достижимость последовательности шагов по срокам → расчётная временная осуществимость
    маршрута.
- row: detail
  col: 0
  kind: gr
  text: Q01.12 · Пересмотреть маршрут после изменения обстоятельств → новая версия индивидуального плана с причиной
    изменения.
- row: detail
  col: 0
  kind: gr
  text: Q01.13 · Определить ценность конкретного навыка для личной цели → связанный с целью ожидаемый образовательный
    результат.
- row: detail
  col: 1
  kind: gr
  text: Q02.01 · Установить рамку образования → описание применимой системы и её границ.
- row: detail
  col: 1
  kind: gr
  text: Q02.02 · Определить положение ступени → место уровня в конкретной рамке.
- row: detail
  col: 1
  kind: gr
  text: Q02.03 · Расшифровать формальный режим обучения → значение режима с его нормативным контекстом.
- row: detail
  col: 1
  kind: gr
  text: Q02.04a · Определить нормативный возраст входа на ступень → правило возраста с датой отсчёта и исключениями.
- row: detail
  col: 1
  kind: gr
  text: Q02.04b · Определить типовую предшествующую ступень → позиция в указанной образовательной системе и правило
    перехода.
- row: detail
  col: 1
  kind: gr
  text: Q02.05 · Найти типовой переход между ступенями → схема перехода с условиями.
- row: detail
  col: 1
  kind: gr
  text: Q02.06 · Определить роль подготовительной ступени → положение подготовки относительно целевой ступени.
- row: detail
  col: 1
  kind: gr
  text: Q02.07 · Сопоставить системы → отображение уровней с основанием и пределом эквивалентности.
- row: detail
  col: 1
  kind: gr
  text: Q02.08 · Установить обязательность обучения → применимое правило для возраста, статуса и юрисдикции.
- row: detail
  col: 1
  kind: gr
  text: Q02.09 · Определить полномочный орган для образовательной ступени → ответственный орган в конкретной системе.
- row: detail
  col: 1
  kind: gr
  text: Q02.10 · Установить способ организации семейного или домашнего обучения → определённый в системе режим и
    его основания.
- row: detail
  col: 1
  kind: gr
  text: Q02.11 · Расшифровать единицу учебной нагрузки в системе → определение меры и её область применения.
- row: detail
  col: 1
  kind: gr
  text: Q02.12 · Проверить место краткой квалификации в рамке → наличие или отсутствие положения результата в указанной
    рамке.
- row: detail
  col: 1
  kind: gr
  text: Q02.13 · Найти общесистемное правило обучения взрослых → норма, действующая для указанной категории и ступени.
- row: detail
  col: 2
  kind: gr
  text: Q19.01 · Определить содержание профессии → вид работ и требуемые компетенции.
- row: detail
  col: 2
  kind: gr
  text: Q19.02a · Установить порядок профессионального допуска → орган, процедура и требования для конкретной роли.
- row: detail
  col: 2
  kind: gr
  text: Q19.02b · Проверить индивидуальное решение о допуске → подтверждённый статус человека в конкретной юрисдикции.
- row: detail
  col: 2
  kind: gr
  text: Q19.03 · Проверить показатель труда или дохода → статистика по роли, территории, периоду и выборке.
- row: detail
  col: 2
  kind: gr
  text: Q19.04 · Найти стажировку или учебно-трудовое место → конкретное предложение практики с отбором и условиями.
- row: detail
  col: 2
  kind: gr
  text: Q19.05 · Найти конкретную рабочую возможность, связанную с обучением → вакансия с работодателем и условиями.
- row: detail
  col: 2
  kind: gr
  text: Q19.06 · Определить маршрут от обучения к работе → последовательность завершения, подтверждения и перехода
    в профессиональную роль.
- row: detail
  col: 2
  kind: gr
  text: Q19.07 · Проверить обязательность практики для завершения программы → условие учебного плана применимой
    версии.
- row: detail
  col: 2
  kind: gr
  text: Q19.08 · Установить ответственного за поиск практического места → предусмотренная роль учебной организации
    или обучающегося.
- row: detail
  col: 2
  kind: gr
  text: Q19.09 · Проверить обязательное вознаграждение за конкретную практику → применимые условия договора или
    нормы.
- row: detail
  col: 2
  kind: gr
  text: Q19.10 · Проверить зачёт практического опыта в программу → решение организации по определённому периоду
    опыта.
- row: detail
  col: 2
  kind: gr
  text: Q19.11 · Выяснить требования работодателя к учебной практике → опубликованные условия допуска к конкретному
    месту.
- row: detail
  col: 3
  kind: gr
  text: Q06.01 · Подобрать организации по критериям → список организаций с установленными факторами.
- row: detail
  col: 3
  kind: gr
  text: Q06.02a · Подобрать реализации программ → список реализаций, удовлетворяющих условиям поиска.
- row: detail
  col: 3
  kind: gr
  text: Q06.02b · Подобрать наборы → список отдельных наборов, удовлетворяющих условиям поиска.
- row: detail
  col: 3
  kind: gr
  text: Q06.03 · Подобрать отдельные занятия или учебные сессии → список конкретных занятий с расписанием и доступностью.
- row: detail
  col: 3
  kind: gr
  text: Q06.04 · Сопоставить выбранные предложения → таблица по одинаковым критериям и периоду.
- row: detail
  col: 3
  kind: gr
  text: Q06.05 · Проверить пригодность варианта для человека → профиль проверок по обязательным критериям и неизвестным.
- row: detail
  col: 3
  kind: gr
  text: Q06.06 · Сформировать короткий список → упорядоченные варианты с причинами отбора и отсечения.
- row: detail
  col: 3
  kind: gr
  text: Q06.07 · Установить причину отсутствия конкретного варианта в выдаче → сработавшее условие отбора или пробел
    данных.
- row: detail
  col: 3
  kind: gr
  text: Q06.08 · Найти пересечение расписаний выбранных занятий → интервалы, в которых участие конфликтует по времени.
- row: detail
  col: 3
  kind: gr
  text: Q06.09 · Проверить обеспеченность найденного варианта данными → перечень известных и отсутствующих параметров
    варианта.
- row: detail
  col: 3
  kind: gr
  text: Q06.10 · Сохранить выбранный вариант → запись о конкретном предложении в пользовательском списке.
- row: detail
  col: 3
  kind: gr
  text: Q06.11 · Подписаться на изменение выбранного параметра → зафиксированное условие уведомления для конкретного
    объекта.
- row: detail
  col: 3
  kind: gr
  text: Q06.12 · Сравнить маршруты по числу необходимых переходов → сопоставимая последовательность шагов для каждого
    маршрута.
- row: detail
  col: 4
  kind: gr
  text: Q03.01 · Найти конкретную организацию → проверенная идентичность и варианты названия.
- row: detail
  col: 4
  kind: gr
  text: Q03.02 · Найти подразделение → карточка подразделения и его место в организации.
- row: detail
  col: 4
  kind: gr
  text: Q03.03 · Найти площадку → карточка места обучения с адресом и привязкой.
- row: detail
  col: 4
  kind: gr
  text: Q03.04 · Найти сотрудника или представителя → человек с подтверждённой ролью в нужном процессе.
- row: detail
  col: 4
  kind: gr
  text: Q03.05a · Установить участие организации как исполнителя → подтверждённая роль в конкретной реализации.
- row: detail
  col: 4
  kind: gr
  text: Q03.05b · Установить организацию, ответственную за присуждение → подтверждённый участник для конкретной
    квалификации. Проверка формального права остаётся Q08.04.
- row: detail
  col: 4
  kind: gr
  text: Q03.06 · Разрешить омонимию организаций → различение филиалов, брендов, групп и юридических участников.
- row: detail
  col: 4
  kind: gr
  text: Q03.07 · Установить юридического участника за образовательным брендом → идентифицированное юридическое лицо
    для конкретной роли.
- row: detail
  col: 4
  kind: gr
  text: Q03.08 · Установить текущий статус работы площадки → подтверждённое состояние площадки на заданную дату.
- row: detail
  col: 4
  kind: gr
  text: Q03.11 · Найти профиль преподавателя конкретной реализации → подтверждённый участник и его роль.
- row: detail
  col: 4
  kind: gr
  text: Q03.12 · Установить принадлежность организации к сети → подтверждённая связь организации с сетью в заданный
    период.
- row: detail
  col: 5
  kind: gr
