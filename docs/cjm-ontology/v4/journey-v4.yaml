meta:
  title: MainExperts — CJM v4.0 · полный слой деталей
  subtitle: 22 ветви задач, 327 конечных задач и связанный коммерческий слой
  date: '2026-11-26'
  version: '4.0'
  source: CJM v3.0, глобальная онтология v2.0, агрегаты v4.0
header:
  job: Выбрать и реализовать доступный образовательный маршрут
  assumption: Вход возможен на любой задаче. Оплата и интерфейсные решения являются гипотезами, даже если в поиске
    наблюдается коммерческое намерение.
  legend:
  - kind: ghost
    text: Проектная гипотеза
  - kind: b
    text: Переход или сценарий
  - kind: g
    text: Бесплатный результат
  - kind: gr
    text: Данные и ограничения
  how_to_read: Обзор состояний и сценарии переходов открываются отдельно. Здесь 22 колонки классов задач v3, каждая
    применима на нескольких стадиях.
