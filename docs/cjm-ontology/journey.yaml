  text: 'Вход: Поисковая фраза «стоимость программы» имеет URL результата и дату обновления, сумма отсутствует. Ожидается: Записать наблюдение и классификацию вопроса. Цена имеет статус «неизвестно» до получения отдельного подтверждения суммы, валюты, периода и области действия.'
- row: traps
  col: 46
  kind: r
  text: 'Ошибка, которую выявляет проверка: Создание факта о цене из фразы, цифры трафика или даты выгрузки. HK, §3, AU, §3.'
