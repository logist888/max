# Карта пути по глобальной онтологии образовательного выбора v2.0 (26.11.2026).
# Собрана скриптом scripts/ontology_cjm/build_journey.py; формат — .claude/skills/cjm-map/README.md.
# Дословно из онтологии: листья Q, сценарии, ловушки, проверки, состояния, задачи портала. Привязка к колонкам и дорожки — выбор сборки.
meta:
  title: Образовательный выбор человека по глобальной онтологии MainExperts v2.0
  flow_title: 'Блок-схема пути: 22 ветви дерева вопросов в порядке прохождения образовательного маршрута'
  subtitle: Колонка блок-схемы — группа листьев дерева вопросов (глава 5). Дорожка — кто является стороной или источником ответа. Пунктир — возврат или связанная задача, красная стрелка — выход.
  date: '2026-11-26'
  version: '1.0'
  source: Глобальная онтология образовательного выбора, версия 2.0 от 26.11.2026 (vault/10-sources/2026-11-26-mainexperts-global-ontology-v2.pdf)
header:
  job: Выбрать образовательный маршрут, проверить его доступность, поступить, учиться и перейти к следующей ступени или работе (глава 1 онтологии)
  assumption: 'Что здесь из онтологии, а что выбрано при сборке. Из онтологии дословно: 327 листьев дерева вопросов Q01–Q22 (глава 5), запросы, ожидаемые модели и ловушки по 14 системам, отрицательные и дополнительные проверки (глава 9), цепочки состояний (глава 6), задачи портала (глава 10). Выбрано при сборке и в онтологии не задано: дорожки, порядок этапов, привязка сценариев, состояний, типов T и задач портала к колонкам, связи между шагами. Порядок этапов условный: человек возвращается к любым ветвям. Эмоций клиента в онтологии нет, ряд не заполнен. Спрос и частота запросов в онтологии не измерены.'
  legend:
  - kind: b
    text: Ветка дерева вопросов Q
  - kind: y
    text: 'Лист дерева: задача → результат; запрос человека; цель этапа'
  - kind: gr
    text: Дополнительная задача, тип T, дополнительная проверка
  - kind: g
    text: Что должен вернуть ответ
  - kind: r
    text: 'Ловушка: типичная ошибка'
  - kind: w
    text: Состояние объекта, задача портала
  how_to_read: 'Как читать: сверху блок-схема, колонка схемы — группа листьев дерева вопросов; под ней стикеры в тех же колонках. Пунктирные стрелки схемы — возвраты и связанные задачи, красные — выходы. Ряда эмоций нет: в онтологии их нет.'
