- row: states
  col: 14
  kind: w
  text: 'Набор. Объявлен → открыт → закрыт → завершён или отменён. Запускают: публикация, начало приёма, закрытие окна, завершение цикла или отмена.'
- row: states
  col: 32
  kind: w
  text: Попытка оценки. Запланирована → начата → сдана → результат опубликован. Апелляция меняет статус рассмотрения и при необходимости создаёт новую версию.
- row: states
  col: 50
  kind: w
  text: 'Финансирование. Инструмент найден → дело передано → поддержка утверждена → действует, приостановлена или прекращена. Запускают: подача, отдельное решение, исполнение условий и контроль сохранения.'
- row: states
  col: 53
  kind: w
  text: 'Разрешение. Дело передано → рассматривается → одобрено или отклонено → действует → истекло или прекращено. Запускают: решение органа, начало действия, отзыв, истечение или переход на новый статус.'
- row: states
  col: 25
  kind: w
  text: 'Регуляторный статус. Заявлен → подтверждён → действует → приостановлен, истёк или отозван. Запускают: решение или запись компетентной стороны и изменения в схеме.'
- row: states
  col: 43
  kind: w
  text: Квалификация и документ. Требования завершены → квалификация присуждена → документ выпущен. Три отдельных факта; документ может переиздаваться после выпуска.
- row: states
  col: 38
  kind: w
  text: Заявка. Отправка заявки, получение оператором и решение представлены отдельными событиями. Статус заявки хранится как состояние на дату (глава 4).
- row: states
  col: 40
  kind: w
  text: 'Предложение и зачисление. Из оффера нельзя вывести дату зачисления, факт оплаты или начало обучения: каждое утверждение строится по собственному событию и доказательству (глава 6).'
- row: states
  col: 28
  kind: w
  text: Допуск. Сначала находят действующее правило для области и категории, затем проверяют критерии на подтверждённых данных человека. Один отрицательный результат при «И» даёт «нет»; при отсутствии отрицаний и наличии неизвестного итог остаётся неизвестным. Допустимый путь означает право участвовать в процедуре, а не результат (глава 6).
