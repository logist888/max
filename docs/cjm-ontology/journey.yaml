# Карта пути по глобальной онтологии образовательного выбора v2.0 (26.11.2026).
# Собрана скриптом scripts/ontology_cjm/build_journey.py; формат — .claude/skills/cjm-map/README.md.
# Дословно из онтологии: листья Q, сценарии, ловушки, проверки, состояния, задачи портала. Привязка к колонкам и дорожки — выбор сборки.
meta:
  title: 'Образовательный выбор человека: онтология v2.0 и коммерческий слой v4.0'
  flow_title: 'Блок-схема пути: 22 ветви дерева вопросов в порядке прохождения образовательного маршрута'
  subtitle: Колонка блок-схемы — группа листьев дерева вопросов (глава 5). Дорожка — кто является стороной или источником ответа. Пунктир — возврат или связанная задача, красная стрелка — выход.
  date: '2026-11-27'
  version: '2.0'
  source: Глобальная онтология образовательного выбора v2.0 от 26.11.2026 (vault/10-sources/2026-11-26-mainexperts-global-ontology-v2.pdf); коммерческий слой — комплект MainExperts v4.0 от 26.11.2026 (vault/10-sources/2026-11-26-mainexperts-v4/, данные docs/cjm-ontology/v4/)
header:
  job: Выбрать образовательный маршрут, проверить его доступность, поступить, учиться и перейти к следующей ступени или работе (глава 1 онтологии)
  assumption: 'Что здесь из онтологии, а что выбрано при сборке. Из онтологии дословно: 327 листьев дерева вопросов Q01–Q22 (глава 5), запросы, ожидаемые модели и ловушки по 14 системам, отрицательные и дополнительные проверки (глава 9), цепочки состояний (глава 6), задачи портала (глава 10). Выбрано при сборке и в онтологии не задано: дорожки, порядок этапов, привязка сценариев, состояний, типов T и задач портала к колонкам, связи между шагами. Порядок этапов условный: человек возвращается к любым ветвям. Эмоций клиента в онтологии нет, ряд не заполнен. Спрос и частота запросов в онтологии не измерены. Слой v4.0 (комплект от 26.11.2026) добавлен рядами с пометкой «v4» и нижней дорожкой. Дословно из него: 26 услуг P01–P26, уровни D0–D3 и счётчики запросов, сценарии конверсии (кнопка, элемент, событие), получатель платежа, внешние платежи, состояния J01–J09, 14 региональных маршрутов. Выбрано при сборке: колонка стикеров услуги (первая группа её ветки Q), цвет узла предложения, сжатие текстов. Ограничения данных: уровень D3 означает коммерческую формулировку запроса, а не покупку; уровней D5 и D6 (собственные оплаты, окупаемость) нет; цен услуг в комплекте нет; рынки СНГ, кроме России, и Казахстан, Узбекистан в 14 системах отсутствуют.'
  legend:
  - kind: b
    text: Ветка Q; спрос в поиске по услуге (v4)
  - kind: y
    text: Лист дерева, запрос, цель этапа; решение, экран и кнопка (v4)
  - kind: gr
    text: Дополнительная задача, тип T, проверка; рынок (v4)
  - kind: g
    text: Что должен вернуть ответ; бесплатный результат (v4)
  - kind: r
    text: Ловушка; риск услуги (v4)
  - kind: w
    text: Состояние, задача портала; триггер, платёж, состояние J (v4)
  how_to_read: 'Как читать: сверху блок-схема, колонка схемы — группа листьев дерева вопросов (онтология v2.0). Нижняя дорожка «Предложение v4» — коммерческий слой: что платно предлагается в ветке (пунктир, гипотеза). Под схемой стикеры в тех же колонках: ряды без пометки — онтология, ряды «v4» — спрос, бесплатный результат, кнопки, платёж и риск по 26 услугам. Ряда эмоций нет: в данных их нет. Уровни D0–D3 — наблюдения поиска, не продажи: покупок MainExperts в данных нет (D5–D6 без данных).'
