  col: 29
  kind: g
  text: 'Вход: Для одной программы собраны разные пороги в двух последовательных циклах и два противоречащих источника об одном цикле. Ожидается: Сохранить обе версии с периодами и оба противоречащих свидетельства. Для указанного цикла вернуть применимую версию или конфликт с основанием. Исторический цикл остаётся доступным.'
- row: traps
  col: 29
