stickies:
- row: branch
  col: 1
  kind: b
  text: 'Q01 · Цель и личный маршрут. Листьев: 13'
- row: tasks
  col: 1
  kind: y
  text: 'Q01.01 Определить запрос обучающегося. Результат: сформулированная образовательная цель с носителем.'
- row: tasks
  col: 1
  kind: y
  text: 'Q01.02 Интерпретировать диагностику. Результат: результат измерения интересов или способностей с методикой.'
- row: tasks
  col: 1
  kind: y
  text: 'Q01.03 Установить ограничения выбора. Результат: индивидуальный профиль обязательных требований.'
- row: tasks
  col: 1
  kind: y
  text: 'Q01.04 Зафиксировать личные предпочтения. Результат: профиль желательных параметров и приоритетов.'
- row: tasks
  col: 2
  kind: y
  text: 'Q01.05 Связать желаемую роль с обучением. Результат: маршрут от текущей подготовки к компетенциям и квалификации.'
- row: tasks
  col: 2
  kind: y
  text: 'Q01.06 Определить ближайший шаг. Результат: следующее действие с входным условием и результатом.'
- row: tasks
  col: 2
  kind: y
  text: 'Q01.07 Построить запасной маршрут. Результат: альтернативная последовательность действий для известного риска.'
- row: tasks
  col: 3
  kind: gr
  text: 'Q01.08 Выявить противоречие обязательных ограничений маршрута. Результат: перечень несовместимых требований с основанием.'
- row: tasks
  col: 3
  kind: gr
  text: 'Q01.09 Установить исходную точку маршрута. Результат: подтверждённое состояние образования человека на дату.'
- row: tasks
  col: 3
  kind: gr
  text: 'Q01.10 Согласовать цель обучающегося и законного представителя. Результат: зафиксированная общая цель либо остающееся разногласие.'
- row: tasks
  col: 3
  kind: gr
  text: 'Q01.11 Проверить достижимость последовательности шагов по срокам. Результат: расчётная временная осуществимость маршрута.'
- row: tasks
  col: 3
  kind: gr
  text: 'Q01.12 Пересмотреть маршрут после изменения обстоятельств. Результат: новая версия индивидуального плана с причиной изменения.'
- row: tasks
  col: 3
  kind: gr
  text: 'Q01.13 Определить ценность конкретного навыка для личной цели. Результат: связанный с целью ожидаемый образовательный результат.'
- row: branch
  col: 4
  kind: b
  text: 'Q02 · Устройство систем, ступени и формы. Листьев: 14'
- row: tasks
  col: 4
  kind: y
  text: 'Q02.01 Установить рамку образования. Результат: описание применимой системы и её границ.'
- row: tasks
  col: 4
  kind: y
  text: 'Q02.02 Определить положение ступени. Результат: место уровня в конкретной рамке.'
- row: tasks
  col: 4
  kind: y
  text: 'Q02.03 Расшифровать формальный режим обучения. Результат: значение режима с его нормативным контекстом.'
- row: tasks
  col: 4
  kind: y
  text: 'Q02.04a Определить нормативный возраст входа на ступень. Результат: правило возраста с датой отсчёта и исключениями.'
- row: tasks
  col: 4
  kind: y
  text: 'Q02.04b Определить типовую предшествующую ступень. Результат: позиция в указанной образовательной системе и правило перехода.'
- row: tasks
  col: 5
  kind: y
  text: 'Q02.05 Найти типовой переход между ступенями. Результат: схема перехода с условиями.'
- row: tasks
  col: 5
  kind: y
  text: 'Q02.06 Определить роль подготовительной ступени. Результат: положение подготовки относительно целевой ступени.'
- row: tasks
  col: 5
  kind: y
  text: 'Q02.07 Сопоставить системы. Результат: отображение уровней с основанием и пределом эквивалентности.'
- row: tasks
  col: 6
  kind: gr
  text: 'Q02.08 Установить обязательность обучения. Результат: применимое правило для возраста, статуса и юрисдикции.'
- row: tasks
  col: 6
  kind: gr
  text: 'Q02.09 Определить полномочный орган для образовательной ступени. Результат: ответственный орган в конкретной системе.'
- row: tasks
  col: 6
  kind: gr
  text: 'Q02.10 Установить способ организации семейного или домашнего обучения. Результат: определённый в системе режим и его основания.'
- row: tasks
  col: 6
  kind: gr
  text: 'Q02.11 Расшифровать единицу учебной нагрузки в системе. Результат: определение меры и её область применения.'
- row: tasks
  col: 6
  kind: gr
  text: 'Q02.12 Проверить место краткой квалификации в рамке. Результат: наличие или отсутствие положения результата в указанной рамке.'
- row: tasks
  col: 6
  kind: gr
  text: 'Q02.13 Найти общесистемное правило обучения взрослых. Результат: норма, действующая для указанной категории и ступени.'
- row: goal
  stage: p1
  kind: y
  text: Сформулировать цель обучающегося и маршрут (Q01), понять устройство систем, ступеней и переходов (Q02)
- row: branch
  col: 7
  kind: b
  text: 'Q03 · Организация, подразделение, кампус и люди. Листьев: 11'
- row: tasks
  col: 7
  kind: y
  text: 'Q03.01 Найти конкретную организацию. Результат: проверенная идентичность и варианты названия.'
- row: tasks
  col: 7
  kind: y
  text: 'Q03.02 Найти подразделение. Результат: карточка подразделения и его место в организации.'
- row: tasks
  col: 7
  kind: y
  text: 'Q03.03 Найти площадку. Результат: карточка места обучения с адресом и привязкой.'
- row: tasks
  col: 7
  kind: y
  text: 'Q03.04 Найти сотрудника или представителя. Результат: человек с подтверждённой ролью в нужном процессе.'
- row: tasks
  col: 8
  kind: y
  text: 'Q03.05a Установить участие организации как исполнителя. Результат: подтверждённая роль в конкретной реализации.'
- row: tasks
  col: 8
  kind: y
  text: 'Q03.05b Установить организацию, ответственную за присуждение. Результат: подтверждённый участник для конкретной квалификации. Проверка формального права остаётся Q08.04.'
- row: tasks
  col: 8
  kind: y
  text: 'Q03.06 Разрешить омонимию организаций. Результат: различение филиалов, брендов, групп и юридических участников.'
- row: tasks
  col: 9
  kind: gr
  text: 'Q03.07 Установить юридического участника за образовательным брендом. Результат: идентифицированное юридическое лицо для конкретной роли.'
- row: tasks
  col: 9
  kind: gr
  text: 'Q03.08 Установить текущий статус работы площадки. Результат: подтверждённое состояние площадки на заданную дату.'
- row: tasks
  col: 9
  kind: gr
  text: 'Q03.11 Найти профиль преподавателя конкретной реализации. Результат: подтверждённый участник и его роль.'
- row: tasks
  col: 9
  kind: gr
  text: 'Q03.12 Установить принадлежность организации к сети. Результат: подтверждённая связь организации с сетью в заданный период.'
- row: branch
  col: 10
  kind: b
  text: 'Q04 · Программа, специализация и учебный план. Листьев: 18'
- row: tasks
  col: 10
  kind: y
  text: 'Q04.01 Идентифицировать программу. Результат: карточка программы и ответственная организация.'
- row: tasks
  col: 10
  kind: y
  text: 'Q04.02a Идентифицировать квалификацию, направление или профессию по коду. Результат: объект, классификатор и версия.'
- row: tasks
  col: 10
  kind: y
  text: 'Q04.02b Получить определение записи классификатора. Результат: описание и границы кода в конкретной версии.'
- row: tasks
  col: 10
  kind: y
  text: 'Q04.03 Определить учебный план. Результат: состав обязательных и выборных компонентов для версии программы.'
- row: tasks
  col: 10
  kind: y
  text: 'Q04.04a Определить учебную нагрузку. Результат: величина с единицей и периодом расчёта.'
- row: tasks
  col: 10
  kind: y
  text: 'Q04.04b Определить предусмотренные зачётные единицы. Результат: число кредитов с системой и правилами присвоения.'
- row: tasks
  col: 10
  kind: y
  text: 'Q04.05 Определить результат освоения. Результат: заявленные знания и компетенции программы.'
- row: tasks
  col: 11
  kind: y
  text: 'Q04.06 Определить присуждаемый результат. Результат: вид квалификации и ответственный за присуждение.'
- row: tasks
  col: 11
  kind: y
  text: 'Q04.07 Проверить встроенный подготовительный компонент. Результат: положение компонента и его роль в ходе программы.'
- row: tasks
  col: 11
  kind: y
  text: 'Q04.08 Разобрать совмещённую программу. Результат: связи между компонентами, провайдерами и присуждаемыми квалификациями.'
- row: tasks
  col: 11
  kind: y
  text: 'Q04.09 Проверить встроенную практику. Результат: часть плана, условия и ответственная сторона.'
