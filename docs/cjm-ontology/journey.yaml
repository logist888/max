  text: 'P23 · Проверка авторского эссе, мотивационного письма или портфолио. Уровень D3 (коммерческая формулировка): 4 390 запросов в 106 рынках; D3 1, D2 627, D1 3 762. Рынки проекта: AE 31 (D2); RU 49 (D2)'
- row: v4_decision
  col: 37
  kind: y
  text: P23 · Главный пилот отдельной услуги Продукт R04.
- row: v4_free
  col: 37
  kind: g
  text: 'P23 · Критерии и обезличенный пример обратной связи. Самостоятельно: Проверить критерии, формат, структуру и авторский черновик'
- row: v4_cta
  col: 37
  kind: y
  text: 'P23 · /{locale}/{destination}/applications/writing/. F: E13 «Посмотреть критерии проверки» → writing-rubric. A: E20 «Заказать разбор работы» → offer/r04. C: E20 «Заказать разбор работы» → checkout/r04'
- row: v4_trigger
  col: 37
  kind: w
  text: P23 · Нужна содержательная обратная связь в срок
- row: v4_payer
  col: 37
  kind: w
  text: 'P23 · MainExperts, разовая экспертная услуга. Платный результат: Размеченный авторский документ и список приоритетных исправлений. Исполнение: Загрузка после оплаты, один раунд проверки с нормой объёма.'
- row: v4_risk
  col: 37
  kind: r
  text: 'P23 · Бесплатно уже есть: Рубрики, образцы, школьные консультанты. Риск: Подмена авторства и нарушение правил приёмной организации'
- row: v4_demand
  col: 49
  kind: b
  text: 'P24 · Проверка заявки на финансирование. Уровень D2 (запрос инструмента или персонального результата): 131 запросов в 27 рынках; D3 0, D2 2, D1 129. Рынки проекта: AE 1 (D1); RU 1 (D1)'
- row: v4_decision
  col: 49
  kind: y
  text: P24 · Волна 2, отдельный пилот после P11 Продукт R11.
- row: v4_free
  col: 49
  kind: g
  text: 'P24 · Чек-лист одного фонда и ссылки. Самостоятельно: Найти правила фонда и пройти чек-лист'
- row: v4_cta
  col: 49
  kind: y
  text: 'P24 · /{locale}/{destination}/funding/check/. F: E13 «Открыть требования фонда» → fund-checklist. A: E20 «Заказать проверку заявки на грант» → offer/r11. C: E20 «Заказать проверку заявки на грант» → checkout/r11. O: E03 «Открыть сайт фонда» → official-funder'
- row: v4_trigger
  col: 49
  kind: w
  text: P24 · Высокая цена пропуска доказательства или срока
- row: v4_payer
  col: 49
  kind: w
  text: 'P24 · MainExperts, автоматика и эксперт на исключениях. Платный результат: Проверенный пакет под один фонд и список исправлений. Исполнение: Структурная проверка, эксперт сверяет доказательства и спорные правила.'
- row: v4_risk
  col: 49
  kind: r
  text: 'P24 · Бесплатно уже есть: Официальные инструкции фонда, стипендиальный офис. Риск: Пользователь ожидает одобрение финансирования или бесплатную помощь'
- row: v4_demand
  col: 37
  kind: b
  text: 'P25 · Перевод, заверение и доставка документов. Уровень D2 (запрос инструмента или персонального результата): 100 запросов в 5 рынках; D3 0, D2 14, D1 86. Рынки проекта: AE 3 (D1)'
- row: v4_decision
  col: 37
  kind: y
  text: P25 · Партнёрская операция отдельной цепочки Продукт R09.
- row: v4_free
  col: 37
  kind: g
  text: 'P25 · Источники о допустимом переводе, заверении и доставке. Самостоятельно: Выяснить, кто именно вправе подготовить допустимый документ'
- row: v4_cta
  col: 37
  kind: y
  text: 'P25 · /{locale}/{destination}/documents/. F: E13 «Уточнить требования к документу» → document-rules. A: E20 «Перейти к заказу у поставщика» → offer/r09. C: E20 «Перейти к заказу у поставщика» → partner-checkout/r09. O: E03 «Открыть список уполномоченных поставщиков» → authorized-service-list'
- row: v4_trigger
  col: 37
  kind: w
  text: P25 · Нужно заказать перевод, заверение или пересылку
- row: v4_payer
  col: 37
  kind: w
  text: 'P25 · партнёр принимает оплату и отвечает за исполнение. Платный результат: Документ или подтверждение доставки от партнёра. Исполнение: Внешнее бронирование, согласие на передачу, отслеживание у партнёра.'
- row: v4_risk
  col: 37
  kind: r
  text: 'P25 · Бесплатно уже есть: Принимающие учреждения публикуют требования и перечни исполнителей. Риск: Утечка данных и заказ документа недопустимого типа'
- row: v4_demand
  col: 37
  kind: b
  text: 'P26 · Контроль обязательных действий по нескольким заявкам. Уровень D0 (сигнала в выгрузках нет): 0 запросов в 0 рынках; D3 0, D2 0, D1 0. В России и ОАЭ запросов по услуге нет.'
- row: v4_decision
  col: 37
  kind: y
  text: P26 · Сезонный пилот после ручной проверки источников Продукт R05.
- row: v4_free
  col: 37
  kind: g
  text: 'P26 · Черновая доска статусов и известных действий. Самостоятельно: Вести календарь и задачи по каждой заявке'
- row: v4_cta
  col: 37
  kind: y
  text: 'P26 · /{locale}/{destination}/applications/track/. F: E26 «Собрать календарь заявок» → application-board-preview. A: E20 «Подключить контроль заявок» → offer/r05. C: E20 «Подключить контроль заявок» → checkout/r05. O: E03 «Перейти к официальной подаче» → official-application'
- row: v4_trigger
  col: 37
  kind: w
  text: P26 · Несколько заявок, смена статусов, зависимость задач
- row: v4_payer
  col: 37
  kind: w
  text: 'P26 · MainExperts, сезонный пропуск. Платный результат: Сезонная доска с источниками, версиями, уведомлениями и эскалациями. Исполнение: Автоматические уведомления, исправление ошибочных событий, без входа в чужие аккаунты.'
- row: v4_risk
  col: 37
  kind: r
  text: 'P26 · Бесплатно уже есть: Календари, университетские кабинеты, таблицы. Риск: Пропуск срока, неполные статусы и низкая повторяемость продаж'
- row: v4_region
  col: 37
  kind: gr
  text: 'RU · Россия / Москва, J05. Маршрут: Подача в вуз и выбор конкурсной группы. Официальный источник: Приёмная комиссия УУНиТ о Госуслугах. Бесплатно: Карточка набора, сроки, применимые каналы и ссылка в официальный сервис. Платное: Смысл платной проверки появляется при нескольких конкурсных группах или несогласованном комплекте.'
- row: v4_region
  col: 28
  kind: gr
  text: 'GB · Великобритания, J03. Маршрут: Бакалавриат с международной квалификацией. Официальный источник: UCAS. Бесплатно: Требования из источника, известные критерии и отметки о недостающих сведениях. Платное: Если сопоставление иностранной квалификации осталось неясным, предложить проверку человеком с трассировкой оснований.'
- row: v4_region
  col: 37
  kind: gr
  text: 'US · США, J05. Маршрут: Проверка авторского эссе в комплекте заявки. Официальный источник: EducationUSA. Бесплатно: Самопроверка авторского черновика по критериям программы. Платное: Платный письменный разбор доступен при готовом черновике и понятных сроках. Человек сохраняет авторство.'
- row: v4_region
  col: 16
  kind: gr
  text: 'CA · Канада, J02. Маршрут: Поиск программы на английском или французском. Официальный источник: EduCanada. Бесплатно: Фильтры и прямые ссылки на сопоставимые предложения и стоимость из источника. Платное: Персональный подбор уместен при нескольких ограничениях и проверяемой разнице по каждому варианту.'
- row: v4_region
  col: 25
  kind: gr
  text: 'CH · Швейцария, J03. Маршрут: Проверка официального статуса учреждения. Официальный источник: swissuniversities. Бесплатно: Прямая ссылка на перечень с датой просмотра и ясным предметом проверки. Платное: Платное досье уместно при требовании сверить несколько организаций, уровней или версий сведений.'
- row: v4_region
  col: 37
  kind: gr
  text: 'FR · Франция, J05. Маршрут: Выбор применимой процедуры подачи. Официальный источник: Service Public. Бесплатно: Проверка применимости по странице органа и отдельная ссылка на выбранный канал. Платное: Предложить проверку комплекта, если применимая процедура известна и пользователь видит состав результата.'
- row: v4_region
  col: 37
  kind: gr
  text: 'IT · Италия, J05. Маршрут: Предзачисление при международном поступлении. Официальный источник: Universitaly. Бесплатно: Пошаговый список с отдельными подтверждениями подачи, ответа учреждения и следующего процесса. Платное: Платёж за аудит пакета возможен после выбора программы и маршрута.'
- row: v4_region
  col: 43
  kind: gr
  text: 'ES · Испания, J03. Маршрут: Иностранная квалификация и требования вуза. Официальный источник: UNEDasiss. Бесплатно: Ссылки на требования вуза и UNEDasiss, критерии сопоставления. Платное: Работа с комплектом допустима после проверки применимости. Сбор органа проходит отдельно.'
- row: v4_region
  col: 25
  kind: gr
  text: 'AE · ОАЭ, J03. Маршрут: Проверка статуса выбранной программы. Официальный источник: Commission for Academic Accreditation. Бесплатно: Официальная карточка либо документированный пробел по совпадению. Платное: При несогласованных реестрах предложить проверку с перечнем источников и ручной верификацией.'
- row: v4_region
  col: 28
  kind: gr
  text: 'SG · Сингапур, J03. Маршрут: Подбор послешкольного маршрута. Официальный источник: Ministry of Education. Бесплатно: Справочник вариантов и ссылка на инструкцию MOE по подходящей процедуре. Платное: Платная персональная проверка имеет смысл при выборе нескольких различных маршрутов.'
- row: v4_region
  col: 37
  kind: gr
  text: 'HK · Гонконг, J05. Маршрут: Подача через JUPAS при соблюдении условий. Официальный источник: JUPAS. Бесплатно: Навигатор применимости, ссылка в JUPAS и отдельный маршрут проверки прямой подачи. Платное: Предложить аудит документов после выбора канала, если задача осталась открытой.'
- row: v4_region
  col: 49
  kind: gr
  text: 'CN · Китай, J03. Маршрут: Подготовка заявки на стипендию CSC. Официальный источник: Посольство КНР. Бесплатно: Официальные материалы по соответствующей кампании и персональный список вопросов. Платное: Аудит пакета рассматривается отдельно от официальной заявки. Кейсы различаются по стране и кампании.'
- row: v4_region
  col: 37
  kind: gr
  text: 'DE · Германия, J05. Маршрут: Подача с иностранным документом об образовании. Официальный источник: uni-assist. Бесплатно: Ссылка на применимый канал, список материалов и правило проверки реквизитов у официальной стороны. Платное: Внешний сбор за официальный процесс отделён от независимой проверки комплекта.'
- row: v4_region
  col: 16
  kind: gr
  text: 'AU · Австралия, J02. Маршрут: Сравнение программ в каталоге и проверка регистрационного статуса. Официальный источник: Study Australia. Бесплатно: Карточки сопоставимых программ с источником, датой и ссылкой к поставщику. Платное: Платный подбор уместен после исчерпания бесплатных фильтров или при сложных ограничениях.'
- row: v4_jstate
  col: 1
  kind: w
  text: 'J01 · Определить цель и попробовать. Классы Q01, Q02, Q19, Q21. Результат: Цель, ограничения и следующий проверяемый шаг. Развилка: Если цель известна, открыть поиск или известный набор напрямую. Переходы: J02: цель и ограничения сформулированы.'
- row: v4_jstate
  col: 4
  kind: w
  text: 'J02 · Найти варианты. Классы Q02, Q03, Q04, Q05, Q06, Q08, Q21. Результат: Короткий список конкретных вариантов и наборов со ссылками. Развилка: Нет подходящего набора — изменить ограничения, подписаться на обновление либо завершить поиск. Переходы: J03: выбран конкретный набор или список.'
- row: v4_jstate
  col: 10
  kind: w
  text: 'J03 · Сравнить условия и бюджет. Классы Q04, Q07, Q08, Q09, Q13, Q14, Q15, Q18. Результат: Сопоставимая смета, применимые критерии и неизвестные по вариантам. Развилка: Нет бюджета — проверить финансирование. При недостающих сведениях открыть источник или запросить уточнение. Переходы: J04: требуется подготовка; J05: применимые условия выполнены; J02: ограничение нельзя устранить для данного набора.'
- row: v4_jstate
  col: 13
  kind: w
  text: 'J04 · Подготовиться и проверить допуск. Классы Q05, Q08, Q09, Q13, Q15, Q20, Q10, Q21. Результат: Выполненные условия допуска, подготовка и полученные результаты оценивания. Развилка: При соблюдении условий перейти к заявке. Если неприменимы правила выбранного набора, найти другой. Переходы: J05: есть подтверждённые результаты и комплект.'
- row: v4_jstate
  col: 37
  kind: w
  text: 'J05 · Подать и отследить. Классы Q11, Q05, Q13, Q15, Q21. Результат: Проверенный комплект и статус подачи от принимающей стороны. Развилка: При недостающем документе вернуться к подготовке. Отправка подтверждается официальным каналом. Переходы: J06: получено решение принимающей стороны; J04: нужны повторная проверка или недостающий документ.'
- row: v4_jstate
  col: 40
  kind: w
  text: 'J06 · Разобрать решение и зачислиться. Классы Q12, Q14, Q15, Q16, Q18. Результат: Условия оффера, выбранное действие пользователя и отдельное подтверждение зачисления. Развилка: Отказ или истечение срока возвращает к поиску. Условный оффер возвращает к выполнению условий. Переходы: J07: нужны переезд и бытовая поддержка; J08: подтверждено зачисление и переезд не требуется; J04: нужно исполнить условия оффера; J02: отказ.'
- row: v4_jstate
  col: 43
  kind: w
  text: 'J07 · Организовать мобильность и быт. Классы Q13, Q14, Q15, Q16, Q18. Результат: Готовность к переезду и доступ к бытовой поддержке. Развилка: Порядок отдельных действий зависит от официальных требований. Для местного и дистанционного обучения шаг можно пропустить. Переходы: J08: подтверждено участие и выполнены применимые условия; J04: выявлено невыполненное применимое условие.'
- row: v4_jstate
  col: 58
  kind: w
  text: 'J08 · Учиться и применять. Классы Q17, Q18, Q19, Q20, Q21. Результат: Прогресс, доступ к поддержке и план учебных или карьерных действий. Развилка: При препятствиях открыть нужную помощь. При несовпадении цели оценить переход. Переходы: J09: завершение или решение сменить маршрут.'
- row: v4_jstate
  col: 64
  kind: w
  text: 'J09 · Завершить, сменить или выйти в профессию. Классы Q22, Q13, Q17, Q19, Q01. Результат: Подтверждённый переход, квалификация или новая цель. Развилка: Новая цель запускает параллельный маршрут с сохранением уже полученных результатов. Переходы: J01: появилась новая образовательная цель.'
