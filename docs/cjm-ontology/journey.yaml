  text: 'Германия. Ожидаемая модель: Вуз, работодатель, программа, её реализация и форма, практика или профессиональная подготовка, выдаваемые квалификации по каждому компоненту. VPD хранится как отдельный документ, а его необходимость проверяется по правилам приёма выбранного вуза.'
