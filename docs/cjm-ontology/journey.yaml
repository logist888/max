  col: 5
  kind: g
  text: 'Вход: В CA найдено слово Baccalauréat, в FR найдено такое же написание. Ожидается: Хранить самостоятельные понятия по системе и типу результата. До проверки устанавливать только совпадение меток. Допуск и признание рассчитываются отдельными правилами.'
- row: traps
  col: 5
  kind: r
  text: 'Ошибка, которую выявляет проверка: Автоматическое точное соответствие на основании строки. CA, §3, FR, §4.'
- row: expect
  col: 46
