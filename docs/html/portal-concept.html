<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Концепт портала Mainexperts: поиск обучения и профессий</title>
<style>
:root{
  --ink:#05203c;--bg:#f1f2f8;--card:#fff;--line:#e3e6ee;--mute:#5f6575;--gold:#0062e3;--gold-d:#0b4fc0;--blue:#0062e3;
  --vuz:#4a6fd0;--vuz-bg:#e6edfb;--col:#3f9a55;--col-bg:#e1f3e6;--pro:#8a5cc0;--pro-bg:#f0e7fa;--kp:#d08a3a;--kp-bg:#fdecd9;
  --bad:#c0392b;--r:14px;--price:#05203c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Arial,"DejaVu Sans",sans-serif}
html[dir=rtl] body{font-family:"Segoe UI","Noto Sans Arabic","DejaVu Sans",Arial,sans-serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:#05203c;color:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{font-weight:700;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo{font-size:22px;letter-spacing:-.4px}
.mlogo{width:34px;height:20px;display:block}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;color:#cfd9e8;padding:8px 12px;border-radius:8px}
.nav button:hover,.nav button.on{background:#12335a;color:#fff}
.sp{flex:1}
.ctx{display:flex;gap:8px;align-items:center;font-size:13px;color:#cfcfcf;flex-wrap:wrap}
.ctx select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:5px 8px;font:inherit}
.badge{display:inline-block;background:#0062e3;color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:1px 8px;min-width:20px;text-align:center}
.tgl{display:flex;align-items:center;gap:6px;font-size:13px;color:#e8e8e8;cursor:pointer;user-select:none}
.tgl input{accent-color:var(--gold)}
.tgl-f{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.tgl-f input{accent-color:var(--gold-d)}
main{padding:0 0 60px}
h1{font-size:36px;line-height:1.15;margin:0 0 10px}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 6px}
.lead{font-size:17px;max-width:760px}
.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
.btn:hover{background:#0c3258}
.btn.gold{background:#0062e3;border-color:#0062e3;color:#fff}
.btn.gold:hover{background:#0b4fc0}
.btn.ghost{background:#fff;color:var(--ink);border-color:#bdbdbd}
.btn.ghost:hover{background:#f0f0f0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)}h1{font-size:27px}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef0f5;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px}
.chip.btnlike{cursor:pointer;background:#fff}.chip.btnlike:hover{border-color:var(--gold-d);background:#faf6ec}
.chip.known{background:#eef7f0;border-color:#bfdcc7}
.chip .x{cursor:pointer;color:#888}
.tag{display:inline-block;border-radius:6px;font-size:12px;padding:1px 8px;font-weight:600}
.tag.hyp{background:#fff1cf;color:#7a5b00;border:1px dashed #c9a43a}
.tag.demo{background:#eceef3;color:#555}
.tag.open{background:#fde4e1;color:#8a2b20}
/* язык, как на mainexperts-search */
.flag{display:inline-block;width:26px;height:26px;border-radius:50%;border:1px solid #dce2e7;box-shadow:0 1px 3px #17323d15;flex-shrink:0;overflow:hidden;vertical-align:middle}
.flag-ru{background:linear-gradient(#fff 0 33.33%,#16449a 33.33% 66.66%,#d82e39 66.66%)}
.flag-en{background:linear-gradient(90deg,transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(45deg,transparent 44%,#fff 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#fff 44% 56%,transparent 56%),#174b8f}
.flag-de{background:linear-gradient(#171717 0 33%,#d32f38 33% 66%,#e9bd36 66%)}
.flag-fr{background:linear-gradient(90deg,#2455a0 33%,#fff 33% 66%,#d93546 66%)}
.flag-it{background:linear-gradient(90deg,#149766 33%,#fff 33% 66%,#d93546 66%)}
.flag-es{background:linear-gradient(#be2636 25%,#f4ca38 25% 75%,#be2636 75%)}
.flag-cn{background:#d93637;position:relative}
.flag-cn:before{content:'★';color:#ffdf5d;font-size:13px;margin-left:3px}
.flag-ae,.flag-ar{background:linear-gradient(90deg,#d73742 28%,transparent 28%),linear-gradient(#19935d 33%,#fff 33% 66%,#1c2731 66%)}
.flag-kk{background:radial-gradient(circle at 50% 50%,#fec50c 0 24%,transparent 25%),#00afca}
.flag-uz{background:linear-gradient(#0099b5 0 31%,#d32f38 31% 34%,#fff 34% 66%,#d32f38 66% 69%,#1eb53a 69%)}
.reg-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:0;border-radius:8px;color:#dfe8f6;padding:8px 14px;font-size:13px}
.reg-btn:hover{background:rgba(255,255,255,.18)}
.reg-btn .flag{width:20px;height:14px;border-radius:2px;border:0}
.reg-btn .mob{display:none}
@media(max-width:640px){
 header.top .wrap{gap:8px 10px;min-height:0;padding-top:6px;padding-bottom:6px}
 .ltxt{display:none}
 .logo{margin-inline-end:auto}
 .mlogo{width:38px;height:22px}
 .nav{order:3;width:100%;gap:2px;margin:0 -4px}
 .nav button{padding:6px 10px;font-size:14px}
 .reg-btn{padding:6px 10px;gap:6px;font-weight:600}
 .reg-btn .dsk{display:none}
 .reg-btn .mob{display:inline}
 .ctx{gap:6px;flex-wrap:nowrap}
 .heart-btn svg{width:26px;height:26px}
 .login-btn{padding:8px 12px;font-size:13px}
 .avatar{width:32px;height:32px}
}
.heart-btn{position:relative;background:none;border:0;color:#fff;padding:6px;border-radius:8px;line-height:0}
.heart-btn:hover{background:rgba(255,255,255,.12)}
.heart-btn svg{width:28px;height:28px}
.heart-btn .badge{position:absolute;top:-2px;inset-inline-end:-4px;font-size:11px;padding:0 6px;min-width:18px}
.login-btn{background:#e5e8ee;border:0;border-radius:8px;color:#05203c;padding:10px 18px;font-weight:700}
.login-btn:hover{background:#fff}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#0062e3;color:#fff;font-weight:700;border:0}
.flag-c-ru{background:linear-gradient(#fff 0 33.33%,#16449a 33.33% 66.66%,#d82e39 66.66%)}
.flag-c-kz{background:radial-gradient(circle at 50% 50%,#fec50c 0 24%,transparent 25%),#00afca}
.flag-c-ae{background:linear-gradient(90deg,#d73742 28%,transparent 28%),linear-gradient(#19935d 33%,#fff 33% 66%,#1c2731 66%)}
.flag-c-uz{background:linear-gradient(#0099b5 0 31%,#d32f38 31% 34%,#fff 34% 66%,#d32f38 66% 69%,#1eb53a 69%)}
.flag-c-gb{background:linear-gradient(90deg,transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(45deg,transparent 44%,#fff 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#fff 44% 56%,transparent 56%),#174b8f}
.flag-c-xx{background:radial-gradient(circle at 35% 35%,#7fc8ff,#1b6fd6)}
/* баннер-карусель, статьи, вопросы и ответы, подвал */
.banner{position:relative;border-radius:16px;overflow:hidden;min-height:340px;margin:6px 0 28px;color:#fff;background:#05203c}
.banner .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
.banner .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,32,60,.92) 0%,rgba(5,32,60,.7) 45%,rgba(5,32,60,.1) 100%)}
.banner .in{position:relative;padding:44px 48px;max-width:640px;animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.banner h2{font-size:40px;line-height:1.05;letter-spacing:-1.2px;margin:12px 0 10px;color:#fff}
.banner p{font-size:17px;margin:0 0 20px;color:#e3ecf9}
.banner .bd{display:inline-block;background:#bfe0ff;color:#05203c;font-weight:800;border-radius:999px;padding:5px 14px;font-size:13px;letter-spacing:.5px}
.banner .wb{background:#fff;color:#05203c;border:0;border-radius:8px;padding:12px 20px;font-weight:700;font-size:15px}
.banner .wb:hover{background:#e6eefb}
.banner .dots{position:absolute;bottom:14px;inset-inline-start:48px;display:flex;gap:8px}
.banner .dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.4);padding:0}
.banner .dots button.on{background:#fff;width:26px;border-radius:6px}
.banner.pic{min-height:0;background:#1a1228}
.banner .bpic{display:block;width:100%;height:auto;aspect-ratio:1068/344;object-fit:cover}
.banner .hot{position:absolute;inset:0;background:transparent;border:0;cursor:pointer}
.banner picture{display:block}
@media(max-width:640px){.banner.sq .bpic{aspect-ratio:1/1}}
.banner.pic .dots{inset-inline-start:auto;inset-inline-end:18px;bottom:14px;z-index:2}
.banner.pic .dots button{background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.banner.pic .dots button.on{background:#fff}
@media(max-width:640px){.banner .in{padding:28px 22px}.banner h2{font-size:28px}.banner .dots{inset-inline-start:22px}}
.arts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.arts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.arts{grid-template-columns:1fr}}
.art{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:start;padding:0;cursor:pointer;display:flex;flex-direction:column}
.art:hover{box-shadow:0 6px 22px rgba(20,30,60,.15)}
.art img{width:100%;height:130px;object-fit:cover;display:block}
.art .b{padding:12px 14px 16px}
.art .tg{font-size:12px;font-weight:700;color:#0062e3;text-transform:uppercase;letter-spacing:.4px}
.art h3{font-size:16px;margin:4px 0 6px;line-height:1.25}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media(max-width:760px){.faq{grid-template-columns:1fr}}
.faq details{border-bottom:1px solid #cfd6e3;padding:14px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"⌄";font-size:18px;line-height:1}
.faq details[open] summary::after{content:"⌃"}
.faq p{margin:10px 0 0;color:#2b3a52;font-size:15px}
.sitefoot{background:#05203c;color:#dfe8f6;margin-top:40px;padding:38px 0 26px}
.sitefoot .cols{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:28px}
@media(max-width:860px){.sitefoot .cols{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.sitefoot .cols{grid-template-columns:1fr}}
.sitefoot h4{margin:0 0 12px;font-size:15px;color:#fff}
.sitefoot a{display:block;color:#dfe8f6;text-decoration:none;margin:9px 0;font-size:14px;cursor:pointer}
.sitefoot a:hover{text-decoration:underline}
.sitefoot .ctry{display:flex;align-items:center;gap:8px}
.sitefoot .ctry .flag{width:22px;height:14px;border-radius:2px;border:0}
.sitefoot .copy{border-top:1px solid #163a63;margin-top:26px;padding-top:18px;text-align:center;font-size:13px;color:#b7c7de}
.sitefoot .cols.cc{grid-template-columns:repeat(3,1fr);gap:4px 28px}
@media(max-width:520px){.sitefoot .cols.cc{grid-template-columns:1fr 1fr}}
.lightbar{padding:14px 0 26px;color:var(--mute);font-size:13px}
/* заставка и cookies */
#splash{position:fixed;inset:0;background:#0a1f3c;display:flex;align-items:center;justify-content:center;z-index:300;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .ring{position:relative;width:200px;height:200px}
#splash .arc{position:absolute;inset:0;animation:spin 1.1s linear infinite}
#splash .lg{position:absolute;left:52px;top:68px;width:96px;height:56px}
@keyframes spin{to{transform:rotate(360deg)}}
.cookie{position:fixed;left:0;right:0;bottom:0;background:#05203c;color:#fff;z-index:90;padding:16px 0;box-shadow:0 -6px 24px rgba(5,32,60,.35);transform:translateY(110%);transition:transform .45s}
.cookie.on{transform:none}
.cookie .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cookie p{flex:1;min-width:260px;margin:0;font-size:14px;color:#dfe8f6}
.cookie .btn{border-radius:8px}
.cookie .btn.w{background:#fff;color:#05203c;border-color:#fff}
.cookie .btn.o{background:transparent;border-color:#8aa3c7;color:#fff}
.ck-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e3e6ee}
/* окно регистрации (по образцу Skyscanner) */
.auth{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
@media(max-width:700px){.auth{grid-template-columns:1fr}.auth-art{display:none}}
.auth .brand{font-weight:800;font-size:24px;color:#0062e3;margin-bottom:10px;letter-spacing:-.4px}
.auth h2{font-size:30px;line-height:1.1;margin:0 0 10px;letter-spacing:-.8px}
.auth .tx{font-size:16px;margin:0 0 16px}
.auth label{font-size:12px;font-weight:700}
.auth input[type=email]{border-radius:8px;padding:13px 14px;font-size:16px}
.auth .next{width:100%;margin-top:10px;padding:14px;font-size:16px}
.auth .or{text-align:center;margin:8px 0;font-size:14px}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.soc button{background:#e5e8ee;border:0;border-radius:8px;padding:13px;font-weight:700;font-size:14px}
.soc button:hover{background:#d6dae2}
.auth .stay{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-weight:400;font-size:15px}
.auth .legal{font-size:11.5px;color:#52627a;margin-top:8px}
.auth .skip{display:inline-block;margin-top:10px;font-size:14px;text-decoration:underline;cursor:pointer;color:#05203c;background:none;border:0;padding:0}
.auth .err{color:#c0392b;font-size:13px;margin-top:6px;min-height:18px}
.auth-art{position:relative}
.auth-art img{width:100%;border-radius:10px;display:block}
.auth-art .av{position:absolute;inset-inline-end:-18px;top:46%;width:74px;height:74px;border-radius:50%;background:#9fe8c3;display:flex;align-items:center;justify-content:center}
.auth-close{position:absolute;inset-inline-end:16px;top:12px;background:none;border:0;font-size:28px;line-height:1;color:#05203c}
.modal.wide{max-width:880px;position:relative;padding:30px}
.reg label{display:flex;align-items:center;gap:8px;font-size:14px;margin:16px 0 6px}
.reg select{padding:12px;font-size:16px;border-radius:8px}
.reg .swl{margin-inline-start:auto;font-size:14px;text-decoration:underline;cursor:pointer;background:none;border:0;color:#05203c;padding:0;font-weight:600}
.lang-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:700px){.lang-menu{grid-template-columns:1fr 1fr}}
.lang-menu button{display:flex;align-items:center;gap:12px;background:#edf3f7;color:#294451;border:0;border-radius:15px;padding:16px;font-size:14px;text-align:start;min-height:70px}
.lang-menu button.on{box-shadow:inset 0 0 0 1px #75a6b8;background:#e2f0f5}
.lang-menu button:disabled{opacity:.45;cursor:not-allowed}
.lang-menu small{font-size:10px;margin-inline-start:auto}
.lang-menu .chk{margin-inline-start:auto;color:#2a7a9a;font-weight:700}
/* герой и панель поиска, как у авиабилетов */
.hero{background:#05203c;color:#fff;padding:34px 0 60px}
.hero .lead{color:#c9d6ea}
.hero h1{margin:0}
.hline{font-size:clamp(26px,3.6vw,42px);font-weight:600;letter-spacing:-1px;color:#8db8ff;min-height:54px;margin:4px 0 6px}
.caret{font-weight:300;color:#9fb2e8;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.tab{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:9px 18px;font-weight:600;display:flex;gap:8px;align-items:center}
.tab i{width:10px;height:10px;border-radius:3px;display:inline-block;background:#fff;opacity:.8}
.tab:hover:not(.on){background:rgba(255,255,255,.14)}
.tab.on{background:#0062e3;border-color:#0062e3;color:#fff}
.tab.on i{background:#fff;opacity:1}
.panel{background:transparent;color:#fff;padding:0;display:flex;gap:6px;flex-wrap:wrap;color-scheme:dark}
.pf{flex:1;min-width:150px;padding:10px 16px;background:rgba(255,255,255,.12);border-radius:10px;position:relative}
.pf label{font-size:12px;color:#b9c8de;font-weight:500;margin:0}
.pf input,.pf select{border:0;padding:3px 0;font-size:16px;font-weight:600;background:transparent;outline:none;width:100%;border-radius:0;color:#fff}
.pf select option{color:#111;background:#fff}
.pf input::placeholder{color:#9db0cb}
.pf.miss{outline:2px solid #ff7b7b;background:rgba(255,90,90,.2)}
.pf.miss label{color:#ffb3b3}
.panel .go{align-self:stretch;min-width:130px;border-radius:10px;font-size:17px}
.compact .hero{padding:14px 0 22px}
.compact .tabs{margin:0 0 12px}
.sub{padding-top:24px}
/* выдача */
.res{display:grid;grid-template-columns:250px 1fr;gap:18px}
@media(max-width:900px){.res{grid-template-columns:1fr}}
.cal{display:flex;gap:8px;overflow:auto;margin:14px 0}
.cal button{flex:1;min-width:120px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;text-align:start}
.cal button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.cal button b{display:block;font-size:13px;color:var(--mute);font-weight:500}
.cal button span{font-size:17px;font-weight:700;color:var(--price)}
.sort{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.sort button{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:600}
.sort button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ac{display:grid;grid-template-columns:230px 1fr 210px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,30,60,.05)}
.ac:hover{box-shadow:0 6px 22px rgba(20,30,60,.13)}
@media(max-width:820px){.ac{grid-template-columns:1fr}}
.ac-img{position:relative;min-height:170px;background:#dde3f2}
.ac-img img{width:100%;height:100%;object-fit:cover;display:block}
.ac-img .lab{position:absolute;inset-inline-start:8px;top:8px;font-size:11px;font-weight:600;color:#fff;border-radius:6px;padding:1px 8px}
.ac-mid{padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.ac-mid h3{font-size:18px;margin:0}
.ac-price{padding:14px 16px;border-inline-start:1px dashed var(--line);display:flex;flex-direction:column;gap:5px;justify-content:center;background:#fcfcfe}
@media(max-width:820px){.ac-price{border-inline-start:0;border-top:1px dashed var(--line)}}
.price{font-size:24px;font-weight:800;color:var(--price);line-height:1.1}
.price small{font-size:13px;font-weight:500;color:var(--mute)}
.kv{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:#333}
.bar{height:7px;background:#e8e8e8;border-radius:5px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--c,#777)}
.fav{border:0;background:none;font-size:22px;line-height:1;color:#999;padding:2px 6px}
.fav.on{color:#d6a100}
.cmp{font-size:13px}
.slot{margin:14px 0}
.plash{border:1.5px solid var(--gold);background:#fbf6e8;border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.plash .t{flex:1;min-width:240px}
.plash .x{background:none;border:0;font-size:20px;color:#888}
.cmpbar{position:sticky;bottom:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(10,10,10,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:22px;max-height:92vh;overflow:auto}
.opt-card{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;cursor:pointer;background:#fff}
.opt-card:hover{border-color:var(--gold-d);background:#fdfaf2}
.opt-card .t{flex:1;min-width:220px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;display:none;max-width:90vw}
.toast.on{display:block}
.anno{display:none;background:#fff8d9;border:1px dashed #b79a2a;border-radius:8px;font-size:12.5px;color:#5a4a00;padding:6px 10px;margin:8px 0;direction:ltr;text-align:left}
body.anno-on .anno{display:block}
table.map{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}
table.map th,table.map td{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
table.map th{background:#f0ece0}
footer{border-top:1px solid var(--line);padding:16px 0 30px;color:var(--mute);font-size:13px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:start}
.tile:hover{border-color:var(--gold-d);background:#fdfaf2}
.tile q{font-weight:600;display:block;margin-bottom:3px}
.pop{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:start;padding:0}
.pop:hover{box-shadow:0 6px 22px rgba(20,30,60,.15)}
.pop img{width:100%;height:120px;object-fit:cover;display:block}
.pop div{padding:10px 14px}
.pop b{display:block}
.pop .price{font-size:18px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 5px}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;border:1px solid #c9c9c9;border-radius:9px;padding:9px 11px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:14px}
.field.req label::after{content:" *";color:var(--bad)}
.field.miss input,.field.miss select{border-color:var(--bad);background:#fff7f6}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid #c9c9c9;background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt:hover:not(.on){border-color:#777}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
details.more{border:1px dashed #bdbdbd;border-radius:10px;padding:10px 14px;background:#fff}
details.more summary{cursor:pointer;font-weight:600}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.step{flex:1;min-width:190px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;justify-content:center;align-items:center;font-size:13px;margin-bottom:6px}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;background:#eceef3}
.sttl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>

const DICT=[["В какой вуз поступить?", "Which university to apply to?", "Қай университетке түсу керек?", "Qaysi universitetga kirish kerak?", "في أي جامعة تلتحق؟"], ["Найдите место, где ребёнку захочется учиться.", "Find the place where your child will want to study.", "Баласы оқығысы келетін жерді табыңыз.", "Bolangiz o‘qishni xohlaydigan joyni toping.", "اعثر على المكان الذي سيرغب طفلك في الدراسة فيه."], ["Подобрать вуз", "Find a university", "Университет таңдау", "Universitet tanlash", "اختيار جامعة"], ["Любит рисовать. Кем станет?", "Loves to draw. What will they become?", "Сурет салғанды жақсы көреді. Кім болады?", "Rasm chizishni yaxshi ko‘radi. Kim bo‘ladi?", "يحب الرسم. ماذا سيصبح؟"], ["Откройте профессии, в которых пригодится талант вашего ребёнка.", "Discover professions where your child's talent will be useful.", "Балаңыздың таланты қажет болатын мамандықтарды ашыңыз.", "Farzandingiz iste’dodi kerak bo‘ladigan kasblarni kashf eting.", "اكتشف المهن التي ستفيد فيها موهبة طفلك."], ["Найти профессию", "Find a profession", "Мамандық табу", "Kasb topish", "البحث عن مهنة"], ["Следующий шаг — университет", "The next step is university", "Келесі қадам – университет", "Keyingi qadam – universitet", "الخطوة التالية: الجامعة"], ["Выберите колледж для подготовки к поступлению в вуз.", "Choose a college to prepare for university admission.", "Университетке түсуге дайындалу үшін колледжді таңдаңыз.", "Universitetga kirishga tayyorlanish uchun kollejni tanlang.", "اختر كلية للاستعداد للالتحاق بالجامعة."], ["Найти колледж", "Find a college", "Колледж табу", "Kollej topish", "البحث عن كلية"], ["Лето с пользой и интересом", "A summer of use and fun", "Жаз пайдамен әрі қызықты", "Yoz foyda va qiziqish bilan", "صيف مفيد وممتع"], ["Выберите короткую программу, которая увлечёт ребёнка.", "Choose a short program that will fascinate your child.", "Баланы қызықтыратын қысқа бағдарламаны таңдаңыз.", "Bolani qiziqtiradigan qisqa dasturni tanlang.", "اختر برنامجًا قصيرًا يشد اهتمام طفلك."], ["Найти программу", "Find a program", "Бағдарлама табу", "Dastur topish", "البحث عن برنامج"], ["Бесплатно", "Free", "Тегін", "Bepul", "مجانًا"], ["Не знаете, с чего начать?", "Not sure where to start?", "Қайдан бастарды білмейсіз бе?", "Nimadan boshlashni bilmayapsizmi?", "لا تعرف من أين تبدأ؟"], ["Мы рекомендуем начать с бесплатного теста: он покажет сильные стороны ребёнка и подскажет направление.", "We recommend starting with the free test: it shows your child's strengths and suggests a direction.", "Тегін тесттен бастауды ұсынамыз: ол баланың күшті жақтарын көрсетіп, бағытты айтады.", "Bepul testdan boshlashni tavsiya qilamiz: u bolaning kuchli tomonlarini ko‘rsatadi va yo‘nalishni aytadi.", "ننصح بالبدء بالاختبار المجاني: يُظهر نقاط قوة طفلك ويقترح الاتجاه."], ["Пройти бесплатный тест", "Take the free test", "Тегін тесттен өту", "Bepul testdan o‘tish", "ابدأ الاختبار المجاني"], ["Профориентация", "Career guidance", "Кәсіптік бағдар", "Kasb tanlash yo‘nalishi", "التوجيه المهني"], ["Кем может стать ваш ребёнок?", "What can your child become?", "Балаңыз кім бола алады?", "Farzandingiz kim bo‘la oladi?", "ماذا يمكن أن يصبح طفلك؟"], ["Подробный разбор интересов и способностей и подходящие профессии с данными о спросе.", "A detailed review of interests and abilities and matching professions with demand data.", "Қызығушылықтар мен қабілеттердің толық талдауы және сұраныс деректері бар қолайлы мамандықтар.", "Qiziqish va qobiliyatlarning batafsil tahlili hamda talab ma’lumotlari bilan mos kasblar.", "تحليل مفصل للاهتمامات والقدرات والمهن المناسبة مع بيانات الطلب."], ["Узнать про профориентацию", "Learn about career guidance", "Кәсіптік бағдар туралы білу", "Kasb yo‘nalishi haqida bilish", "تعرّف على التوجيه المهني"], ["Не пропустите срок подачи", "Don't miss the application deadline", "Құжат тапсыру мерзімін өткізіп алмаңыз", "Topshirish muddatini o‘tkazib yubormang", "لا تفوّت موعد التقديم"], ["Сохраните подборку и получайте напоминания за 30 дней до срока подачи.", "Save your selection and get reminders 30 days before the deadline.", "Іріктемені сақтап, мерзімге 30 күн қалғанда еске салу алыңыз.", "Tanlovni saqlang va muddatga 30 kun qolganda eslatma oling.", "احفظ قائمتك واحصل على تذكيرات قبل 30 يومًا من الموعد."], ["Короткие программы на лето", "Short summer programs", "Жазғы қысқа бағдарламалар", "Yozgi qisqa dasturlar", "برامج صيفية قصيرة"], ["Даты, формат и цены в вашей валюте: онлайн и очно.", "Dates, format and prices in your currency: online and in person.", "Күндері, форматы және бағасы сіздің валютаңызда: онлайн және күндізгі.", "Sanalar, format va narxlar sizning valyutangizda: onlayn va kunduzgi.", "التواريخ والصيغة والأسعار بعملتك: عن بُعد وحضوريًا."], ["Смотреть программы", "View programs", "Бағдарламаларды көру", "Dasturlarni ko‘rish", "عرض البرامج"], ["Советы и тренды", "Tips and trends", "Кеңестер мен трендтер", "Maslahatlar va trendlar", "نصائح واتجاهات"], ["Как выбрать вуз", "How to choose a university", "Университетті қалай таңдау керек", "Universitetni qanday tanlash kerak", "كيف تختار جامعة"], ["Лето", "Summer", "Жаз", "Yoz", "الصيف"], ["С чего начать выбор вуза: пять вопросов", "Where to start choosing a university: five questions", "Университет таңдауды неден бастау керек: бес сұрақ", "Universitet tanlashni nimadan boshlash kerak: beshta savol", "من أين تبدأ باختيار الجامعة: خمسة أسئلة"], ["Страна, уровень, год поступления, направление, бюджет: что решить в первую очередь.", "Country, level, admission year, subject, budget: what to decide first.", "Ел, деңгей, түсу жылы, бағыт, бюджет: алдымен нені шешу керек.", "Davlat, daraja, qabul yili, yo‘nalish, byudjet: avval nimani hal qilish kerak.", "الدولة والمستوى وسنة القبول والتخصص والميزانية: ما الذي تقرره أولًا."], ["Кем будет работать мой ребёнок: как читать данные о спросе", "What will my child do for a living: how to read demand data", "Балам кім болып жұмыс істейді: сұраныс деректерін қалай оқу керек", "Farzandim kim bo‘lib ishlaydi: talab ma’ олледжи, профессии или короткие программы), отвечаете на несколько вопросов и получаете подборку с ценами и сроками. Недостающее мы спрашиваем, известное — нет.", "You choose a direction (universities, colleges, professions or short programs), answer a few questions and get a selection with prices and dates. We ask only for what is missing.", "Сіз бағытты таңдайсыз (университеттер, колледждер, мамандықтар немесе қысқа бағдарламалар), бірнеше сұраққа жауап беріп, баға мен мерзімі бар іріктеме аласыз. Тек жетпегенін сұраймыз.", "Siz yo‘nalishni tanlaysiz (universitetlar, kollejlar, kasblar yoki qisqa dasturlar), bir nechta savolga javob berasiz va narx hamda muddatlar bilan tanlov olasiz. Faqat yetishmaganini so‘raymiz.", "تختار اتجاهًا (جامعات أو كليات أو مهنًا أو برامج قصيرة) وتجيب عن بضعة أسئلة وتحصل على قائمة بالأسعار والمواعيد. نسأل فقط عمّا ينقص."], ["Поиск платный?", "Is the search paid?", "Іздеу ақылы ма?", "Qidiruv pullikmi?", "هل البحث مدفوع؟"], ["В концепте поиск и подборка бесплатные. Состав и цены платных услуг и подробного отчёта пока не заданы.", "In this concept search and selection are free. The content and prices of paid services and the detailed report are not set yet.", "Тұжырымдамада іздеу мен іріктеме тегін. Ақылы қызметтер мен толық есептің құрамы мен бағасы әлі белгіленбеген.", "Konsepsiyada qidiruv va tanlov bepul. Pullik xizmatlar va batafsil hisobotning tarkibi hamda narxi hali belgilanmagan.", "في هذا المفهوم البحث والقوائم مجانية. لم تُحدَّد بعد محتويات وأسعار الخدمات المدفوعة والتقرير المفصل."], ["Откуда данные о ценах и сроках?", "Where do prices and dates come from?", "Баға мен мерзім деректері қайдан алынады?", "Narx va muddat ma’lumotlari qayerdan olinadi?", "من أين تأتي بيانات الأسعار والمواعيد؟"], ["Каждое число показывается с источником и датой. В этом концепте все данные демонстрационные.", "Every figure is shown with its source and date. In this concept all data is for demonstration.", "Әр сан дереккөзімен және күнімен көрсетілед function resList(){
  const wd=(arr,d)=>arr.map(x=>Object.assign({d},x));
  let list;
  if(S.d==="vuz"||S.d==="col"){
    if(S.profFilter){const p=item(S.profFilter);list=wd(DATA.vuz,"vuz").concat(wd(DATA.col,"col")).filter(x=>x.pros&&x.pros.includes(p.id))}
    else list=wd(DATA[S.d],S.d);
  }else list=wd(DATA[S.d],S.d);
  // фильтр по цене
  if(S.d!=="pro"){const mx=Math.max(...list.map(x=>x.p),1)*S.maxPct/100;list=list.filter(x=>x.p<=mx+0.001)}
  const s=S.sort;
  if(S.d==="kp"&&S.f.period==="Укажу даты")list.sort((a,b)=>fitsDates(b)-fitsDates(a));
  if(S.d==="pro"){
    if(S.quizProf)list.sort((a,b)=>(b.id===S.quizProf)-(a.id===S.quizProf));
    const rk={"Низкий":0,"Средний":1};
    if(s==="salary")list.sort((a,b)=>b.sal[1]-a.sal[1]);else if(s==="demand")list.sort((a,b)=>b.demand[1]-a.demand[1]);else if(s==="risk")list.sort((a,b)=>rk[a.risk]-rk[b.risk]);
  }else{
    if(s==="cheap")list.sort((a,b)=>a.p-b.p);
    else if(s==="pricey")list.sort((a,b)=>b.p-a.p);
    else if(s==="deadline")list.sort((a,b)=>(a.dl?a.dl[0]*40+a.dl[1]:a.start*40)-(b.dl?b.dl[0]*40+b.dl[1]:b.start*40));
    else if(s==="soon")list.sort((a,b)=>a.start-b.start);
    else if(s==="late"){if(S.d==="kp")list.sort((a,b)=>b.start-a.start);else list.sort((a,b)=>(b.dl[0]*40+b.dl[1])-(a.dl[0]*40+a.dl[1]))}
    else if(s==="chance")list.sort((a,b)=>b.chance-a.chance);
    else if(s==="short")list.sort((a,b)=>a.y-b.y);
    else if(S.d==="vuz"||S.d==="col")list.sort((a,b)=>b.chance-a.chance);
  }
  return list;
}

 login:["Войдите или создайте аккаунт","Подборки, избранное, заявки и напоминания о сроках в одном месте."]
};
function openAuth(reason,after,skip){
  S.authAfter=after||null;S.authSkip=skip||null;
  const t=AUTH_TXT[reason]||AUTH_TXT.login;
  openModal('<button class="auth-close" onclick="closeModal()" aria-label="'+esc(T("Закрыть"))+'">×</button><div class="auth"><div><div class="brand">MainExperts</div><h2>'+T(t[0])+'</h2><p class="tx">'+T(t[1])+'</p>'
   +'<label for="aem">'+T("Электронная почта")+'</label><input type="email" id="aem" placeholder="'+esc(T("Введите вашу почту"))+'" onkeydown="if(event.key===\'Enter\')doAuth()"><div class="err" id="aerr"></div>'
   +'<button class="btn gold next" onclick="doAuth()">'+T("Далее")+'</button><div class="or">'+T("или")+'</div>'
   +'<div class="soc"><button onclick="doAuth(\'google\')">Google</button><button onclick="doAuth(\'apple\')">Apple</button><button onclick="doAuth(\'facebook\')">Facebook</button></div>'
   +'<label class="stay"><input type="checkbox" checked> '+T("Оставаться в системе")+'</label>'
   +'<div class="legal">'+T("Продолжая, вы соглашаетесь с условиями использования и подтверждаете, что прочитали политику конфиденциальности. От писем можно отписаться в любой момент.")+'</div>'
   +(skip?'<button class="skip" onclick="skipAuth()">'+T(skip[0])+'</button>':'')
   +A("Моменты создания аккаунта (docs/29): 1 — ответ на «Подборка подошла?»; 2 — «Сохранить», «Поделиться», сердечко у карточки; 3 — «большая кнопка» перед переходом на сайт; 4 — результат разбора ребёнка. Окно по образцу Skyscanner: одно поле, внешние входы, крестик.")
   +'</div><div class="auth-art"><img src="'+art(reason==="quiz"?"quiz":"auth")+'" alt=""><div class="av"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#0b3d2e" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div></div></div>');
  document.getElementById("modal").classList.add("wide");
}
function doAuth(p){
  let email;
  if(p){email="user@"+p+".example"}
  else{email=($("#aem").value||"").trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$("#aerr").textContent=T("Введите корректный email");return}}
  S.user={email:email};S.email=email;S.emailGiven=true;
  const f=S.authAfter;S.authAfter=null;closeModal();toast(T("Аккаунт создан. Результаты сохраняются."));render();if(f)f();
}
function skipAuth(){const f=S.authSkip&&S.authSkip[1];S.authSkip=null;S.authAfter=null;closeModal();if(f)f()}
function needAuth(reason,fn,skip){if(S.user){fn();return}openAuth(reason,fn,skip)}
function heart(){needAuth("heart",()=>go("cabinet"))}
const FLAGS=[["ru","Русский"],["en","English"],["kk","Қазақша"],["uz","Oʻzbekcha"],["ar","العربية"]];
let RD=null;
function openRegion(){
  RD={lang:LI,country:S.country,cur:curCode()};
  drawRegion();
}
function drawRegion(){
  const dc=CTRY[RD.country];
  openModal('<div class="reg"><div class="sttl"><h2 style="margin:0">'+T("Региональные настройки")+'</h2><button class="auth-close" style="position:static" onclick="closeModal()" aria-label="'+esc(T("Закрыть"))+'">×</button></div>'
   +'<label>'+T("Язык")+(RD.lang!=="en"?'<button class="swl" onclick="RD.lang=\'en\';drawRegion()">Switch to English</button>':'')+'</label><select onchange="RD.lang=this.value;drawRegion()">'+FLAGS.map(f=>'<option value="'+f[0]+'"'+(RD.lang===f[0]?' selected':'')+'>'+f[1]+'</option>').join("")+'</select>'
   +'<label>'+T("Страна или регион")+'</label><div class="small mute" style="margin:-2px 0 6px">'+T("Выбор страны покажет вам местные предложения и информацию.")+'</div><select onchange="regCountry(this.value)">'+Object.keys(CTRY).map(c=>'<option value="'+c+'"'+(RD.country===c?' selected':'')+'>'+esc(T(c))+'</option>').join("")+'</select>'
   +'<label>'+T("Валюта")+'</label><select onchange="RD.cur=this.value;drawRegion()">'+Object.keys(RATES).map(c=>'<option value="'+c+'"'+(RD.cur===c?' selected':'')+'>'+c+' – '+((SYM[c].def)||(SYM[c][RD.lang])||c)+'</option>').join("")+'</select>'
   +'<div style="margin-top:20px"><button class="btn" style="width:100%;padding:14px;font-size:16px" onclick="saveRegion()">'+T("Сохранить")+'</button><button class="btn ghost" style="width:100%;padding:14px;font-size:16px;margin-top:8px;background:#e5e8ee;border-color:#e5e8ee" onclick="closeModal()">'+T("Отмена")+'</button></div></div>');
}
function regCountry(c){RD.country=c;RD.lang=CTRY[c].lang;RD.cur=CTRY[c].cur;drawRegion()}
function saveRegion(){
  S.country=RD.country;
  S.lang=RD.lang;S.langManual=RD.lang!==CTRY[RD.country].lang;if(!S.langManual)S.lang=null;
  S.cur=RD.cur;S.curManual=RD.cur!==CTRY[RD.country].cur;if(!S.curManual)S.cur=null;
  closeModal();render();toast(T("Региональные настройки сохранены."));
}
function render(){
  LI=curLang();
  document.documentElement.lang=LI;document.documentElement.dir=LI==="ar"?"rtl":"ltr";
  $("#nav").innerHTML='<button data-s="home" onclick="go(\'home\')">'+T("Поиск")+'</button><button data-s="orient" onclick="go(\'orient\')">'+T("Не знаете, кем стать?")+'</button>';
  const cf={"Россия":"ru","Казахстан":"kz","ОАЭ":"ae","Узбекистан":"uz","Великобритания":"gb","Другая страна":"xx"}[S.country];
  const cy=curCode();const sy=(SYM[cy][LI]||SYM[cy].def||"");
  $("#ctx").innerHTML='<button class="reg-btn" onclick="openRegion()" aria-label="'+esc(T("Региональные настройки"))+'"><span class="dsk">'+LANGS[LI]+'</span><span class="mob">'+LI.toUpperCase()+'</span><span class="flag flag-c-'+cf+'"></span><span class="dsk">'+esc(T(S.country))+'</span><span class="dsk">'+sy+' '+cy+'</span><span class="mob">'+((SYM[cy].def)||cy)+'</span></button><button class="heart-btn" onclick="heart()" aria-label="'+esc(T("Сохранённое"))+'"><svg viewBox="0 0 24 24" fill="'+(cabCount()?'#ff5a6e':'none')+'" stroke="#fff" stroke-width="1.8"><path d="M12 21s-7.5-4.6-9.4-9.1C1.3 8.6 3.2 5 6.7 5c2 0 3.5 1.1 4.3 2.5C11.8 6.1 13.3 5 15.3 5c3.5 0 5.4 3.6 4.1 6.9C19.5 16.4 12 21 12 21z"/></svg>'+(cabCount()?'<span class="badge">'+cabCount()+'</span>':'')+'</button>'+(S.user?'<button class="avatar" onclick="heart()" title="'+esc(S.user.email)+'">'+esc(S.user.email[0].toUpperCase())+'</button>':'<button class="login-btn" onclick="openAuth(\'login\')">'+T("Войти")+'</button>');
  $("#view").innerHTML=SCR[S.screen]();
  $("#sfoot").innerHTML='<div class="sitefoot">'+footHtml()+'</div>';
  $("#foot").textContent=T("Концепт портала. Все названия, цены, курсы, сроки и изображения демонстрационные. Цены пересчитаны по демонстрационному курсу. Концепт не утверждён основателем.");
  if(S.screen==="home"){bannerStart()}
  if(S.screen==="home"&&!S.tabPinned){const el=document.getElementById("typed");if(el&&TY.pos===0){el.textContent=" "}TY.timer=setTimeout(typedTick,TY.pos?60:300)}
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===S.screen||(b.dataset.s==="home"&&["search","results"].includes(S.screen))));
}
splashRun();
window.__S=S;window.__go=(s)=>{S.screen=s;render();window.scrollTo(0,0)};window.__render=render;
render();
</script>
</body>
</html>
