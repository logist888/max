<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Концепт портала Mainexperts: поиск обучения и профессий</title>
<style>
:root{
  --ink:#05203c;--bg:#f1f2f8;--card:#fff;--line:#e3e6ee;--mute:#5f6575;--gold:#0062e3;--gold-d:#0b4fc0;--blue:#0062e3;
  --vuz:#4a6fd0;--vuz-bg:#e6edfb;--col:#3f9a55;--col-bg:#e1f3e6;--pro:#8a5cc0;--pro-bg:#f0e7fa;--kp:#d08a3a;--kp-bg:#fdecd9;
  --bad:#c0392b;--r:14px;--price:#05203c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Arial,"DejaVu Sans",sans-serif}
html[dir=rtl] body{font-family:"Segoe UI","Noto Sans Arabic","DejaVu Sans",Arial,sans-serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:#05203c;color:#fff;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{font-weight:700;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo{font-size:22px;letter-spacing:-.4px}
.mlogo{width:34px;height:20px;display:block}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;color:#cfd9e8;padding:8px 12px;border-radius:8px}
.nav button:hover,.nav button.on{background:#12335a;color:#fff}
.sp{flex:1}
.ctx{display:flex;gap:8px;align-items:center;font-size:13px;color:#cfcfcf;flex-wrap:wrap}
.ctx select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:5px 8px;font:inherit}
.badge{display:inline-block;background:#0062e3;color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:1px 8px;min-width:20px;text-align:center}
.tgl{display:flex;align-items:center;gap:6px;font-size:13px;color:#e8e8e8;cursor:pointer;user-select:none}
.tgl input{accent-color:var(--gold)}
.tgl-f{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.tgl-f input{accent-color:var(--gold-d)}
main{padding:0 0 60px}
h1{font-size:36px;line-height:1.15;margin:0 0 10px}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:16px;margin:0 0 6px}
.lead{font-size:17px;max-width:760px}
.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
.btn:hover{background:#0c3258}
.btn.gold{background:#0062e3;border-color:#0062e3;color:#fff}
.btn.gold:hover{background:#0b4fc0}
.btn.ghost{background:#fff;color:var(--ink);border-color:#bdbdbd}
.btn.ghost:hover{background:#f0f0f0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)}h1{font-size:27px}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef0f5;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px}
.chip.btnlike{cursor:pointer;background:#fff}.chip.btnlike:hover{border-color:var(--gold-d);background:#faf6ec}
.chip.known{background:#eef7f0;border-color:#bfdcc7}
.chip .x{cursor:pointer;color:#888}
.tag{display:inline-block;border-radius:6px;font-size:12px;padding:1px 8px;font-weight:600}
.tag.hyp{background:#fff1cf;color:#7a5b00;border:1px dashed #c9a43a}
.tag.demo{background:#eceef3;color:#555}
.tag.open{background:#fde4e1;color:#8a2b20}
/* язык, как на mainexperts-search */
.flag{display:inline-block;width:26px;height:26px;border-radius:50%;border:1px solid #dce2e7;box-shadow:0 1px 3px #17323d15;flex-shrink:0;overflow:hidden;vertical-align:middle}
.flag-ru{background:linear-gradient(#fff 0 33.33%,#16449a 33.33% 66.66%,#d82e39 66.66%)}
.flag-en{background:linear-gradient(90deg,transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(45deg,transparent 44%,#fff 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#fff 44% 56%,transparent 56%),#174b8f}
.flag-de{background:linear-gradient(#171717 0 33%,#d32f38 33% 66%,#e9bd36 66%)}
.flag-fr{background:linear-gradient(90deg,#2455a0 33%,#fff 33% 66%,#d93546 66%)}
.flag-it{background:linear-gradient(90deg,#149766 33%,#fff 33% 66%,#d93546 66%)}
.flag-es{background:linear-gradient(#be2636 25%,#f4ca38 25% 75%,#be2636 75%)}
.flag-cn{background:#d93637;position:relative}
.flag-cn:before{content:'★';color:#ffdf5d;font-size:13px;margin-left:3px}
.flag-ae,.flag-ar{background:linear-gradient(90deg,#d73742 28%,transparent 28%),linear-gradient(#19935d 33%,#fff 33% 66%,#1c2731 66%)}
.flag-kk{background:radial-gradient(circle at 50% 50%,#fec50c 0 24%,transparent 25%),#00afca}
.flag-uz{background:linear-gradient(#0099b5 0 31%,#d32f38 31% 34%,#fff 34% 66%,#d32f38 66% 69%,#1eb53a 69%)}
.reg-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:0;border-radius:8px;color:#dfe8f6;padding:8px 14px;font-size:13px}
.reg-btn:hover{background:rgba(255,255,255,.18)}
.reg-btn .flag{width:20px;height:14px;border-radius:2px;border:0}
.reg-btn .mob{display:none}
@media(max-width:640px){
 header.top .wrap{gap:8px 10px;min-height:0;padding-top:6px;padding-bottom:6px}
 .ltxt{display:none}
 .logo{margin-inline-end:auto}
 .mlogo{width:38px;height:22px}
 .nav{order:3;width:100%;gap:2px;margin:0 -4px}
 .nav button{padding:6px 10px;font-size:14px}
 .reg-btn{padding:6px 10px;gap:6px;font-weight:600}
 .reg-btn .dsk{display:none}
 .reg-btn .mob{display:inline}
 .ctx{gap:6px;flex-wrap:nowrap}
 .heart-btn svg{width:26px;height:26px}
 .login-btn{padding:8px 12px;font-size:13px}
 .avatar{width:32px;height:32px}
}
.heart-btn{position:relative;background:none;border:0;color:#fff;padding:6px;border-radius:8px;line-height:0}
.heart-btn:hover{background:rgba(255,255,255,.12)}
.heart-btn svg{width:28px;height:28px}
.heart-btn .badge{position:absolute;top:-2px;inset-inline-end:-4px;font-size:11px;padding:0 6px;min-width:18px}
.login-btn{background:#e5e8ee;border:0;border-radius:8px;color:#05203c;padding:10px 18px;font-weight:700}
.login-btn:hover{background:#fff}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#0062e3;color:#fff;font-weight:700;border:0}
.flag-c-ru{background:linear-gradient(#fff 0 33.33%,#16449a 33.33% 66.66%,#d82e39 66.66%)}
.flag-c-kz{background:radial-gradient(circle at 50% 50%,#fec50c 0 24%,transparent 25%),#00afca}
.flag-c-ae{background:linear-gradient(90deg,#d73742 28%,transparent 28%),linear-gradient(#19935d 33%,#fff 33% 66%,#1c2731 66%)}
.flag-c-uz{background:linear-gradient(#0099b5 0 31%,#d32f38 31% 34%,#fff 34% 66%,#d32f38 66% 69%,#1eb53a 69%)}
.flag-c-gb{background:linear-gradient(90deg,transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(transparent 40%,#c8283a 40% 60%,transparent 60%),linear-gradient(45deg,transparent 44%,#fff 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#fff 44% 56%,transparent 56%),#174b8f}
.flag-c-xx{background:radial-gradient(circle at 35% 35%,#7fc8ff,#1b6fd6)}
/* баннер-карусель, статьи, вопросы и ответы, подвал */
.banner{position:relative;border-radius:16px;overflow:hidden;min-height:340px;margin:6px 0 28px;color:#fff;background:#05203c}
.banner .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
.banner .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,32,60,.92) 0%,rgba(5,32,60,.7) 45%,rgba(5,32,60,.1) 100%)}
.banner .in{position:relative;padding:44px 48px;max-width:640px;animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.banner h2{font-size:40px;line-height:1.05;letter-spacing:-1.2px;margin:12px 0 10px;color:#fff}
.banner p{font-size:17px;margin:0 0 20px;color:#e3ecf9}
.banner .bd{display:inline-block;background:#bfe0ff;color:#05203c;font-weight:800;border-radius:999px;padding:5px 14px;font-size:13px;letter-spacing:.5px}
.banner .wb{background:#fff;color:#05203c;border:0;border-radius:8px;padding:12px 20px;font-weight:700;font-size:15px}
.banner .wb:hover{background:#e6eefb}
.banner .dots{position:absolute;bottom:14px;inset-inline-start:48px;display:flex;gap:8px}
.banner .dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.4);padding:0}
.banner .dots button.on{background:#fff;width:26px;border-radius:6px}
.banner.pic{min-height:0;background:#1a1228}
.banner .bpic{display:block;width:100%;height:auto;aspect-ratio:1068/344;object-fit:cover}
.banner .hot{position:absolute;inset:0;background:transparent;border:0;cursor:pointer}
.banner picture{display:block}
@media(max-width:640px){.banner.sq .bpic{aspect-ratio:1/1}}
.banner.pic .dots{inset-inline-start:auto;inset-inline-end:18px;bottom:14px;z-index:2}
.banner.pic .dots button{background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.banner.pic .dots button.on{background:#fff}
@media(max-width:640px){.banner .in{padding:28px 22px}.banner h2{font-size:28px}.banner .dots{inset-inline-start:22px}}
.arts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.arts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.arts{grid-template-columns:1fr}}
.art{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:start;padding:0;cursor:pointer;display:flex;flex-direction:column}
.art:hover{box-shadow:0 6px 22px rgba(20,30,60,.15)}
.art img{width:100%;height:130px;object-fit:cover;display:block}
.art .b{padding:12px 14px 16px}
.art img{height:150px}
.artpage{max-width:780px;padding-top:18px;padding-bottom:30px}
.artpage .crumb{font-size:14px;color:#68748a;margin-bottom:14px}.artpage .crumb a{color:#0062e3;cursor:pointer}
.artpage h1{font-size:34px;line-height:1.12;letter-spacing:-.8px;margin:6px 0 10px}
.artpage .lead{font-size:18px;color:#3d4a60;margin:0 0 18px}
.artpage .ahero{width:100%;height:auto;border-radius:14px;display:block;margin-bottom:22px}
.abody h3{font-size:21px;margin:26px 0 8px}.abody p,.abody li{font-size:16.5px;line-height:1.6}.abody ul{padding-inline-start:22px}
.abody table{border-collapse:collapse;width:100%;font-size:14.5px;margin:12px 0 16px;display:block;overflow-x:auto}
.abody th,.abody td{border:1px solid var(--line);padding:8px 10px;text-align:start;vertical-align:top}.abody th{background:#f1f5fb}
.abody a{color:#0062e3}.abody .src{font-size:14px;color:#68748a;border-top:1px solid var(--line);padding-top:12px;margin-top:22px}
.acta{margin:26px 0 34px}.acta .btn{padding:14px 26px;font-size:16px}
.arts.a3{grid-template-columns:repeat(3,1fr)}@media(max-width:700px){.arts.a3{grid-template-columns:1fr}}

.art .tg{font-size:12px;font-weight:700;color:#0062e3;text-transform:uppercase;letter-spacing:.4px}
.art h3{font-size:16px;margin:4px 0 6px;line-height:1.25}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media(max-width:760px){.faq{grid-template-columns:1fr}}
.faq details{border-bottom:1px solid #cfd6e3;padding:14px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"⌄";font-size:18px;line-height:1}
.faq details[open] summary::after{content:"⌃"}
.faq p{margin:10px 0 0;color:#2b3a52;font-size:15px}
.sitefoot{background:#05203c;color:#dfe8f6;margin-top:40px;padding:38px 0 26px}
.sitefoot .cols{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:28px}
@media(max-width:860px){.sitefoot .cols{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.sitefoot .cols{grid-template-columns:1fr}}
.sitefoot h4{margin:0 0 12px;font-size:15px;color:#fff}
.sitefoot a{display:block;color:#dfe8f6;text-decoration:none;margin:9px 0;font-size:14px;cursor:pointer}
.sitefoot a:hover{text-decoration:underline}
.sitefoot .ctry{display:flex;align-items:center;gap:8px}
.sitefoot .ctry .flag{width:22px;height:14px;border-radius:2px;border:0}
.sitefoot .copy{border-top:1px solid #163a63;margin-top:26px;padding-top:18px;text-align:center;font-size:13px;color:#b7c7de}
.sitefoot .cols.cc{grid-template-columns:repeat(3,1fr);gap:4px 28px}
@media(max-width:520px){.sitefoot .cols.cc{grid-template-columns:1fr 1fr}}
.lightbar{padding:14px 0 26px;color:var(--mute);font-size:13px}
/* заставка и cookies */
#splash{position:fixed;inset:0;background:#0a1f3c;display:flex;align-items:center;justify-content:center;z-index:300;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .ring{position:relative;width:200px;height:200px}
#splash .arc{position:absolute;inset:0;animation:spin 1.1s linear infinite}
#splash .lg{position:absolute;left:52px;top:68px;width:96px;height:56px}
@keyframes spin{to{transform:rotate(360deg)}}
.cookie{position:fixed;left:0;right:0;bottom:0;background:#05203c;color:#fff;z-index:90;padding:16px 0;box-shadow:0 -6px 24px rgba(5,32,60,.35);transform:translateY(110%);transition:transform .45s}
.cookie.on{transform:none}
.cookie .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cookie p{flex:1;min-width:260px;margin:0;font-size:14px;color:#dfe8f6}
.cookie .btn{border-radius:8px}
.cookie .btn.w{background:#fff;color:#05203c;border-color:#fff}
.cookie .btn.o{background:transparent;border-color:#8aa3c7;color:#fff}
.ck-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e3e6ee}
/* окно регистрации (по образцу Skyscanner) */
.auth{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
@media(max-width:700px){.auth{grid-template-columns:1fr}.auth-art{display:none}}
.auth .brand{font-weight:800;font-size:24px;color:#0062e3;margin-bottom:10px;letter-spacing:-.4px}
.auth h2{font-size:30px;line-height:1.1;margin:0 0 10px;letter-spacing:-.8px}
.auth .tx{font-size:16px;margin:0 0 16px}
.auth label{font-size:12px;font-weight:700}
.auth input[type=email]{border-radius:8px;padding:13px 14px;font-size:16px}
.auth .next{width:100%;margin-top:10px;padding:14px;font-size:16px}
.auth .or{text-align:center;margin:8px 0;font-size:14px}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.soc button{background:#e5e8ee;border:0;border-radius:8px;padding:13px;font-weight:700;font-size:14px}
.soc button:hover{background:#d6dae2}
.auth .stay{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-weight:400;font-size:15px}
.auth .legal{font-size:11.5px;color:#52627a;margin-top:8px}
.auth .skip{display:inline-block;margin-top:10px;font-size:14px;text-decoration:underline;cursor:pointer;color:#05203c;background:none;border:0;padding:0}
.auth .err{color:#c0392b;font-size:13px;margin-top:6px;min-height:18px}
.auth-art{position:relative}
.auth-art img{width:100%;border-radius:10px;display:block}
.auth-art .av{position:absolute;inset-inline-end:-18px;top:46%;width:74px;height:74px;border-radius:50%;background:#9fe8c3;display:flex;align-items:center;justify-content:center}
.auth-close{position:absolute;inset-inline-end:16px;top:12px;background:none;border:0;font-size:28px;line-height:1;color:#05203c}
.modal.wide{max-width:880px;position:relative;padding:30px}
.reg label{display:flex;align-items:center;gap:8px;font-size:14px;margin:16px 0 6px}
.reg select{padding:12px;font-size:16px;border-radius:8px}
.reg .swl{margin-inline-start:auto;font-size:14px;text-decoration:underline;cursor:pointer;background:none;border:0;color:#05203c;padding:0;font-weight:600}
.lang-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
@media(max-width:700px){.lang-menu{grid-template-columns:1fr 1fr}}
.lang-menu button{display:flex;align-items:center;gap:12px;background:#edf3f7;color:#294451;border:0;border-radius:15px;padding:16px;font-size:14px;text-align:start;min-height:70px}
.lang-menu button.on{box-shadow:inset 0 0 0 1px #75a6b8;background:#e2f0f5}
.lang-menu button:disabled{opacity:.45;cursor:not-allowed}
.lang-menu small{font-size:10px;margin-inline-start:auto}
.lang-menu .chk{margin-inline-start:auto;color:#2a7a9a;font-weight:700}
/* герой и панель поиска, как у авиабилетов */
.hero{background:#05203c;color:#fff;padding:34px 0 60px}
.hero .lead{color:#c9d6ea}
.hero h1{margin:0}
.hline{font-size:clamp(26px,3.6vw,42px);font-weight:600;letter-spacing:-1px;color:#8db8ff;min-height:54px;margin:4px 0 6px}
.caret{font-weight:300;color:#9fb2e8;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.tab{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:9px 18px;font-weight:600;display:flex;gap:8px;align-items:center}
.tab i{width:10px;height:10px;border-radius:3px;display:inline-block;background:#fff;opacity:.8}
.tab:hover:not(.on){background:rgba(255,255,255,.14)}
.tab.on{background:#0062e3;border-color:#0062e3;color:#fff}
.tab.on i{background:#fff;opacity:1}
.panel{background:transparent;color:#fff;padding:0;display:flex;gap:6px;flex-wrap:wrap;color-scheme:dark}
.pf{flex:1;min-width:150px;padding:10px 16px;background:rgba(255,255,255,.12);border-radius:10px;position:relative}
.pf label{font-size:12px;color:#b9c8de;font-weight:500;margin:0}
.pf input,.pf select{border:0;padding:3px 0;font-size:16px;font-weight:600;background:transparent;outline:none;width:100%;border-radius:0;color:#fff}
.pf select option{color:#111;background:#fff}
.pf input::placeholder{color:#9db0cb}
.pf.miss{outline:2px solid #ff7b7b;background:rgba(255,90,90,.2)}
.pf.miss label{color:#ffb3b3}
.panel .go{align-self:stretch;min-width:130px;border-radius:10px;font-size:17px}
.compact .hero{padding:14px 0 22px}
@media(min-width:900px){
 .panel:not(.wrap){flex-wrap:nowrap}
 .panel:not(.wrap) .pf{min-width:0;padding:8px 12px}
 .panel:not(.wrap) .pf label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
 .panel:not(.wrap) .pf input,.panel:not(.wrap) .pf select,.panel:not(.wrap) .pfsel{font-size:15px}
 .panel:not(.wrap) .go{min-width:0;flex:0 0 108px;padding:0 14px;font-size:16px}
}
.compact .tabs{margin:0 0 12px}
.sub{padding-top:24px}
/* выдача */
.res{display:grid;grid-template-columns:250px 1fr;gap:18px}
@media(max-width:900px){.res{grid-template-columns:1fr}}
.cal{display:flex;gap:8px;overflow:auto;margin:14px 0}
.cal button{flex:1;min-width:120px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;text-align:start}
.cal button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.cal button b{display:block;font-size:13px;color:var(--mute);font-weight:500}
.cal button span{font-size:17px;font-weight:700;color:var(--price)}

ые. Состав и цены платных услуг и подробного отчёта пока не заданы.", "In this concept search and selection are free. The content and prices of paid services and the detailed report are not set yet.", "Тұжырымдамада іздеу мен іріктеме тегін. Ақылы қызметтер мен толық есептің құрамы мен бағасы әлі белгіленбеген.", "Konsepsiyada qidiruv va tanlov bepul. Pullik xizmatlar va batafsil hisobotning tarkibi hamda narxi hali belgilanmagan.", "في هذا المفهوم البحث والقوائم مجانية. لم تُحدَّد بعد محتويات وأسعار الخدمات المدفوعة والتقرير المفصل."], ["Откуда данные о ценах и сроках?", "Where do prices and dates come from?", "Баға мен мерзім деректері қайдан алынады?", "Narx va muddat ma’lumotlari qayerdan olinadi?", "من أين تأتي بيانات الأسعار والمواعيد؟"], ["Каждое число показывается с источником и датой. В этом концепте все данные демонстрационные.", "Every figure is shown with its source and date. In this concept all data is for demonstration.", "Әр сан дереккөзімен және күнімен көрсетіледі. Бұл тұжырымдамада барлық деректер демонстрациялық.", "Har bir raqam manba va sana bilan ko‘rsatiladi. Bu konsepsiyada barcha ma’lumotlar demonstratsion.", "يُعرض كل رقم مع مصدره وتاريخه. في هذا المفهوم جميع البيانات توضيحية."], ["Что такое бесплатный тест и зачем он нужен?", "What is the free test and why take it?", "Тегін тест деген не және ол не үшін керек?", "Bepul test nima va u nima uchun kerak?", "ما الاختبار المجاني ولماذا هو مفيد؟"], ["Это короткий разбор сильных сторон и интересов ребёнка. Результат подставляется в поиск и помогает выбрать направление. Это ориентир, а не диагноз.", "It is a short review of your child's strengths and interests. The result feeds your search and helps choose a direction. It is a guide, not a diagnosis.", "Бұл баланың күшті жақтары мен қызығушылықтарының қысқаша талдауы. Нәтиже іздеуге қойылып, бағытты таңдауға көмектеседі. Бұл – бағдар, диагноз емес.", "Bu bolaning kuchli tomonlari va qiziqishlarining qisqa tahlili. Natija qidiruvga qo‘yiladi va yo‘   const dots='<div class="dots">'+SLIDES.map((_,i)=>'<button class="'+(i===BN.i?'on':'')+'" onclick="event.stopPropagation();bannerTo('+i+')" aria-label="'+(i+1)+'"></button>').join("")+'</div>';
  const bc=document.getElementById("banner");if(bc){bc.classList.toggle("pic",!!slidePic(s));bc.classList.toggle("sq",!!(slidePic(s)&&sqPic(s)))}
  if(slidePic(s))return '<picture>'+(sqPic(s)?'<source media="(max-width:640px)" srcset="'+IMG(sqPic(s))+'">':'')+'<img class="bpic" src="'+IMG(slidePic(s))+'" alt=""></picture><button class="hot" onclick="SLIDES['+BN.i+'].go()" aria-label="'+esc(T(s.b))+'"></button>'+dots;
  return '<div class="bg" style="background-image:url('+art(s.img)+')"></div><div class="shade"></div><div class="in"><span class="bd">'+T(s.bd)+'</span><h2>'+T(s.t)+'</h2><p>'+T(s.x)+'</p><button class="wb" onclick="SLIDES['+BN.i+'].go()">'+T(s.b)+'</button></div>'+dots;
}
function bannerPaint(){const el=document.getElementById("banner");if(el)el.innerHTML=bannerInner()}
function bannerTo(i){BN.i=i;bannerPaint();bannerStart()}
function bannerStart(){clearInterval(BN.t);if(S.noAnim||matchMedia("(prefers-reduced-motion: reduce)").matches)return;BN.t=setInterval(()=>{if(S.screen!=="home"||document.hidden)return;BN.i=(BN.i+1)%SLIDES.length;bannerPaint()},6000)}
const ARTRU=[{"t": "С чего начать выбор вуза: пять вопросов", "x": "Страна, программа, сроки, интересы и бюджет: что решить до составления списка университетов.", "h": "<p>Красивый кампус помогает представить будущую жизнь. Место в рейтинге даёт ориентир. Но ни фотография, ни рейтинг не отвечают на главный вопрос: подходит ли конкретная программа вашему ребёнку. Чтобы поиск не превратился в бесконечное сравнение названий, сначала договоритесь о пяти вещах.<\/p><h3>1. Что ребёнок хочет изучать и пробовать?<\/h3><p>Необязательно сразу выбирать профессию на всю жизнь. Для начала достаточно двух-трёх направлений, которые хочется исследовать. Попросите ребёнка привести примеры: какие задачи нравятся, что он делает без напоминаний, о чём готов читать самостоятельно. «Нравится биология» — отправная точка. Интерес к лабораторным исследованиям, работе с людьми или охране природы уже помогает различать программы.<\/p><p>Затем откройте учебные планы. Сравните обязательные предметы, проекты, практику и способы оценки. Одинаковые названия программ не гарантируют одинакового содержания.<\/p><h3>2. Где и на каком языке он готов учиться?<\/h3><p>Обсудите не только страну, но и повседневную жизнь: большой город или небольшой кампус, расстояние от семьи, самостоятельный быт, язык общения и преподавания. Хороший разговорный язык ещё не означает, что легко будет писать академические работы. Требования к подтверждению языка проверяйте у самой программы.<\/p><p>Не смешивайте желание родителей и готовность ребёнка. Если учиться предстоит ему, его сомнения должны стать частью критериев поиска.<\/p><h3>3. Какая ступень образования нужна сейчас?<\/h3><p>Бакалавриат, подготовительная программа и обучение в колледже перед университетом решают разные задачи. Важен документ, с которым ребёнок заканчивает школу, и то, принимает ли его выбранный вуз. Для британских программ проверяйте не только оценки, но и обязательные предметы: UCAS и университеты прямо указывают, что требования различаются по курсам.<\/p><h3>4. К какому набору реально подготовиться?<\/h3><p>Начните с предполагаемого года поступления и двигайтесь назад. Отметьте сроки подачи, экзамены, языковой сертификат, портфолио и получение школьных документов. Для каждого пункта запишите, что уже готово и что ещё предстоит. Если требования пока неизвестны, не подменяйте их предположением «успеем».<\/p><h3>5. Каков полный бюджет?<\/h3><p>Считайте не одну стоимость обучения. Добавьте жильё, питание, транспорт, страховку, поездки домой, сборы и необходимую подготовку. Отдельно запишите условия стипендии: пока её получение не подтверждено, бюджет без неё тоже должен быть понятен семье.<\/p><h3>Что должно получиться<\/h3><p>Составьте короткое описание запроса: «Ищем бакалавриат по двум направлениям, на таком-то языке, к определённому набору, с подходящими требованиями и в пределах общего бюджета». На его основе уже можно сравнивать программы и сокращать список.<\/p><p><b>Следующий шаг:<\/b> заполните пять ответов вместе с ребёнком и начните подбор программ в MainExperts.<\/p><p class=\"src\"><b>Источники:<\/b> <a href=\"https://www.ucas.com/applying/you-apply/what-and-where-study/choosing-course\" target=\"_blank\" rel=\"noopener\">UCAS: выбор курса<\/a>; <a href=\"https://www.ucas.com/applying/you-apply/what-and-where-study/entry-requirements\" target=\"_blank\" rel=\"noopener\">UCAS: вступительные требования<\/a>. Проверено 04.11.2026.<\/p>"}, {"t": "Кем будет работать ребёнок: как читать данные о спросе", "x": "Вакансии, зарплаты и автоматизация: какие данные помогают выбрать направление и где легко ошибиться.", "h": "<p>«Эта профессия будет востребована» звучит убедительно, пока не появляются уточнения: в какой стране, для какого опыта и к какому году? Данные о рынке труда полезны для сравнения вариантов. Но они не могут обещать конкретному подростку работу и доход после выпуска.<\/p><h3>Сначала уточните, какую работу вы сравниваете<\/h3><p>Интерес к рисованию может привести в иллюстрацию, анимацию, промышленный дизайн или проектирование интерфейсов. Повседневные задачи и способы входа в эти области различаются. Поэтому сравнивайте конкретные роли, а не широкие ярлыки вроде «творческая профессия».<\/p><p>Для каждой роли соберите небольшую подборку актуальных вакансий на одном рынке. Отдельно посмотрите предложения для начинающих: спрос на опытных сотрудников сам по себе не доказывает, что новичку легко устроиться.<\/p><h3>Что проверять в данных<\/h3><table><thead><tr><th>Показатель<\/th><th>Что выяснить<\/th><th>Чего нельзя заключать<\/th><\/tr><\/thead><tbody><tr><td>Число вакансий<\/td><td>Страна, период, площадка, наличие дублей<\/td><td>Что все объявления означают новые рабочие места<\/td><\/tr><tr><td>Зарплатная вилка<\/td><td>Валюта, опыт, занятость, до или после налогов<\/td><td>Что верхняя граница — обычный доход выпускника<\/td><\/tr><tr><td>Требования<\/td><td>Какие навыки повторяются в разных объявлениях<\/td><td>Что длинный список требований всегда обязателен целиком<\/td><\/tr><tr><td>Доступность входа<\/td><td>Есть ли стажировки, младшие позиции, требования к портфолио<\/td><td>Что высокий общий спрос означает лёгкий старт<\/td><\/tr><tr><td>Автоматизация<\/td><td>Какие именно задачи меняются под влиянием технологий<\/td><td>Что воздействие ИИ равно исчезновению профессии<\/td><\/tr><\/tbody><\/table><p>Зарплаты из разных стран нельзя сравнивать без контекста стоимости жизни и налогов. Неопубликованная зарплата — это отсутствие данных, а не нулевой доход. Рядом с каждой цифрой сохраняйте источник и дату.<\/p><h3>Что на самом деле говорит риск автоматизации<\/h3><p>В исследованиях Международной организации труда оценивается потенциальное воздействие генеративного ИИ на задачи внутри профессий. Это не прогноз фактического числа увольнений. Одна роль может включать и автоматизируемые операции, и работу, где нужны человеческое решение, ответственность и взаимодействие.<\/p><p>Практический вопрос для семьи звучит так: «Какие задачи ребёнку интересно освоить и как в них используются новые инструменты?» Например, умение создавать изображение стоит рассматривать вместе с пониманием задачи заказчика, композицией, проверкой результата и работой с обратной связью. Это пример анализа навыков, а не обещание защищённой от ИИ карьеры.<\/p><h3>Проверьте интерес через действие<\/h3><p>Выберите две-три роли и предложите небольшую пробу по каждой: разработать макет, собрать прототип, провести исследование или подготовить короткую анимацию. После обсудите, что понравилось: придумывать, уточнять задачу, делать руками, анализировать или доводить результат после замечаний.<\/p><p>Полезно поговорить и с практикующим специалистом: спросить о первом рабочем годе, типичных задачах и сложностях входа. Такой разговор дополнит статистику, но не заменит её.<\/p><p><b>Следующий шаг:<\/b> сравните несколько профессий по задачам, доступности старта и интересу ребёнка, затем подберите образовательные программы в MainExperts.<\/p><p class=\"src\"><b>Источники:<\/b> <a href=\"https://www.ilo.org/publications/generative-ai-and-jobs-2025-update?trk=public_post_comment-text\" target=\"_blank\" rel=\"noopener\">МОТ: обновление исследования об ИИ и занятости, 2025<\/a>; <a href=\"https://www.ilo.org/resource/article/how-might-generative-ai-impact-different-occupations\" target=\"_blank\" rel=\"noopener\">МОТ: как интерпретировать воздействие ИИ на профессии<\/a>. Проверено 04.11.2026. Таблица — редакционная методика проверки, а не результаты исследования рынка.<\/p>"}, {"t": "Колледж перед университетом: кому подойдёт этот путь", "x": "Как выбрать академическую подготовку, предметы и среду перед поступлением в университет.", "h": "<p>Слово «колледж» означает разное в разных образовательных системах. Здесь речь о британском sixth form college: этапе академической подготовки перед университетом, обычно после GCSE или сопоставимого этапа школьного образования. Такой маршрут нельзя автоматически приравнивать к российскому колледжу после девятого класса. Само слово college в Великобритании тоже не всегда обозначает именно этот формат.<\/p><h3>Сначала определите цель подготовки<\/h3><p>Колледж стоит рассматривать, когда семье нужен понятный путь к университетской программе: изучить нужные предметы, получить подходящую квалификацию и подготовиться к академической самостоятельности. Возраст, предыдущие документы, оценки и язык должны соответствовать требованиям выбранного учреждения.<\/p><p>Переход после девятого класса российской школы нельзя считать автоматически подходящим: возможность зачисления и нужный этап обучения необходимо подтвердить у конкретного колледжа.<\/p><h3>Выбирайте предметы с учётом будущей программы<\/h3><p>Сначала посмотрите требования нескольких университетских курсов, затем выбирайте набор предметов. Иначе можно хорошо закончить подготовку, но обнаружить, что для нужной программы не хватает обязательной дисциплины.<\/p><p>Кембридж, например, прямо предупреждает: сочетание предметов A levels или IB влияет на доступность университетских направлений. Это пример логики проверки, а не универсальное требование всех вузов. Условия каждого курса нужно читать отдельно.<\/p><p>A levels, IB и Foundation не следует считать взаимозаменяемыми названиями. Проверяйте, какая квалификация выдаётся, кем она признаётся и куда позволяет подавать заявление. У подготовительной программы могут быть ограничения по дальнейшим направлениям и университетам.<\/p><h3>Что сравнить между колледжами<\/h3><p><b>Учебный план.<\/b> Нужные предметы должны реально преподаваться в выбранном наборе. Уточните, можно ли сочетать их в расписании и какие условия действуют для смены дисциплины.<\/p><p><b>Поддержка.<\/b> Спросите, кто помогает с выбором университетов, заявлением, экзаменами и портфолио, и что именно входит в стоимость. Формулировка «сопровождаем поступление» сама по себе слишком общая.<\/p><p><b>Повседневная среда.<\/b> Оцените размер групп, самостоятельную работу, обратную связь, языковую поддержку и общение за пределами занятий. Престижная среда не обязательно будет подходящей именно этому подростку.<\/p><p><b>Проживание и забота.<\/b> Для несовершеннолетнего заранее выясните, кто отвечает за него вне занятий, как устроены размещение, связь с семьёй и помощь в сложной ситуации. Уточняйте конкретные обязанности, а не только наличие слова «поддержка» в буклете.<\/p><p><b>Общий бюджет.<\/b> Сопоставьте обучение, проживание, питание, экзаменационные и дополнительные расходы. Условия оплаты и возврата должны быть понятны до внесения денег.<\/p><h3>Подготовка не равна гарантии зачисления<\/h3><p>Окончание колледжа само по себе не обещает место в выбранном университете. Если заявлен переход по партнёрскому маршруту, запросите письменные условия: какие оценки, предметы и другие требования необходимо выполнить и на какие программы распространяется предложение.<\/p><p><b>Следующий шаг:<\/b> выберите несколько университетских направлений, выпишите их предметные требования и сравните колледжи под эту задачу в MainExperts.<\/p><p class=\"src\"><b>Источники:<\/b> <a href=\"https://www.gov.uk/further-education-courses\" target=\"_blank\" rel=\"noopener\">GOV.UK: further education<\/a>; <a href=\"https://www.undergraduate.study.cam.ac.uk/apply/before/choosing-high-school-subjects\" target=\"_blank\" rel=\"noopener\">Кембридж: выбор школьных предметов<\/a>; <a href=\"https://www.ucas.com/applying/you-apply/what-and-where-study/entry-requirements\" target=\"_blank\" rel=\"noopener\">UCAS: требования к поступлению<\/a>. Проверено 04.11.2026.<\/p>"}, {"t": "Летние программы: как выбрать по датам и возрасту", "x": "Возраст, даты, содержание и проживание: как найти программу, которая подходит ребёнку и семье.", "h": "<p>У двух летних программ могут быть одинаковые красивые фотографии и совсем разный опыт внутри. На одной ребёнок попробует новый предмет, на другой будет интенсивно учить язык, на третьей — большую часть времени проводить на экскурсиях. Начинайте с того, какой результат нужен именно сейчас.<\/p><h3>Выберите одну главную цель<\/h3><p>Обсудите с ребёнком: он хочет проверить интерес к направлению, сделать проект, попрактиковать язык или попробовать жить в международной среде? Несколько целей могут сочетаться, но одна должна определять выбор. Для знакомства с предметом важны реальные задания и обратная связь. Для языковой практики — как часто ребёнок будет говорить и с кем.<\/p><h3>Проверьте возраст на нужную дату<\/h3><p>У организатора могут быть разные правила расчёта возраста: на начало смены или на другую установленную дату. Не делайте вывод только по диапазону на карточке. Если ребёнок находится на границе возрастной группы, получите подтверждение до оплаты. Не каждая университетская летняя школа принимает несовершеннолетних: например, отдельные программы Oxford Lifelong Learning рассчитаны только на взрослых.<\/p><h3>Сверьте учебные даты с поездкой<\/h3><p>Дата начала занятий может отличаться от дня заезда. Отдельно отметьте заезд, обучение, выезд, трансфер и запас времени на дорогу. Проверьте пересечения со школьными экзаменами и семейными планами. Если документы или поездка требуют подготовки, учитывайте её до бронирования невозвратных услуг.<\/p><h3>Посмотрите расписание обычного дня<\/h3><p>Попросите пример недели: сколько занятий, самостоятельной работы, спорта, экскурсий и свободного времени. Узнайте размер группы, язык преподавания и ожидаемый стартовый уровень. Формулировка «занятия по дизайну» мало говорит о содержании; понятнее, когда указано, что ребёнок создаст и какую обратную связь получит.<\/p><h3>Выясните, кто проводит программу<\/h3><p>Название города или фотография кампуса не подтверждают, что организатором выступает университет. Проверьте юридическое название организатора, преподавателей и характер связи с площадкой. Участие и сертификат не стоит воспринимать как обещание преимуществ при будущем поступлении: оценивайте прежде всего содержание и опыт.<\/p><h3>Перед оплатой пройдите короткую проверку<\/h3><ul><li>Возраст ребёнка и его уровень соответствуют правилам участия.<\/li><li>Точные даты заезда и выезда подтверждены.<\/li><li>Понятны учебная нагрузка и итоговый результат.<\/li><li>Известно, где ребёнок живёт и кто отвечает за него вне занятий.<\/li><li>Уточнены питание, медицинская помощь и экстренная связь.<\/li><li>Есть полный перечень включённых и дополнительных расходов.<\/li><li>Прочитаны условия отмены, возврата и замены смены.<\/li><li>Сам ребёнок понимает, куда едет, и хочет участвовать.<\/li><\/ul><h3>Как понять, что программа дала результат<\/h3><p>До поездки запишите один вопрос, на который ребёнок хочет ответить: «Нравится ли мне заниматься исследованиями?» или «Готов ли я учиться на английском каждый день?» После обсудите ответ и конкретные примеры. Даже вывод «это направление мне не подходит» может помочь следующему образовательному решению.<\/p><p><b>Следующий шаг:<\/b> задайте возраст, доступные даты и цель поездки, затем сравните короткие программы в MainExperts.<\/p><p class=\"src\"><b>Источники:<\/b> <a href=\"https://www.lifelong-learning.ox.ac.uk/about/inspiring-oxford-frequently-asked-questions\" target=\"_blank\" rel=\"noopener\">Oxford Lifelong Learning: возрастные условия отдельной летней программы<\/a>; <a href=\"https://www.undergraduate.study.cam.ac.uk/events/summer-schools/faq\" target=\"_blank\" rel=\"noopener\">Кембридж: вопросы о летних школах<\/a>. Проверено 04.11.2026. Список проверки — редакционные рекомендации; условия каждой программы уточняются у организатора.<\/p>"}];
const ARTEN=[{"t": "Where to start when choosing a university: five questions", "x": "Country, programme, deadlines, interests and budget: what to decide before you draw up a list of universities.", "h": "<p>A beautiful campus helps you picture future life. A place in a ranking gives a point of reference. But neither a photograph nor a ranking answers the main question: does this particular programme suit your child? So that the search does not turn into an endless comparison of names, first agree on five things.<\/p><h3>1. What does your child want to study and try?<\/h3><p>There is no need to pick a lifelong profession right away. To begin with, two or three areas worth exploring are enough. Ask your child for examples: which tasks they enjoy, what they do without being reminded, what they are ready to read about on their own. \"I like biology\" is a starting point. An interest in laboratory research, working with people or protecting nature already helps tell programmes apart.<\/p><p>Then open the curricula. Compare the compulsory subjects, projects, placements and ways of assessment. Identical programme titles do not guarantee identical content.<\/p><h3>2. Where and in what language are they ready to study?<\/h3><p>Discuss not only the country but everyday life: a big city or a small campus, distance from the family, independent living, the language of communication and teaching. Good spoken language does not yet mean that academic writing will come easily. Check the language proof requirements with the programme itself.<\/p><p>Do not mix up the parents' wishes and the child's readiness. If the child is the one who will study, their doubts must become part of the search criteria.<\/p><h3>3. Which level of education is needed now?<\/h3><p>A bachelor's degree, a preparatory programme and college before university solve different problems. What matters is the document your child finishes school with and whether the chosen university accepts it. For UK programmes, check not only grades but also compulsory subjects: UCAS and the universities state plainly that requirements differ by course.<\/p><h3>4. Which intake can they realistically prepare for?<\/h3><p>Start from the expected year of entry and move backwards. Mark application deadlines, exams, the language certificate, the portfolio and the collection of school documents. For each item write down what is already done and what is still to come. If the requirements are not yet known, do not replace them with the assumption \"we will make it\".<\/p><h3>5. What is the full budget?<\/h3><p>Count more than the tuition fee. Add housing, food, transport, insurance, trips home, fees and any preparation needed. Write down the scholarship terms separately: until receiving it is confirmed, the budget without it must also be clear to the family.<\/p><h3>What you should end up with<\/h3><p>Write a short description of the request: \"We are looking for a bachelor's degree in two areas, in this language, for a particular intake, with suitable requirements and within the total budget.\" On that basis you can already compare programmes and shorten the list.<\/p><p><b>Next step:<\/b> fill in the five answers together with your child and start choosing programmes in MainExperts.<\/p><p><b>Sources:<\/b> <a href=\"https://www.ucas.com/applying/you-apply/what-and-where-study/choosing-course\" target=\"_blank\" rel=\"noopener\">UCAS: choosing a course<\/a>; <a href=\"https://www.ucas.com/applying/you-apply/what-and-where-study/entry-requirements\" target=\"_blank\" rel=\"noopener\">UCAS: entry requirements<\/a>. Checked on 04.11.2026.<\/p>"}, {"t": "What will your child do for a living: how to read demand data", "x": "Vacancies, salaries and automation: which data help choose a direction and where it is easy to go wrong.", "h": "<p>\"This profession will be in demand\" sounds convincing until the questions begin: in which country, for what level of experience and by what year? Labour market data are useful for comparing options. But they cannot promise a particular teenager a job and an income after graduation.<\/p><h3>First, clarify which job you are comparing<\/h3><p>An interest in drawing can lead to illustration, animation, industrial design or interface design. The daily tasks and the ways into these fields differ. So compare specific roles, not broad labels such as \"a creative profession\".<\/p><p>For each role, collect a small selection of current vacancies in one market. Look separately at offers for beginners: demand for experienced staff does not in itself prove that a newcomer can get hired easily.<\/p><h3>What to check in the data<\/h3><table><thead><tr><th>Indicator<\/th><th>What to find out<\/th><th>What you cannot conclude<\/th><\/tr><\/thead><tbody><tr><td>Number of vacancies<\/td><td>Country, period, platform, duplicates<\/td><td>That every advertisement means a new job<\/td><\/tr><tr><td>Salary range<\/td><td>Currency, experience, type of employment, before or after tax<\/td><td>That the upper limit is a typical graduate income<\/td><\/tr><tr><td>Requirements<\/td><td>Which skills repeat across different advertisements<\/td><td>That a long list of requirements is always mandatory in full<\/td><\/tr><tr><td>Ease of entry<\/td><td>Whether there are internships, junior positions, portfolio requirements<\/td><td>That high overall demand means an easy start<\/td><\/tr><tr><td>Automation<\/td><td>Which exact tasks are changing under the influence of technology<\/td><td>That exposure to AI equals the disappearance of a profession<\/td><\/tr><\/tbody><\/table><p>Salaries from different countries cannot be compared without the context of living costs and taxes. An unpublished salary is an absence of data, not zero income. Keep the source and date next to every figure.<\/p><h3>What automation risk really says<\/h3><p>Research by the International Labour Organization assesses the potential exposure of tasks within occupations to generative AI. It is not a forecast of the actual number of layoffs. A single role may include both automatable operations and work that needs human judgement, responsibility and interaction.<\/p><p>The practical question for a family is: \"Which tasks is my child interested in mastering, and how are new tools used in them?\" For example, the ability to create an image should be considered together with understanding the client's task, composition, checking the result and working with feedback. This is an example of skills analysis, not a promise of an AI-proof career.<\/p><h3>Test the interest through action<\/h3><p>Choose two or three roles and offer a small trial for each: design a mock-up, build a prototype, carry out a study or prepare a short animation. Afterwards discuss what they liked: coming up with ideas, clarifying the task, making things by hand, analysing or refining the result after comments.<\/p><p>It is also useful to talk to a practising specialist: ask about the first working year, typical tasks and the difficulties of getting in. Such a conversation complements the statistics but does not replace them.<\/p><p><b>Next step:<\/b> compare several professions by their tasks, ease of starting and your child's interest, then choose educational programmes in MainExperts.<\/p><p><b>Sources:<\/b> <a href=\"https://www.ilo.org/publications/generative-ai-and-jobs-2025-update?trk=public_post_comment-text\" target=\"_blank\" rel=\"noopener\">ILO: Generative AI and Jobs, 2025 update<\/a>; <a href=\"https://www.ilo.org/resource/article/how-might-generative-ai-impact-different-occupations\" target=\"_blank\" rel=\"noopener\">ILO: how might generative AI impact different occupations<\/a>. Checked on 04.11.2026. The table is an editorial verification method, not the results of a labour market study.<\/p>"}, {"t": "College before university: who this path suits", "x": "How to choose academic preparation, subjects and environment before applying to university.", "h": "<p>The word \"college\" means different things in different education systems. Here we mean the British sixth form college: a stage of academic preparation before university, usually after GCSEs or a comparable stage of school education. This route cannot be automatically equated with a Russian college after ninth grade. The word college in the UK does not always denote this particular format either.<\/p><h3>First define the goal of the preparation<\/h3><p>A college is worth considering when the family needs a clear route to a university programme: to study the necessary subjects, obtain a suitable qualification and prepare for academic independence. Age, previous documents, grades and language must meet the requirements of the chosen institution.<\/p><p>Moving after ninth grade of a Russian school cannot be assumed to be automatically suitable: the possibility of admission and the right stage of study must be confirmed with the specific college.<\/p><h3>Choose subjects with the future programme in mind<\/h3><p>First look at the requirements of several university courses, then choose the set of subjects. Otherwise you can finish the preparation well but find that a compulsory subject for the desired programme is missing.<\/p><p>Cambridge, for example, warns directly: the combination of A level or IB subjects affects which university courses are open to you. This is an example of the logic of checking, not a universal requirement of all universities. The conditions of each course must be read separately.<\/p><p>A levels, IB and Foundation should not be treated as interchangeable names. Check which qualification is awarded, by whom it is recognised and where it allows you to apply. A preparatory programme may limit later courses and universities.<\/p><h3>What to compare between colleges<\/h3><p><b>Curriculum.<\/b> The necessary subjects must really be taught in the chosen set. Ask whether they can be combined in the timetable and what conditions apply to changing a subject.<\/p><p><b>Support.<\/b> Ask who helps with choosing universities, the application, exams and the portfolio, and what exactly is included in the price. The phrase \"we support admission\" is too general on its own.<\/p><p><b>Everyday environment.<\/b> Assess group size, independent work, feedback, language support and social life outside lessons. A prestigious environment is not necessarily the right one for this particular teenager.<\/p><p><b>Housing and care.<\/b> For a minor, find out in advance who is responsible for them outside lessons, how accommodation, contact with the family and help in a difficult situation are arranged. Ask about specific duties, not just the presence of the word \"support\" in a brochure.<\/p><p><b>Total budget.<\/b> Add up tuition, housing, food, exam and additional costs. The payment and refund terms must be clear before any money is paid.<\/p><h3>Preparation is not a guarantee of admission<\/h3><p>Finishing college does not in itself promise a place at the chosen university. If a transfer through a partner route is advertised, ask for the conditions in writing: which grades, subjects and other requirements must be met and which programmes the offer covers.<\/p><p><b>Next step:<\/b> choose several university courses, write out their subject requirements and compare colleges against that task in MainExperts.<\/p><p><b>Sources:<\/b> <a href=\"https://www.gov.uk/further-education-courses\" target=\"_blank\" rel=\"noopener\">GOV.UK: further education<\/a>; <a href=\"https://www.undergraduate.study.cam.ac.uk/apply/before/choosing-high-school-subjects\" target=\"_blank\" rel=\"noopener\">Cambridge: choosing high school subjects<\/a>; <a href=\"https://www.ucas.com/applying/you-apply/what-and-where-study/entry-requirements\" target=\"_blank\" rel=\"noopener\">UCAS: entry requirements<\/a>. Checked on 04.11.2026.<\/p>"}, {"t": "Summer programmes: how to choose by dates and age", "x": "Age, dates, content and accommodation: how to find a programme that suits your child and your family.", "h": "<p>Two summer programmes can have equally beautiful photographs and a completely different experience inside. On one, your child will try a new subject; on another, they will study a language intensively; on a third, they will spend most of the time on excursions. Start with what result is needed right now.<\/p><h3>Choose one main goal<\/h3><p>Discuss with your child: do they want to test their interest in a field, complete a project, practise a language or try living in an international environment? Several goals can be combined, but one should drive the choice. For getting to know a subject, real assignments and feedback matter. For language practice, what matters is how often the child will speak and with whom.<\/p><h3>Check the age on the right date<\/h3><p>The organiser may have different rules for calculating age: at the start of the session or on another fixed date. Do not draw a conclusion from the range on the card alone. If your child is on the border of an age group, get confirmation before paying. Not every university summer school accepts minors: for example, some Oxford Lifelong Learning programmes are for adults only.<\/p><h3>Match the study dates with the trip<\/h3><p>The start date of classes may differ from the arrival day. Note separately the arrival, the study period, the departure, the transfer and a time buffer for travel. Check overlaps with school exams and family plans. If documents or the trip need preparation, take it into account before booking non-refundable services.<\/p><h3>Look at the schedule of an ordinary day<\/h3><p>Ask for a sample week: how many lessons, independent work, sports, excursions and free time. Find out the group size, the language of instruction and the expected starting level. The wording \"design classes\" says little about the content; it is clearer when it states what the child will create and what feedback they will receive.<\/p><h3>Find out who runs the programme<\/h3><p>The name of a city or a photograph of a campus does not prove that the organiser is a university. Check the organiser's legal name, the teachers and the nature of the link with the venue. Participation and a certificate should not be taken as a promise of advantages in future admission: judge first of all by the content and the experience.<\/p><h3>Run a short check before paying<\/h3><ul><li>The child's age and level meet the rules of participation.<\/li><li>The exact arrival and departure dates are confirmed.<\/li><li>The study load and the final result are clear.<\/li><li>It is known where the child lives and who is responsible for them outside lessons.<\/li><li>Meals, medical help and emergency contact are clarified.<\/li><li>There is a full list of included and additional costs.<\/li><li>The terms of cancellation, refund and replacement of a session have been read.<\/li><li>The child understands where they are going and wants to take part.<\/li><\/ul><h3>How to tell whether the programme delivered<\/h3><p>Before the trip, write down one question your child wants to answer: \"Do I like doing research?\" or \"Am I ready to study in English every day?\" Afterwards discuss the answer and specific examples. Even the conclusion \"this direction is not for me\" can help the next educational decision.<\/p><p><b>Next step:<\/b> set the age, the available dates and the goal of the trip, then compare short programmes in MainExperts.<\/p><p><b>Sources:<\/b> <a href=\"https://www.lifelong-learning.ox.ac.uk/about/inspiring-oxford-frequently-asked-questions\" target=\"_blank\" rel=\"noopener\">Oxford Lifelong Learning: age conditions of one summer programme<\/a>; <a href=\"https://www.undergraduate.study.cam.ac.uk/events/summer-schools/faq\" target=\"_blank\" rel=\"noopener\">Cambridge: summer school questions<\/a>. Checked on 04.11.2026. The checklist is editorial advice; the conditions of each programme must be confirmed with the organiser.<\/p>"}];

function resList(){
  const wd=(arr,d)=>arr.map(x=>Object.assign({d},x));
  let list;
  if(S.d==="vuz"||S.d==="col"){
    if(S.profFilter){const p=item(S.profFilter);list=wd(DATA.vuz,"vuz").concat(wd(DATA.col,"col")).filter(x=>x.pros&&x.pros.includes(p.id))}
    else list=wd(DATA[S.d],S.d);
  }else list=wd(DATA[S.d],S.d);
  if(S.d==="kp"){
    const ag=parseInt(S.f.age,10);if(ag)list=list.filter(x=>!x.ageMin||(x.ageMin<=ag&&ag<=x.ageMax));
    const du=DUR[S.f.duration];if(du)list=list.filter(x=>x.wk===undefined||(x.wk>=du[0]&&x.wk<=du[1]));
  }
  // фильтр по цене
  if(S.d!=="pro"){const mx=Math.max(...list.map(x=>x.p),1)*S.maxPct/100;list=list.filter(x=>x.p<=mx+0.001)}
  const s=S.sort;
  if(S.d==="kp"&&S.f.period==="Укажу даты")list.sort((a,b)=>fitsDates(b)-fitsDates(a));
  if(S.d==="pro"){
    if(S.quizProf)list.sort((a,b)=>(b.id===S.quizProf)-(a.id===S.quizProf));
    const rk={"Низкий":0,"Средний":1};
    if(s==="salary")list.sort((a,b)=>b.sal[1]-a.sal[1]);else if(s==="demand")list.sort((a,b)=>b.demand[1]-a.demand[1]);else if(s==="risk")list.sort((a,b)=>rk[a.risk]-rk[b.risk]);
  }else{
    if(s==="cheap")list.sort((a,b)=>a.p-b.p);
    else if(s==="pricey")list.sort((a,b)=>b.p-a.p);
    else if(s==="deadline")list.sort((a,b)=>(a.dl?a.dl[0]*40+a.dl[1]:a.start*40)-(b.dl?b.dl[0]*40+b.dl[1]:b.start*40));
    else if(s==="soon")list.sort((a,b)=>a.start-b.start);
    else if(s==="late"){if(S.d==="kp")list.sort((a,b)=>b.start-a.start);else list.sort((a,b)=>(b.dl[0]*40+b.dl[1])-(a.dl[0]*40+a.dl[1]))}
    else if(s==="chance")list.sort((a,b)=>fitPct(b)-fitPct(a));
    else if(s==="short")list.sort((a,b)=>a.y-b.y);
    else if(S.d==="vuz"||S.d==="col")list.sort((a,b)=>fitPct(b)-fitPct(a));
  }
  if(S.d!=="pro"&&(s==="best"||!s)){const ad=list.filter(x=>x.ad),rest=list.filter(x=>!x.ad);list=ad.concat(rest)}
  return list;
}

function cmpRows(its){
  const pc=x=>x.d==="vuz"||x.d==="col";
  const R=[];
  R.push({l:"Страна",v:x=>x.c?esc(T(x.c)):"—"});
  R.push({l:"Совпадение с профилем",v:x=>pc(x)?'<span class="bar" style="--c:'+DIRS[x.d].color+'"><i style="width:'+fitPct(x)+'%"></i></span> '+fitPct(x)+'%':"—",k:x=>pc(x)?fitPct(x):null,best:"max",tag:"Лучшее"});
  R.push({l:"Цена",v:x=>x.p?money(x.p)+' '+T(x.y?"в год":"за программу"):(x.sal?money(x.sal[0])+' – '+money(x.sal[1]):"—"),k:x=>x.p||null,best:"min",tag:"Дешевле"});
  R.push({l:"за весь срок",v:x=>x.y&&x.p?money(x.p*x.y):"—",k:x=>x.y&&x.p?x.p*x.y:null,best:"min",tag:"Дешевле"});
  R.push({l:"Срок обучения",v:x=>x.y?x.y+' '+T("лет"):"—"});
  R.push({l:"Срок подачи",v:x=>x.dl?dateTxt(x.dl[0],x.dl[1]):"—",k:x=>x.dl?x.dl[0]*40+x.dl[1]:null,best:"min",tag:"Ближайший"});
  R.push({l:"Даты",v:x=>x.from?rangeTxt(x.from,x.to):"—"});
  R.push({l:"Языки",v:x=>x.lang?esc(T(x.lang)):"—"});
  R.push({l:"Спрос",v:x=>x.demand?T(x.demand[0]):"—",k:x=>x.demand?x.demand[1]:null,best:"max",tag:"Лучшее"});
  R.push({l:"Риск автоматизации",v:x=>x.risk?T(x.risk):"—"});
  R.push({l:"Нужные навыки",v:x=>x.skills?esc(T(x.skills)):"—"});
  R.push({l:"Ведёт к профессиям",v:x=>x.pros?x.pros.map(id=>esc(T(item(id).t))).join(", "):"—"});
  return R.filter(r=>its.some(x=>r.v(x)!=="—"));
}
function vCompare(){
  const its=S.short.filter(id=>S.favs.includes(id)).map(item);
  if(its.length<2)return '<div class="wrap sub"><h1>'+T("Сравнение")+'</h1><p class="lead">'+T("Сохраните хотя бы два варианта, чтобы сравнить их")+'</p><button class="btn gold" onclick="go(\'home\')">'+T("Поиск")+'</button> <button class="btn ghost" onclick="go(\'cabinet\')">'+T("Открыть сохранённое")+'</button></div>';
  const rows=cmpRows(its);
  const best=r=>{if(!r.best)return null;const v=its.map(x=>r.k(x)).filter(z=>z!==null);if(v.length<2||v.every(z=>z===v[0]))return null;return r.best==="min"?Math.min(...v):Math.max(...v)};
  const vis=rows.filter(r=>!S.onlyDiff||new Set(its.map(x=>r.v(x))).size>1);
  const chips=[["Цена","Дешевле всего"],["Совпадение с профилем","Выше совпадение"],["Срок подачи","Ближайший срок подачи"]].map(([l,t])=>{const r=rows.find(q=>q.l===l);if(!r)return"";const b=best(r);if(b===null)return"";const w=its.filter(x=>r.k(x)===b);return '<span class="chip known">'+T(t)+': <b>'+w.map(x=>esc(T(x.t))).join(", ")+'</b></span>'}).join("");
  const grid='<div class="cmpv"><div class="tbl" style="--n:'+its.length+'"><div class="c lbl"></div>'+its.map(x=>'<div class="hd"><img src="'+art(x.id)+'" alt=""><button class="x" aria-label="'+esc(T("Убрать"))+'" onclick="S.short=S.short.filter(i=>i!==\''+x.id+'\');if(S.short.length<2)go(\'cabinet\');else render()">×</button><div class="b"><span class="chip" style="background:'+DIRS[x.d].bg+'">'+T(DIRS[x.d].name)+'</span>'+(x.ad?' <span class="chip" style="background:#e8eefc">'+T("Партнёр · реклама")+'</span>':'')+'<h3>'+esc(T(x.t))+'</h3></div></div>').join("")
   +vis.map(r=>{const b=best(r);return '<div class="c lbl">'+T(r.l)+'</div>'+its.map(x=>'<div class="c'+(b!==null&&r.k(x)===b?' best':'')+'"'+(b!==null&&r.k(x)===b?' data-b="'+esc(T(r.tag))+'"':'')+'>'+r.v(x)+'</div>').join("")}).join("")
   +'<div class="c lbl"></div>'+its.map(x=>'<div class="c"><button class="btn gold sm" onclick="big(\''+x.id+'\')">'+(x.d==="kp"?T("Перейти или записаться"):T("Перейти или подать заявку"))+'</button></div>').join("")+'</div></div>';
  return '<div class="wrap sub">'+A("Этап 4: сравнение до 4 вариантов из короткого списка сохранённого; лучшее значение в строке подсвечено.")+'<div class="crumb small"><a style="color:#0062e3;cursor:pointer" onclick="go(\'cabinet\')">'+T("Сохранённое")+'</a> / '+T("Сравнение")+'</div>'
   +'<div class="sttl"><h1>'+T("Сравнение")+' ('+its.length+')</h1><label class="sw'+(S.onlyDiff?' on':'')+'" onclick="S.onlyDiff=!S.onlyDiff;render()"><i></i>'+T("Только различия")+'</label></div>'
   +'<div class="vchips">'+chips+'</div>'+grid+'<div class="small mute" style="margin-top:10px">'+T("Изображения-заглушки, цены и курс — демонстрационные.")+'</div></div>';
}

  $("#foot").textContent=T("Концепт портала. Все названия, цены, курсы, сроки и изображения демонстрационные. Цены пересчитаны по демонстрационному курсу. Концепт не утверждён основателем.");
  if(S.screen==="home"){bannerStart()}
  if(S.screen==="home"&&!S.tabPinned){const el=document.getElementById("typed");if(el&&TY.pos===0){el.textContent=" "}TY.timer=setTimeout(typedTick,TY.pos?60:300)}
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===S.screen||(b.dataset.s==="home"&&["search","results"].includes(S.screen))));
}
splashRun();
window.__S=S;window.__go=(s)=>{S.screen=s;render();window.scrollTo(0,0)};window.__render=render;
render();
</script>
</body>
