<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет партнёра MainExperts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#faf6f0; --surface:#ffffff; --inset:#f4ece0; --sunk:#f7e9d5;
  --ink:#2a2018; --muted:#6d5d4c; --hair:#e8dccb;
  --accent:#9a5a1c; --accent-strong:#7a4413; --accent-soft:#f7e9d5;
  --ok:#3f7a2e; --ok-soft:#e7f0e2; --warn:#8a5a12; --warn-soft:#f6ead2; --risk:#c9382f; --risk-soft:#fae5e3;
  --grad:linear-gradient(135deg,#a86a2c,#6f3f1c);
  --sh1:0 1px 2px rgba(42,32,24,.06); --sh2:0 10px 30px rgba(42,32,24,.12);
  --display:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:14px; --r-field:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#16110d; --surface:#1e1813; --inset:#261e17; --sunk:#2c2118;
    --ink:#f3ebe0; --muted:#b3a291; --hair:#35291f;
    --accent:#d99a55; --accent-strong:#e7b075; --accent-soft:#33251a;
    --ok:#8ac47a; --ok-soft:#22301d; --warn:#dfae63; --warn-soft:#312512; --risk:#ef8279; --risk-soft:#37201e;
    --grad:linear-gradient(135deg,#8a5423,#4f2d14);
    --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#16110d; --surface:#1e1813; --inset:#261e17; --sunk:#2c2118;
  --ink:#f3ebe0; --muted:#b3a291; --hair:#35291f;
  --accent:#d99a55; --accent-strong:#e7b075; --accent-soft:#33251a;
  --ok:#8ac47a; --ok-soft:#22301d; --warn:#dfae63; --warn-soft:#312512; --risk:#ef8279; --risk-soft:#37201e;
  --grad:linear-gradient(135deg,#8a5423,#4f2d14);
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-bottom:84px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* шапка */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;border-bottom:1px solid var(--hair);
  background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--display);font-size:1.05rem;font-weight:600}
.brand span{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.who .ava{width:30px;height:30px;border-radius:999px;background:var(--grad);color:#fff;display:grid;place-items:center;
  font-size:.78rem;font-weight:700;font-family:var(--sans)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;
  background:var(--inset);border:1px solid var(--hair);color:var(--muted)}
.chip.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* оболочка */
.shell{display:grid;grid-template-columns:214px minmax(0,1fr);gap:22px;max-width:1180px;margin:0 auto;padding:20px;padding-block:22px}
.rail{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:74px}
.rail .eyebrow{margin:6px 8px 6px}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-radius:var(--r-field);padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.92rem}
.rail button:hover{background:var(--inset);color:var(--ink)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.rail .dot{width:7px;height:7px;border-radius:999px;background:var(--accent);flex:none}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tiny{font-size:.78rem}

/* карточки */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-card);box-shadow:var(--sh1);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.split{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}

/* заметка тура */
.notice{border-left:3px solid var(--accent);background:var(--inset);border-radius:0 var(--r-field) var(--r-field) 0;
  padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.notice.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.notice.risk{border-left-color:var(--risk);background:var(--risk-soft)}

/* показатели */
.kpi{background:var(--inset);border-radius:var(--r-field);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--display);font-size:1.32rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi.accent{background:var(--accent-soft)}
.kpi.accent .v{color:var(--accent-strong)}

/* таблицы */
.tw{overflow-x:auto;border:1px solid var(--hair);border-radius:var(--r-field)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--inset)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.risk{background:var(--risk-soft);color:var(--risk)}
.pill.n{background:var(--inset);color:var(--muted)}
.missing{color:var(--muted);font-style:italic}

/* кнопки */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-field);border:1px solid var(--hair);
  background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:600;font-size:.88rem;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--sh1)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:var(--sh2);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{padding:5px 10px;font-size:.8rem;font-weight:500}

/* поля */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:600}
.input,select{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-field);padding:9px 11px;width:100%}
.input:focus,select:focus{border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--inset);border-radius:var(--r-field);padding:12px 14px}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}

/* шкала цены */
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{position:relative;height:46px;margin-top:6px}
.scale .bar{position:absolute;left:0;right:0;top:7px;height:6px;border-radius:999px;background:var(--inset);overflow:hidden}
.scale .fill{position:absolute;left:0;top:0;bottom:0;background:var(--grad)}
.scale .tick{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:.72rem;color:var(--muted);white-space:nowrap}
.scale .tick i{display:block;width:1px;height:18px;margin:0 auto 2px;background:var(--hair);font-style:normal}
.scale .tick.acc{color:var(--accent-strong);font-weight:600}
.scale .tick.acc i{background:var(--accent)}

/* предпросмотр страницы семьи */
.preview{background:var(--inset);border:1px dashed var(--hair);border-radius:var(--r-card);padding:16px}
.preview .sheet{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-field);padding:18px;display:flex;flex-direction:column;gap:12px}
.price{font-family:var(--display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent-strong)}
.strike{text-decoration:line-through;color:var(--muted);font-size:1rem;margin-left:10px;font-family:var(--sans)}

/* лента статусов */
.trail{display:flex;flex-direction:column;gap:0}
.trail .s{display:grid;grid-template-columns:16px 1fr;gap:12px;padding-bottom:12px;position:relative}
.trail .s:not(:last-child)::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--hair)}
.trail .m{width:15px;height:15px;border-radius:999px;border:2px solid var(--hair);background:var(--surface);margin-top:3px}
.trail .s.done .m{background:var(--ok);border-color:var(--ok)}
.trail .s.now .m{background:var(--accent);border-color:var(--accent)}
.trail .s.bad .m{background:var(--risk);border-color:var(--risk)}
.trail .t{font-weight:600;font-size:.9rem}

/* вход */
.gate{min-height:60vh;display:grid;place-items:center;padding:28px 20px}
.gate .card{max-width:430px;width:100%;display:flex;flex-direction:column;gap:14px}
.gate .mark{height:5px;border-radius:999px;background:var(--grad);width:64px}

/* нижняя панель демонстрации */
.demobar{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--hair);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px)}
.demobar .prog{height:3px;background:var(--inset)}
.demobar .prog i{display:block;height:100%;background:var(--grad);transition:width .2s ease}
.demobar .inner{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;padding:10px 20px}
.demobar .txt{min-width:0;flex:1}
.demobar .txt b{display:block;font-size:.9rem}
.demobar .txt span{display:block;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demobar .cnt{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{max-width:1180px;margin:0 auto;padding:0 20px 24px;font-size:.78rem;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail .eyebrow{display:none}
  .rail button{width:auto;white-space:nowrap;border:1px solid var(--hair);padding:6px 12px;border-radius:999px;font-size:.85rem}
  .demobar .txt span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>MainExperts</b><span>Кабинет партнёра</span></div>
  <div class="who" id="who"></div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Разделы кабинета"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<footer id="foot"></footer>

<div class="demobar">
  <div class="prog"><i id="prog" style="width:0%"></i></div>
  <div class="inner">
    <button class="btn" id="prev" type="button">Назад</button>
    <div class="txt"><b id="stepName"></b><span id="stepNote"></span></div>
    <div class="cnt" id="stepCnt"></div>
    <button class="btn primary" id="next" type="button">Далее</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var S=0.35, Y=20000, X=35000, P=50000, SMAX=120000, NDFL=0.13;

  function money(n){
    var s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
    return (n<0?"−":"")+s+" ₽";
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  var TAX={
    none:{name:"не указан", hint:"Выплата заблокирована: укажите статус и реквизиты.", net:function(g){return 0;}, expl:"Статус для выплат не указан, поэтому сумма к выплате не рассчитывается."},
    person:{name:"физическое лицо, резидент", hint:"Платформа удерживает налог на доходы 13 %.", net:function(g){return g*(1-NDFL);}, expl:"К выплате меньше начисленного: удержан налог на доходы 13 %."},
    self:{name:"самозанятый", hint:"Выплата полной суммой, чек формируете вы.", net:function(g){return g;}, expl:"Выплата полной суммой: налог вы платите сами, к выплате прикладывается чек."},
    ip:{name:"индивидуальный предприниматель", hint:"Выплата по счёту и акту, полной суммой.", net:function(g){return g;}, expl:"Выплата полной суммой по счёту и акту."}
  };

  var st={
    step:0, section:"gate", terms:false, tax:"none", requisites:false,
    k:28000, offerCreated:false, offerK:28000, offerName:"Родителям 8–9 класса",
    offerStopped:false, secondOffer:false, directSale:false, preview:false, copied:""
  };

  var STEPS=[
    {id:"gate",   sec:"gate",     name:"Вход в кабинет",            note:"Тестер открывает ссылку-приглашение и входит как партнёр.", src:"П1–П2"},
    {id:"join",   sec:"join",     name:"Оферта и подключение",       note:"Без экзамена и предоплаты. До принятия оферты предложения недоступны.", src:"ИНТ-01"},
    {id:"payout", sec:"payout",   name:"Статус для выплат",          note:"Кабинет работает и без реквизитов, заблокирована только выплата.", src:"ИНТ-01, ФИН-03"},
    {id:"terms",  sec:"terms",    name:"Условия словами",            note:"Цены и доля названы словами и суммами. Ни одной буквы в интерфейсе.", src:"ИНТ-02"},
    {id:"new",    sec:"new",      name:"Цена предложения",           note:"Шкала от минимальной цены, верхней границы нет. Начисление — доля от цены, считается на лету.", src:"ИНТ-04"},
    {id:"offers", sec:"offers",   name:"Ссылка и код",               note:"Предложение неизменяемо: цена меняется только новым предложением.", src:"ИНТ-05, ИНТ-06"},
    {id:"family", sec:"offers",   name:"Страница семьи",             note:"Предпросмотр того, что видит семья: имя партнёра, цена, продавец.", src:"ИНТ-07"},
    {id:"orders", sec:"orders",   name:"Первая оплата",              note:"Строка на заказ без единого поля с данными ребёнка.", src:"ИНТ-12, ИНТ-17"},
    {id:"hold",   sec:"money",    name:"Начисление и удержание",     note:"Начислено до налогов и дата доступности. Без выданного отчёта выплаты нет.", src:"ИНТ-13, ФИН-04"},
    {id:"pay",    sec:"money",    name:"Выплата",                    note:"Два поля раздельно и объяснение ветки по вашему статусу.", src:"ИНТ-13, ФИН-03"},
    {id:"debt",   sec:"money",    name:"Возврат после выплаты",      note:"Возврат превращается в долг и зачитывается против следующего начисления.", src:"ФИН-06, ФИН-07"},
    {id:"panel",  sec:"panel",    name:"Панель пилота",              note:"Счётчики без долей, пока наблюдений меньше десяти. Прибыль не показывается.", src:"П7, 7.6"}
  ];

  var SECTIONS=[
    {id:"panel",  t:"Панель"},
    {id:"offers", t:"Предложения"},
    {id:"new",    t:"Новое предложение"},
    {id:"orders", t:"Обращения и оплаты"},
    {id:"money",  t:"Начисления и выплаты"},
    {id:"kit",    t:"Материалы"},
    {id:"terms",  t:"Условия"},
    {id:"payout", t:"Статус и реквизиты"},
    {id:"alerts", t:"Уведомления"},
    {id:"help",   t:"Помощь"}
  ];

  function stepIndex(id){for(var i=0;i<STEPS.length;i++){if(STEPS[i].id===id)return i;}return -1;}
  function at(id){return st.step>=stepIndex(id);}
  function today(){
    if(!at("orders")) return "15.09.2026";
    if(st.step===stepIndex("orders")) return "18.09.2026";
    if(st.step===stepIndex("hold")) return "22.09.2026";
    if(st.step===stepIndex("pay")) return "07.10.2026";
    return "27.10.2026";
  }
  function gross(){return Math.round(st.offerK * S);}

  /* ---------- данные демонстрации ---------- */
  function orders(){
    var g=gross(), list=[];
    if(at("orders")) list.push({n:"МЕ-1042", date:"18.09.2026", price:st.offerK, gross:g,
      serv:at("hold")?"отчёт выдан":"проходит", accr:at("pay")?"выплачено":(at("hold")?"удержание до 02.10":"удержание")});
    if(at("hold")) list.push({n:"МЕ-1057", date:"21.09.2026", price:st.offerK, gross:g,
      serv:at("debt")?"возврат":"отчёт выдан", accr:at("debt")?"отменено, долг":(at("pay")?"выплачено":"удержание до 05.10")});
    if(at("debt")) list.push({n:"МЕ-1113", date:"12.10.2026", price:st.offerK, gross:g,
      serv:"отчёт выдан", accr:"зачтено в счёт долга"});
    return list;
  }
  function servPill(s){
    if(s==="возврат") return '<span class="pill risk">возврат</span>';
    if(s==="отчёт выдан") return '<span class="pill ok">отчёт выдан</span>';
    return '<span class="pill warn">'+esc(s)+'</span>';
  }
  function accrPill(s){
    if(s.indexOf("выплачено")===0) return '<span class="pill ok">выплачено</span>';
    if(s.indexOf("удержание")===0) return '<span class="pill warn">'+esc(s)+'</span>';
    if(s.indexOf("отменено")===0||s.indexOf("зачтено")===0) return '<span class="pill risk">'+esc(s)+'</span>';
    return '<span class="pill n">'+esc(s)+'</span>';
  }
  function sums(){
    var g=gross(), t=TAX[st.tax];
    var accrued=0, held=0, avail=0, paid=0, debt=0, reversed=0, offset=0;
    if(at("orders")){accrued+=g; held+=g;}
    if(at("hold")){accrued+=g; held+=g;}
    if(at("pay")){held=0; paid=2*g;}
    if(at("debt")){accrued+=g; reversed=g; offset=g; held=0; avail=0;}
    return {accrued:accrued, held:held, avail:avail, paid:paid, debt:debt,
      reversed:reversed, offset:offset, net:t.net(paid)};
  }

  /* ---------- разделы ---------- */
  var V={};

  V.gate=function(){
    return '<div class="gate"><div class="card">'+
      '<div class="mark"></div>'+
      '<h1>Вход в кабинет партнёра</h1>'+
      '<p class="small muted">Демонстрационный прототип. Данные вымышленные, продаж и платежей нет. Вход открывает кабинет в том виде, в каком его увидит партнёр первой волны.</p>'+
      '<div class="field"><label for="gl">Электронная почта</label><input class="input" id="gl" value="a.sokolova@example.ru" readonly></div>'+
      '<div class="field"><label for="gp">Код из письма-приглашения</label><input class="input" id="gp" value="482 915" readonly></div>'+
      '<button class="btn primary" data-act="login" style="justify-content:center">Войти в кабинет</button>'+
      '<p class="tiny muted">Вход по приглашению координатора. Регистрация с улицы на пилоте закрыта, партнёры — резиденты России.</p>'+
      '</div></div>';
  };

  V.join=function(){
    return card('Подключение', 'Заполняется один раз. Экзамена, обучения и предоплаты нет.',

        '<div class="kpi"><span class="l">Отменено возвратами</span><span class="v">'+money(s.reversed?-s.reversed:0)+'</span></div>'+
        '<div class="kpi"><span class="l">Открытые долги</span><span class="v">'+money(s.debt)+'</span></div>'+
      '</div>'+
      '<div class="tw"><table><thead><tr><th>Разрез</th><th class="num">Оплат</th><th class="num">Средняя цена</th><th>Доля</th></tr></thead><tbody>'+
        '<tr><td>Предложение «'+esc(st.offerName)+'»</td><td class="num">'+n+'</td><td class="num">'+money(st.offerK)+'</td><td class="missing">меньше 10 наблюдений</td></tr>'+
        '<tr><td>Круг знакомых основателя</td><td class="num">1</td><td class="num">'+money(st.offerK)+'</td><td class="missing">меньше 10 наблюдений</td></tr>'+
        '<tr><td>Пришли по ссылке</td><td class="num">'+Math.max(0,n-1)+'</td><td class="num">'+money(st.offerK)+'</td><td class="missing">меньше 10 наблюдений</td></tr>'+
      '</tbody></table></div>'+
      '<div class="notice"><b class="small">Доли и конверсии не показываются, пока наблюдений меньше десяти</b>'+
        '<span class="tiny muted">На таких числах процент вводит в заблуждение. Покупки из круга основателя считаются отдельной строкой и в выводы о канале не входят.</span></div>');
  };

  V.kit=function(){
    return card('Материалы','Готовые тексты с подставленной ценой '+money(st.offerCreated?st.offerK:st.k)+'.',
      '<div class="grid g2">'+
        kitCard("Образец отчёта","Обезличенный пример на 40 страниц. Показывать можно целиком.")+
        kitCard("Сообщение родителю лично","«Мы обсуждали, куда идти после девятого. Есть разбор: подросток проходит опрос за 40 минут, родитель получает отчёт и встречу. По моей ссылке — "+money(st.offerCreated?st.offerK:st.k)+".»")+
        kitCard("Сообщение в родительский чат","Короткий текст с вашим именем и ссылкой. Без обещаний поступления и гарантий результата.")+
        kitCard("Ответы на возражения","«Почему не бесплатно», «чем отличается от школьного теста», «что если ребёнку не понравится».")+
      '</div>'+
      '<p class="tiny muted">Названия методик в материалах не используются. Обещать поступление, оценки или доход нельзя — это условие программы.</p>');
  };
  function kitCard(t,d){return '<div class="kpi"><span class="l" style="font-weight:600;color:var(--ink)">'+esc(t)+'</span><span class="tiny muted">'+esc(d)+'</span></div>';}

  V.alerts=function(){
    var list=[];
    if(at("orders")) list.push(["18.09.2026","Оплата по вашей ссылке","Заказ МЕ-1042, "+money(st.offerK)+". Начисление "+money(gross())+" до налогов."]);
    if(at("hold")) list.push(["22.09.2026","Отчёт выдан","Заказ МЕ-1042. Срок удержания сокращается: сумма станет доступной 02.10.2026."]);
    if(at("pay")) list.push(["02.10.2026","Сумма доступна к выплате","Войдёт в реестр 06.10.2026."]);
    if(at("pay")) list.push(["07.10.2026","Выплачено","Банк подтвердил перевод."]);
    if(at("debt")) list.push(["15.10.2026","Возврат по заказу МЕ-1057","Начисление отменено, возник долг "+money(gross())+"."]);
    if(!list.length) return card('Уведомления','Пока пусто.','<div class="notice"><b class="small">Сюда приходят оплата, выдача отчёта, доступность и выплата</b><span class="tiny muted">Переход по ссылке уведомлением не приходит: он виден в статистике.</span></div>');
    return card('Уведомления','Почта и кабинет.',
      '<div class="stack">'+list.reverse().map(function(a){
        return '<div class="notice"><b class="small">'+esc(a[1])+'</b><span class="tiny">'+esc(a[2])+'</span><span class="tiny muted">'+a[0]+'</span></div>';}).join("")+'</div>'+
      '<p class="tiny muted">В уведомлениях нет имени семьи и данных ребёнка.</p>');
  };

  V.help=function(){
    return card('Помощь','Ответ — в рабочий день.',
      '<div class="grid g2">'+
        '<div class="field"><label for="hs">О чём вопрос</label><select id="hs"><option>Предложение и цена</option><option>Заказ семьи</option><option>Начисление и выплата</option><option>Возврат</option><option>Другое</option></select></div>'+
        '<div class="field"><label for="ho">Заказ или предложение</label><input class="input" id="ho" placeholder="Номер заказа, необязательно"></div>'+
      '</div>'+
      '<div class="field"><label for="ht">Вопрос</label><textarea class="input" id="ht" rows="3" placeholder="Опишите ситуацию"></textarea></div>'+
      '<button class="btn primary" style="align-self:flex-start">Отправить</button>'+
      '<p class="tiny muted">Координатор видит ваш заказ и предложение, данные ребёнка ему в этой форме не передаются.</p>');
  };

  function card(title,sub,body){
    return '<section class="stack"><div class="head"><h1>'+esc(title)+'</h1><p class="small muted">'+esc(sub)+'</p></div>'+
      '<div class="card stack">'+body+'</div></section>';
  }
  function fact(t,v,d){
    return '<div class="kpi"><span class="l">'+esc(t)+'</span><span class="v">'+v+'</span><span class="tiny muted">'+esc(d)+'</span></div>';
  }

  /* ---------- отрисовка ---------- */
  function render(){
    var s=STEPS[st.step];
    var logged=st.step>0;
    var main=document.getElementById("main");
    var shell=document.querySelector(".shell");
    var rail=document.getElementById("rail");

    if(!logged){ st.section="gate"; }
    rail.hidden=!logged;
    shell.style.gridTemplateColumns = logged? "" : "1fr";

    document.getElementById("who").innerHTML = logged
      ? '<span class="chip on">Вошли как партнёр</span><span class="ava">АС</span><span>Анна Соколова</span>'
      : '<span class="chip">Демонстрация</span>';

    rail.innerHTML='<span class="eyebrow">Кабинет</span>'+SECTIONS.map(function(x){
      var cur=st.section===x.id;
      var mark = (x.id==="offers"&&st.offerCreated&&!at("orders")) || (x.id==="orders"&&at("orders")&&st.section!=="orders") || (x.id==="money"&&at("hold")&&st.section!=="money");
      return '<button type="button" data-act="sec" data-v="'+x.id+'" aria-current="'+cur+'">'+esc(x.t)+(mark?'<span class="dot"></span>':"")+'</button>';
    }).join("");

    var view=V[st.section]||V.panel;
    main.innerHTML=view();

    if(logged){
      main.insertAdjacentHTML("afterbegin",
        '<div class="notice" style="margin-bottom:16px"><span class="eyebrow">Шаг '+st.step+' из '+(STEPS.length-1)+' · '+esc(s.src)+'</span>'+
        '<b class="small">'+esc(s.name)+'</b><span class="tiny muted">'+esc(s.note)+'</span></div>');
    }

    document.getElementById("prev").disabled = st.step===0;
    document.getElementById("next").disabled = st.step===STEPS.length-1;
    document.getElementById("next").textContent = st.step===STEPS.length-1 ? "Конец" : "Далее";
    document.getElementById("stepName").textContent = s.name;
    document.getElementById("stepNote").textContent = s.note;
    document.getElementById("stepCnt").textContent = st.step+" / "+(STEPS.length-1);
    document.getElementById("prog").style.width = (st.step/(STEPS.length-1)*100)+"%";

    document.getElementById("foot").innerHTML =
      'Демонстрационный прототип кабинета партнёра. Источник: техническое задание партнёрской сети, разделы путей партнёра и семьи, от 12.09.2026; рабочие значения пилота для России от 09.09.2026. Заказы, суммы и даты вымышленные — реальных продаж и платежей в прототипе нет.';
  }

  function go(i){
    var n=Math.max(0,Math.min(STEPS.length-1,i));
    st.step=n;
    var s=STEPS[n];
    if(s.id==="join") st.section="join";
    else st.section=s.sec;
    if(s.id==="payout"&&st.tax==="none"&&!st.touchedTax){st.tax="person";st.requisites=true;}
    if(stepIndex("offers")<=n&&!st.offerCreated){st.offerCreated=true;st.offerK=st.k;}
    if(s.id==="family") st.preview=true;
    if(s.id==="new") st.preview=false;
    render();
    document.getElementById("main").focus();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  document.addEventListener("click",function(e){
    var el=e.target.closest("[data-act]"); if(!el) return;
    var a=el.getAttribute("data-act"), v=el.getAttribute("data-v");
    if(a==="login"){go(1);return;}
    if(a==="sec"){st.section=v;render();return;}
    if(a==="go-new"){st.section="new";render();return;}
    if(a==="req"){st.requisites=true;render();return;}
    if(a==="create"){st.offerCreated=true;st.offerK=st.k;st.section="offers";render();return;}
    if(a==="copy"){st.copied=v;render();return;}
    if(a==="preview"){st.preview=!st.preview;render();return;}
    if(a==="stop"){st.offerStopped=!st.offerStopped;render();return;}
    if(a==="second"){st.secondOffer=!st.secondOffer;render();return;}
  });
  document.addEventListener("change",function(e){
    var el=e.target.closest("[data-act]"); if(!el) return;
    var a=el.getAttribute("data-act");
    if(a==="terms"){st.terms=el.checked;render();}
    if(a==="tax"){st.tax=el.value;st.touchedTax=true;render();}
    if(a==="direct"){st.directSale=el.checked;render();}
  });
  document.addEventListener("input",function(e){
    var el=e.target.closest("[data-act]"); if(!el) return;
    var a=el.getAttribute("data-act");
    if(a==="k"){
      st.k=parseInt(el.value,10);
      var v=V.new(); var main=document.getElementById("main");
      var note=main.firstElementChild.outerHTML;
      main.innerHTML=note+v;
      var r=document.getElementById("k"); if(r){r.focus();}
    }
    if(a==="oname"){st.offerName=el.value;}
  });
  document.getElementById("next").addEventListener("click",function(){go(st.step+1);});
  document.getElementById("prev").addEventListener("click",function(){go(st.step-1);});

  render();
})();
</script>
</body>
</html>
