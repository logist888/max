<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MainExperts — Система корпоративной документации (DMS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#13202F;--panel:#1A2B3E;--panel-2:#21384F;--raised:#284763;
  --line:#33526E;--line-soft:#27415A;--ink:#E9F0F6;--ink-2:#A9BED2;--ink-3:#6F889F;
  --steel:#7FB2D9;--steel-deep:#4E86B4;--gold:#C9A227;--gold-soft:#3a3320;
  --ok:#4FB286;--warn:#E0A458;--crit:#D96A6A;--na:#5B7088;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 28px rgba(0,0,0,.35);--r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 85% -10%, #1c3550 0%, transparent 60%),var(--canvas);
  color:var(--ink);font-family:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:inherit}
::selection{background:rgba(127,178,217,.28)}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1b2d41,#16263a);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.brand .mark{font-family:"IBM Plex Mono";font-weight:600;letter-spacing:.14em;font-size:12px;
  color:var(--canvas);background:var(--steel);padding:4px 8px;border-radius:5px}
.brand .ttl{font-weight:600;letter-spacing:.01em}
.brand .sub{color:var(--ink-3);font-size:12px}
.topright{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--ink-3);font-size:12.5px}
.period{display:flex;align-items:center;gap:7px}
.period b{color:var(--ink-2);font-weight:500}
.menutgl{display:none}
.body{display:grid;grid-template-columns:288px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 12px 40px}
.rail .grp{margin:16px 6px 7px;color:var(--ink-3);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.rail .grp:first-child{margin-top:2px}
.navitem{width:100%;text-align:left;appearance:none;border:0;background:transparent;color:var(--ink-2);
  font:inherit;cursor:pointer;border-radius:9px;padding:9px 11px;display:grid;grid-template-columns:1fr auto;gap:10px;
  align-items:center;transition:.13s;margin-bottom:2px}
.navitem:hover{background:#1f3450;color:var(--ink)}
.navitem.active{background:var(--panel-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--steel)}
.navitem .nm{display:flex;flex-direction:column;line-height:1.25}
.navitem .nm small{color:var(--ink-3);font-size:11px;font-weight:400}
.navitem.active .nm small{color:var(--ink-2)}
.navitem .cnt{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink-3);border:1px solid var(--line-soft);
  border-radius:5px;padding:2px 6px;white-space:nowrap}
.railnote{margin:18px 8px 0;padding:11px 12px;border:1px solid var(--line-soft);border-radius:9px;
  color:var(--ink-3);font-size:11.5px;line-height:1.45;background:#172838}
.railnote b{color:var(--ink-2);font-weight:600}
.main{overflow:auto;padding:26px 30px 90px;min-width:0}
.crumbs{color:var(--ink-3);font-size:12px;margin-bottom:14px;font-family:"IBM Plex Mono"}
.crumbs b{color:var(--ink-2);font-weight:500}
.bhead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:4px}
.bhead .lvl{font-family:"IBM Plex Mono";font-size:11px;color:var(--canvas);background:var(--ink-3);
  border-radius:5px;padding:3px 7px;margin-top:6px;letter-spacing:.08em}
.bhead h1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}
.bhead .one{color:var(--ink-2);max-width:66ch;font-size:13.5px}
.bmeta{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#172838;
  border-radius:8px;padding:7px 11px;font-size:12px;color:var(--ink-2)}
.chip .k{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}
.chip b{color:var(--ink);font-weight:500}
.sec{margin-top:26px}
.sec>h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 13px;
  display:flex;align-items:center;gap:10px}
.sec>h2::after{content:"";height:1px;flex:1;background:var(--line-soft)}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 14px 12px;
  position:relative;box-shadow:var(--shadow)}
.kpi .code{font-family:"IBM Plex Mono";font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.kpi .val{font-family:"IBM Plex Mono";font-size:26px;font-weight:500;margin-top:6px;letter-spacing:-.01em}
.kpi .nm{color:var(--ink-2);font-size:12px;margin-top:4px}
.kpi .strk{position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r);background:var(--steel-deep)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dcard{padding:15px 16px;position:relative;cursor:pointer;transition:.14s}
.dcard:hover{border-color:var(--line);transform:translateY(-1px)}
.dcard .strk{position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r)}
.dcard .dc{font-family:"IBM Plex Mono";font-size:11px;color:var(--steel);letter-spacing:.06em}
.dcard h3{margin:5px 0 3px;font-size:16px;font-weight:600}
.dcard .en{color:var(--ink-3);font-size:11.5px;margin-bottom:8px}
.dcard .pp{color:var(--ink-2);font-size:12.5px;line-height:1.45}
.dcard .brd{margin-top:9px;font-size:11px;color:var(--ink-3)}
.dcard .brd b{color:var(--steel);font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl th{color:var(--ink-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  position:sticky;top:0;background:#16273a;z-index:2;cursor:default}
.tbl td.mono{font-family:"IBM Plex Mono";color:var(--ink-2);white-space:nowrap}
.tbl tr:hover td{background:#17283a}
.tbl.click tr{cursor:pointer}
.tag{display:inline-block;font-family:"IBM Plex Mono";font-size:10px;padding:2px 6px;border-radius:5px;
  border:1px solid var(--line-soft);color:var(--ink-2);background:#1a2c3e;white-space:nowrap}
.tag.cr{color:var(--crit);border-color:#523035;background:rgba(217,106,106,.1)}
.tag.h{color:var(--warn);border-color:#4d3f26;background:rgba(224,164,88,.09)}
.tag.m{color:var(--steel);border-color:#26465f;background:#16314a}
.tag.l{color:var(--na);background:#1a2c3e}
.tag.must{color:var(--ok);border-color:#2c5345;background:rgba(79,178,134,.1)}
.tag.o{color:var(--steel);border-color:#26465f}
.tag.r{color:var(--ink-2)}
.tag.a{color:var(--gold);border-color:#5a4d20;background:var(--gold-soft)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{appearance:none;background:#14263a;border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:13px;padding:8px 11px;border-radius:8px}
.filters input{min-width:220px;flex:1}
.filters input::placeholder{color:var(--ink-3)}
.filters .rst{appearance:none;border:1px solid var(--line);background:#16273a;color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:8px 12px;border-radius:8px;cursor:pointer}
.filters .rst:hover{color:var(--ink)}
.tblwrap{border:1px solid var(--line-soft);border-radius:var(--r);overflow:auto;max-height:70vh}
.count{color:var(--ink-3);font-size:12px;margin:0 0 10px;font-family:"IBM Plex Mono"}
.count b{color:var(--ink-2)}
pre.tree{font-family:"IBM Plex Mono";font-size:12px;line-height:1.55;color:var(--ink-2);background:var(--panel);
  border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 18px;overflow:auto;white-space:pre}
pre.tree b{color:var(--steel);font-weight:500}
pre.tree .bk{color:var(--crit)}
.note-inline{color:var(--ink-3);font-size:12.5px;background:#16273a;border:1px solid var(--line-soft);
  border-radius:9px;padding:11px 14px;line-height:1.5}
.note-inline b{color:var(--ink-2)}
.note-inline.warn{border-color:#4d3f26;background:#20190f}
.roadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stage{padding:15px 16px}
.stage .st{font-family:"IBM Plex Mono";font-size:11px;color:var(--steel);letter-spacing:.06em}
.stage h3{margin:5px 0 6px;font-size:15px;font-weight:600}
.stage .rn{color:var(--ink-3);font-size:12px;line-height:1.45;margin-bottom:9px}
.stage .ct{font-family:"IBM Plex Mono";font-size:20px;color:var(--ink);font-weight:500}
.stage .ct small{font-size:11px;color:var(--ink-3);font-weight:400}
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.6);backdrop-filter:blur(2px);opacity:0;
  pointer-events:none;transition:.18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:.22s cubic-bezier(.4,0,.2,1);
  z-index:41;overflow:auto;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.drawer.on{transform:none}
.dwhead{padding:20px 22px 14px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;
  background:linear-gradient(180deg,#1d2f44,#1a2b3e)}
.dwhead .code{font-family:"IBM Plex Mono";font-size:11px;color:var(--ink-3)}
.dwhead h3{margin:5px 0 3px;font-size:18px;font-weight:600;max-width:34ch}
.dwhead .pp{color:var(--ink-3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px;
  display:flex;gap:6px;flex-wrap:wrap}
.dwx{position:absolute;top:16px;right:18px;appearance:none;border:1px solid var(--line);background:#16273a;
  color:var(--ink-2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.dwx:hover{color:var(--ink)}
.dwbody{padding:8px 22px 40px}
.field{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.field .fk{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.field .fv{color:var(--ink);font-size:13px;line-height:1.5}
.field .fv.mono{font-family:"IBM Plex Mono";font-size:12px;color:var(--ink-2)}
.footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line-soft);color:var(--ink-3);
  font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.footer .mono{color:var(--na)}
@media(max-width:820px){
  .body{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:57px;bottom:0;width:300px;z-index:25;transform:translateX(-105%);
    transition:.2s;box-shadow:20px 0 50px rgba(0,0,0,.4)}
  .rail.open{transform:none}
  .menutgl{display:inline-flex;align-items:center;gap:7px;appearance:none;border:1px solid var(--line);
    background:#16273a;color:var(--ink-2);font:inherit;font-size:13px;padding:7px 11px;border-radius:8px;cursor:pointer}
  .main{padding:20px 18px 70px}.bhead h1{font-size:21px}.topright{display:none}
}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

  <header class="topbar">
    <button class="menutgl" id="menutgl">☰ Разделы</button>
    <div class="brand">
      <span class="mark">DMS</span>

      <div class="period">снимок <b>12.07.2026</b></div>
      <div class="period">канон <b>docs/dms/</b></div>
    </div>
  </header>
  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

var CLASSES=[

  ["RPT","Отчёт","Report","Снимок данных за период; статичен на момент выпуска.","Тактический"],

  t2.appendChild(tb2);s2.appendChild(t2);m.appendChild(s2);
