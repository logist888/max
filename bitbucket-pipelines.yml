# Сборка и деплой vuz-navigator.ru на FTP.
#
# ВНИМАНИЕ ПРО МИНУТЫ. На бесплатном тарифе Bitbucket даёт 50 минут сборки в месяц.
# Один полный деплой — это сборка (~2 мин) плюс заливка 10 235 файлов по FTP
# (15–30 мин). То есть бесплатного тарифа хватает примерно на один-два деплоя.
# Поэтому автозапуск по push здесь НАМЕРЕННО выключен: все пайплайны ручные.
# Основной способ обновлять прод — scripts/deploy-ftp.sh с din-server: он не тратит
# минут вообще. Пайплайны ниже — на случай, когда удобнее нажать кнопку.
#
# Настройка: Repository settings → Repository variables
#   FTP_SERVER       31.31.197.39
#   FTP_USERNAME     u3591005
#   FTP_PASSWORD     новый пароль        ← отметить галочкой Secured
#   FTP_REMOTE_DIR   корень сайта (даст пайплайн discover)
#   SITE_URL         https://vuz-navigator.ru
#   FTP_DELETE_STALE false               ← true только после успешного dry-run

image: node:22

definitions:
  steps:
    - step: &build-and-deploy
        name: Сборка и синхронизация на FTP
        size: 2x
        caches:
          - node
        script:
          - apt-get update -qq && apt-get install -y -qq lftp curl
          - |
            set -eu
            : "${FTP_SERVER:?не задана переменная FTP_SERVER}"
            : "${FTP_USERNAME:?не задана переменная FTP_USERNAME}"
            : "${FTP_PASSWORD:?не задана переменная FTP_PASSWORD}"
            : "${FTP_REMOTE_DIR:?не задана FTP_REMOTE_DIR (запустите пайплайн discover)}"
            SITE_URL="${SITE_URL:-https://vuz-navigator.ru}"
            MODE="${MODE:-dry-run}"
            echo "Режим: $MODE | сайт: $SITE_URL"

            cd seo-platform/app
            npm ci
            npm run pipeline && npm run graph
            SITE_URL="$SITE_URL" npm run build

            # Предохранители: битая сборка на прод не уедет.
            pages=$(find dist -name '*.html' | wc -l)
            [ "$pages" -ge 9000 ] || { echo "ОШИБКА: только $pages страниц, ожидалось >9000"; exit 1; }
            for f in dist/index.html dist/404.html dist/sitemap-index.xml; do
              [ -s "$f" ] || { echo "ОШИБКА: нет или пуст $f"; exit 1; }
            done
            grep -q "canonical\" href=\"$SITE_URL" dist/index.html \
              || { echo "ОШИБКА: canonical не указывает на $SITE_URL"; exit 1; }
            echo "Проверки пройдены: $pages страниц, $(du -sh dist | cut -f1)"

            FLAGS="--reverse --continue --parallel=5 --verbose=1"
            [ "${FORCE_FULL:-false}" = "true" ] || FLAGS="$FLAGS --ignore-time"
            [ "${FTP_DELETE_STALE:-false}" = "true" ] && FLAGS="$FLAGS --delete"
            [ "$MODE" = "dry-run" ] && FLAGS="$FLAGS --dry-run"
            echo "Флаги mirror: $FLAGS"

            export LFTP_PASSWORD="$FTP_PASSWORD"
            lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" <<LFTP
            set ftp:passive-mode on
            set ftp:ssl-allow true
            set ssl:verify-certificate no
            set net:timeout 20
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set mirror:parallel-transfer-count 5
            set xfer:log no
            mirror $FLAGS dist/ "$FTP_REMOTE_DIR"
            bye
            LFTP

            if [ "$MODE" = "deploy" ]; then
              fail=0
              for p in / /vuzy/ /gorod/moskva/ /professiya/ /specialnosti/ /sitemap-index.xml; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 "$SITE_URL$p" || echo 000)
                echo "$code  $p"
                [ "$code" = "200" ] || fail=1
              done
              [ "$fail" = 0 ] || { echo "ОШИБКА: часть страниц не отвечает 200"; exit 1; }
              echo "Прод отвечает."
            fi

pipelines:
  custom:
    # 1. Узнать корень сайта на сервере. Ничего не меняет, тратит секунды.
    discover-ftp:
      - step:
          name: Показать структуру FTP
          script:
            - apt-get update -qq && apt-get install -y -qq lftp
            - |
              set -eu
              : "${FTP_SERVER:?}"; : "${FTP_USERNAME:?}"; : "${FTP_PASSWORD:?}"
              export LFTP_PASSWORD="$FTP_PASSWORD"
              lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" <<'LFTP'
              set ftp:passive-mode on
              set ftp:ssl-allow true
              set ssl:verify-certificate no
              set cmd:fail-exit no
              echo "=== корень ==="
              ls
              echo "=== типовые каталоги сайта ==="
              ls www
              ls public_html
              ls data
              ls www/vuz-navigator.ru
              ls data/www/vuz-navigator.ru
              bye
              LFTP
              echo "Найденный путь впишите в переменную FTP_REMOTE_DIR."

    # 2. Пробный прогон: собирает и показывает, что было бы залито.
    dry-run:
      - variables:
          - name: MODE
            default: dry-run
          - name: FORCE_FULL
            default: "false"
      - step: *build-and-deploy

    # 3. Реальная заливка.
    deploy:
      - variables:
          - name: MODE
            default: deploy
          - name: FORCE_FULL
            default: "false"
            allowed-values: ["false", "true"]
      - step: *build-and-deploy

  # Автозапуск по push намеренно закомментирован — экономит минуты сборки.
  # Снять комментарий, если минут хватает:
  # branches:
  #   main:
  #     - step:
  #         <<: *build-and-deploy
