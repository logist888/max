states:
  - id: J01
    label: Определить цель и попробовать
    questions: [Q01, Q02, Q19, Q21]
    result: Цель, ограничения и следующий проверяемый шаг.
    choice: Если цель известна, открыть поиск или известный набор напрямую.
  - id: J02
    label: Найти варианты
    questions: [Q02, Q03, Q04, Q05, Q06, Q08, Q21]
    result: Короткий список конкретных вариантов и наборов со ссылками.
    choice: Нет подходящего набора — изменить ограничения, подписаться на обновление либо завершить поиск.
  - id: J03
    label: Сравнить условия и бюджет
    questions: [Q04, Q07, Q08, Q09, Q13, Q14, Q15, Q18]
    result: Сопоставимая смета, применимые критерии и неизвестные по вариантам.
    choice: Нет бюджета — проверить финансирование. При недостающих сведениях открыть источник или запросить уточнение.
  - id: J04
    label: Подготовиться и проверить допуск
    questions: [Q05, Q08, Q09, Q13, Q15, Q20, Q10, Q21]
    result: Выполненные условия допуска, подготовка и полученные результаты оценивания.
    choice: При соблюдении условий перейти к заявке. Если неприменимы правила выбранного набора, найти другой.
  - id: J05
    label: Подать и отследить
    questions: [Q11, Q05, Q13, Q15, Q21]
    result: Проверенный комплект и статус подачи от принимающей стороны.
    choice: При недостающем документе вернуться к подготовке. Отправка подтверждается официальным каналом.
  - id: J06
    label: Разобрать решение и зачислиться
    questions: [Q12, Q14, Q15, Q16, Q18]
    result: Условия оффера, выбранное действие пользователя и отдельное подтверждение зачисления.
    choice: Отказ или истечение срока возвращает к поиску. Условный оффер возвращает к выполнению условий.
  - id: J07
    label: Организовать мобильность и быт
    questions: [Q13, Q14, Q15, Q16, Q18]
    result: Готовность к переезду и доступ к бытовой поддержке.
    choice: Порядок отдельных действий зависит от официальных требований. Для местного и дистанционного обучения шаг можно пропустить.
  - id: J08
    label: Учиться и применять
    questions: [Q17, Q18, Q19, Q20, Q21]
    result: Прогресс, доступ к поддержке и план учебных или карьерных действий.
    choice: При препятствиях открыть нужную помощь. При несовпадении цели оценить переход.
  - id: J09
    label: Завершить, сменить или выйти в профессию
    questions: [Q22, Q13, Q17, Q19, Q01]
    result: Подтверждённый переход, квалификация или новая цель.
    choice: Новая цель запускает параллельный маршрут с сохранением уже полученных результатов.
transitions:
  - {from: J01, to: J02, condition: Цель и ограничения сформулированы}
  - {from: J02, to: J03, condition: Выбран конкретный набор или список}
  - {from: J03, to: J04, condition: Требуется подготовка}
  - {from: J03, to: J05, condition: Применимые условия выполнены}
  - {from: J04, to: J05, condition: Есть подтверждённые результаты и комплект}
  - {from: J05, to: J06, condition: Получено решение принимающей стороны}
  - {from: J06, to: J07, condition: Нужны переезд и бытовая поддержка}
  - {from: J06, to: J08, condition: Подтверждено зачисление и переезд не требуется}
  - {from: J07, to: J08, condition: Подтверждено участие и выполнены применимые условия}
  - {from: J08, to: J09, condition: Завершение или решение сменить маршрут}
  - {from: J03, to: J02, condition: Ограничение нельзя устранить для данного набора}
  - {from: J05, to: J04, condition: Нужны повторная проверка или недостающий документ}
  - {from: J06, to: J04, condition: Нужно исполнить условия оффера}
  - {from: J06, to: J02, condition: Отказ, отозванный или просроченный оффер}
  - {from: J07, to: J04, condition: Выявлено невыполненное применимое условие}
  - {from: J09, to: J01, condition: Появилась новая образовательная цель}
regions:
  - id: RU
    title: Россия / Москва
    locale: ru
    pathway: Подача в вуз и выбор конкурсной группы
    state: J05
    service: P11
    provider: Приёмная комиссия УУНиТ о Госуслугах
    official: https://uust.ru/admission/about-superservice/
    decision: Проверить тип программы, кампанию и доступный способ подачи по выбранному вузу.
    free: Карточка набора, сроки, применимые каналы и ссылка в официальный сервис.
    gate: Смысл платной проверки появляется при нескольких конкурсных группах или несогласованном комплекте.
  - id: GB
    title: Великобритания
    locale: en
    pathway: Бакалавриат с международной квалификацией
    state: J03
    service: P09
    provider: UCAS
    official: https://www.ucas.com/international/international-students/applying-to-university-as-an-international-student/entry-requirements-for-uk-courses
    decision: Сопоставить требования конкретного курса и применимость маршрута UCAS.
    free: Требования из источника, известные критерии и отметки о недостающих сведениях.
    gate: Если сопоставление иностранной квалификации осталось неясным, предложить проверку человеком с трассировкой оснований.
  - id: US
    title: США
    locale: en
    pathway: Проверка авторского эссе в комплекте заявки
    state: J05
    service: P23
    provider: EducationUSA
    official: https://educationusa.state.gov/your-5-steps-us-study/complete-your-application
    decision: Уточнить тему, лимит и требования принимающей стороны для конкретной заявки.
    free: Самопроверка авторского черновика по критериям программы.
    gate: Платный письменный разбор доступен при готовом черновике и понятных сроках. Человек сохраняет авторство.
    benchmark: https://www.princetonreview.com/college-admissions/essay-application-review
    benchmark_name: Платный разбор Princeton Review
  - id: CA
    title: Канада
    locale: en
    pathway: Поиск программы на английском или французском
    state: J02
    service: P06
    provider: EduCanada
    official: https://www.educanada.ca/programs-programmes/index.aspx?lang=eng
    decision: Выбрать языки и сравнивать программы по одной ступени и режиму обучения.
    free: Фильтры и прямые ссылки на сопоставимые предложения и стоимость из источника.
    gate: Персональный подбор уместен при нескольких ограничениях и проверяемой разнице по каждому варианту.
  - id: CH
    title: Швейцария
    locale: de
    pathway: Проверка официального статуса учреждения
    state: J03
    service: P08
    provider: swissuniversities
    official: https://www.swissuniversities.ch/en/topics/studying/accredited-swiss-higher-education-institutions
    decision: Сверить юридическое наименование и применимость списка к конкретному объекту.
    free: Прямая ссылка на перечень с датой просмотра и ясным предметом проверки.
    gate: Платное досье уместно при требовании сверить несколько организаций, уровней или версий сведений.
  - id: FR
    title: Франция
    locale: fr
    pathway: Выбор применимой процедуры подачи
    state: J05
    service: P11
    provider: Service Public
    official: https://www.service-public.gouv.fr/particuliers/vosdroits/R68205
    decision: Уточнить страну проживания, программу и применимость процедуры Études en France.
    free: Проверка применимости по странице органа и отдельная ссылка на выбранный канал.
    gate: Предложить проверку комплекта, если применимая процедура известна и пользователь видит состав результата.
  - id: IT
    title: Италия
    locale: it
    pathway: Предзачисление при международном поступлении
    state: J05
    service: P11
    provider: Universitaly
    official: https://www.universitaly.it/en/first-steps
    decision: Определить, применим ли этап предзачисления и какие документы просит выбранное учреждение.
    free: Пошаговый список с отдельными подтверждениями подачи, ответа учреждения и следующего процесса.
    gate: Платёж за аудит пакета возможен после выбора программы и маршрута.
  - id: ES
    title: Испания
    locale: es
    pathway: Иностранная квалификация и требования вуза
    state: J03
    service: P13
    provider: UNEDasiss
    official: https://unedasiss.uned.es/informacionuniversidad
    decision: Определить, какие процедуры применимы к квалификации и выбранному университету.
    free: Ссылки на требования вуза и UNEDasiss, критерии сопоставления.
    gate: Работа с комплектом допустима после проверки применимости. Сбор органа проходит отдельно.
  - id: AE
    title: ОАЭ
    locale: ar
    pathway: Проверка статуса выбранной программы
    state: J03
    service: P08
    provider: Commission for Academic Accreditation
    official: https://caa.ae/Pages/Programs/All.aspx
    decision: Сверить точное наименование программы, учреждение, уровень и статус в применимом реестре.
    free: Официальная карточка либо документированный пробел по совпадению.
    gate: При несогласованных реестрах предложить проверку с перечнем источников и ручной верификацией.
  - id: SG
    title: Сингапур
    locale: en
    pathway: Подбор послешкольного маршрута
    state: J03
    service: P09
    provider: Ministry of Education
    official: https://www.moe.gov.sg/-/media/files/post-secondary/a-guide-to-post-secondary-admissions-exercises.pdf
    decision: Уточнить тип маршрута, программу и основания допуска к соответствующей процедуре приёма.
    free: Справочник вариантов и ссылка на инструкцию MOE по подходящей процедуре.
    gate: Платная персональная проверка имеет смысл при выборе нескольких различных маршрутов.
  - id: HK
    title: Гонконг
    locale: zh-Hant
    pathway: Подача через JUPAS при соблюдении условий
    state: J05
    service: P11
    provider: JUPAS
    official: https://www.jupas.edu.hk/en/about-jupas/
    decision: Проверить, относится ли заявитель и выбранная программа к применимому маршруту.
    free: Навигатор применимости, ссылка в JUPAS и отдельный маршрут проверки прямой подачи.
    gate: Предложить аудит документов после выбора канала, если задача осталась открытой.
  - id: CN
    title: Китай
    locale: zh-Hans
    pathway: Подготовка заявки на стипендию CSC
    state: J03
    service: P24
    provider: Посольство КНР
    official: https://tt.china-embassy.gov.cn/eng/sgxw/202611/t20261106_12054369.htm
    decision: Уточнить канал и условия стипендии для конкретной категории заявителя.
    free: Официальные материалы по соответствующей кампании и персональный список вопросов.
    gate: Аудит пакета рассматривается отдельно от официальной заявки. Кейсы различаются по стране и кампании.
  - id: DE
    title: Германия
    locale: de
    pathway: Подача с иностранным документом об образовании
    state: J05
    service: P11
    provider: uni-assist
    official: https://www.uni-assist.de/en/how-to-apply
    decision: Проверить на сайте учреждения, какую часть конкретного процесса ведёт uni-assist.
    free: Ссылка на применимый канал, список материалов и правило проверки реквизитов у официальной стороны.
    gate: Внешний сбор за официальный процесс отделён от независимой проверки комплекта.
  - id: AU
    title: Австралия
    locale: en
    pathway: Сравнение программ в каталоге и проверка регистрационного статуса
    state: J02
    service: P06
    provider: Study Australia
    official: https://www.studyaustralia.gov.au/en/plan-your-studies/find-a-course
    decision: Найти курс в актуальном перечне и сверить условия на сайте учреждения.
    free: Карточки сопоставимых программ с источником, датой и ссылкой к поставщику.
    gate: Платный подбор уместен после исчерпания бесплатных фильтров или при сложных ограничениях.
