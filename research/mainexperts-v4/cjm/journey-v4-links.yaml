states:
- id: J01
  label: Определить цель и попробовать
  questions:
  - Q01
  - Q02
  - Q19
  - Q21
  result: Цель, ограничения и следующий проверяемый шаг.
  choice: Если цель известна, открыть поиск или известный набор напрямую.
- id: J02
  label: Найти варианты
  questions:
  - Q02
  - Q03
  - Q04
  - Q05
  - Q06
  - Q08
  - Q21
  result: Короткий список конкретных вариантов и наборов со ссылками.
  choice: Нет подходящего набора — изменить ограничения, подписаться на обновление либо завершить поиск.
- id: J03
  label: Сравнить условия и бюджет
  questions:
  - Q04
  - Q07
  - Q08
  - Q09
  - Q13
  - Q14
  - Q15
  - Q18
  result: Сопоставимая смета, применимые критерии и неизвестные по вариантам.
  choice: Нет бюджета — проверить финансирование. При недостающих сведениях открыть источник или запросить уточнение.
- id: J04
  label: Подготовиться и проверить допуск
  questions:
  - Q05
  - Q08
  - Q09
  - Q13
  - Q15
  - Q20
  - Q10
  - Q21
  result: Выполненные условия допуска, подготовка и полученные результаты оценивания.
  choice: При соблюдении условий перейти к заявке. Если неприменимы правила выбранного набора, найти другой.
- id: J05
  label: Подать и отследить
  questions:
  - Q11
  - Q05
  - Q13
  - Q15
  - Q21
  result: Проверенный комплект и статус подачи от принимающей стороны.
  choice: При недостающем документе вернуться к подготовке. Отправка подтверждается официальным каналом.
- id: J06
  label: Разобрать решение и зачислиться
  questions:
  - Q12
  - Q14
  - Q15
  - Q16
  - Q18
  result: Условия оффера, выбранное действие пользователя и отдельное подтверждение зачисления.
  choice: Отказ или истечение срока возвращает к поиску. Условный оффер возвращает к выполнению условий.
- id: J07
  label: Организовать мобильность и быт
  questions:
  - Q13
  - Q14
  - Q15
  - Q16
  - Q18
  result: Готовность к переезду и доступ к бытовой поддержке.
  choice: Порядок отдельных действий зависит от официальных требований. Для местного и дистанционного обучения шаг
    можно пропустить.
- id: J08
  label: Учиться и применять
  questions:
  - Q17
  - Q18
  - Q19
  - Q20
  - Q21
  result: Прогресс, доступ к поддержке и план учебных или карьерных действий.
  choice: При препятствиях открыть нужную помощь. При несовпадении цели оценить переход.
- id: J09
  label: Завершить, сменить или выйти в профессию
  questions:
  - Q22
  - Q13
  - Q17
  - Q19
  - Q01
  result: Подтверждённый переход, квалификация или новая цель.
  choice: Новая цель запускает параллельный маршрут с сохранением уже полученных результатов.
