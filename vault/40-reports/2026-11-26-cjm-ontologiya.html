a"/><text x="11547" y="4549.2" font-size="12.5" font-weight="400" fill="#222222">Австралия. Ловушка:</text><text x="11547" y="4565.7" font-size="12.5" font-weight="400" fill="#222222">ATAR равен selection</text><text x="11547" y="4582.2" font-size="12.5" font-weight="400" fill="#222222">rank для любой</text><text x="11547" y="4598.7" font-size="12.5" font-weight="400" fill="#222222">программы, а offer или</text><text x="11547" y="4615.2" font-size="12.5" font-weight="400" fill="#222222">CoE автоматически</text><text x="11547" y="4631.7" font-size="12.5" font-weight="400" fill="#222222">означает выдачу визы.</text></g><g transform="rotate(0.2 10120 4585.9)"><rect x="10032" y="4529.4" width="176" height="117" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="10032" y="4527.4" width="176" height="117" rx="2" fill="#f59a9a"/><text x="10042" y="4549.2" font-size="12.5" font-weight="400" fill="#222222">Ошибка, которую</text><text x="10042" y="4565.7" font-size="12.5" font-weight="400" fill="#222222">выявляет проверка:</text><text x="10042" y="4582.2" font-size="12.5" font-weight="400" fill="#222222">Создание факта о цене</text><text x="10042" y="4598.7" font-size="12.5" font-weight="400" fill="#222222">из фразы, цифры</text><text x="10042" y="4615.2" font-size="12.5" font-weight="400" fill="#222222">трафика или даты</text><text x="10042" y="4631.7" font-size="12.5" font-weight="400" fill="#222222">выгрузки. HK, §3, AU, §3.</text></g><g transform="rotate(0.5 9045 4585.9)"><rect x="8957" y="4529.4" width="176" height="117" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="8957" y="4527.4" width="176" height="117" rx="2" fill="#f59a9a"/><text x="8967" y="4549.2" font-size="12.5" font-weight="400" fill="#222222">Ошибка, которую</text><text x="8967" y="4565.7" font-size="12.5" font-weight="400" fill="#222222">выявляет проверка:</text><text x="8967" y="4582.2" font-size="12.5" font-weight="400" fill="#222222">Вывод о зачислении или</text><text x="8967" y="4598.7" font-size= 400" fill="#222222">передано →</text><text x="11547" y="5065.7" font-size="12.5" font-weight="400" fill="#222222">рассматривается →</text><text x="11547" y="5082.2" font-size="12.5" font-weight="400" fill="#222222">одобрено или отклонено</text><text x="11547" y="5098.7" font-size="12.5" font-weight="400" fill="#222222">→ действует → истекло</text><text x="11547" y="5115.2" font-size="12.5" font-weight="400" fill="#222222">или прекращено.</text><text x="11547" y="5131.7" font-size="12.5" font-weight="400" fill="#222222">Запускают: решение</text><text x="11547" y="5148.2" font-size="12.5" font-weight="400" fill="#222222">органа, начало</text><text x="11547" y="5164.7" font-size="12.5" font-weight="400" fill="#222222">действия, отзыв,</text><text x="11547" y="5181.2" font-size="12.5" font-weight="400" fill="#222222">истечение или переход</text><text x="11547" y="5197.7" font-size="12.5" font-weight="400" fill="#222222">на новый статус.</text></g><g transform="rotate(0.2 5605 5085.9)"><rect x="5517" y="5012.9" width="176" height="150" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="5517" y="5010.9" width="176" height="150" rx="2" fill="#ffffff"/><text x="5527" y="5032.7" font-size="12.5" font-weight="400" fill="#222222">Регуляторный статус.</text><text x="5527" y="5049.2" font-size="12.5" font-weight="400" fill="#222222">Заявлен → подтверждён</text><text x="5527" y="5065.7" font-size="12.5" font-weight="400" fill="#222222">→ действует →</text><text x="5527" y="5082.2" font-size="12.5" font-weight="400" fill="#222222">приостановлен, истёк</text><text x="5527" y="5098.7" font-size="12.5" font-weight="400" fill="#222222">или отозван. Запускают:</text><text x="5527" y="5115.2" font-size="12.5" font-weight="400" fill="#222222">решение или запись</text><text x="5527" y="5131.7" font-size="12.5" font-weight="400" fill="#222222">компетентной стороны и</text><text x="5527" y="5148.2" font-size="12.5" font-weight="400" fill="#222222">изменения в схеме.</text></g><g transform="rotate(0.7 9475 5094.2)"><rect x="9387" y="5012.9" width="176" height="166.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="9387" y="5010.9" width="176" height="166.5" rx="2" fill="#ffffff"/><text x="9397" y="5032.7" font-size="12.5" font-weight="400" fill="#222222">Квалификация и</text><text x="9397" y="5049.2" font-size="12.5" font-weight="400" fill="#222222">документ. Требования</text><text x="9397" y="5065.7" font-size="12.5" font-weight="400" fill="#222222">завершены →</text><text x="9397" y="5082.2" font-size="12.5" font-weight="400" fill="#222222">квалификация</text><text x="9397" y="5098.7" font-size="12.5" font-weight="400" fill="#222222">присуждена → документ</text><text x="9397" y="5115.2" font-size="12.5" font-weight="400" fill="#222222">выпущен. Три отдельных</text><text x="9397" y="5131.7" font-size="12.5" font-weight="400" fill="#222222">факта; документ может</text><text x="9397" y="5148.2" font-size="12.5" font-weight="400" fill="#222222">переиздаваться после</text><text x="9397" y="5164.7" font-size="12.5" font-weight="400" fill="#222222">выпуска.</text></g><g transform="rotate(1 8400 5085.9)"><rect x="8312" y="5012.9" width="176" height="150" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="8312" y="5010.9" width="176" height="150" rx="2" fill="#ffffff"/><text x="8322" y="5032.7" font-size="12.5" font-weight="400" fill="#222222">Заявка. Отправка</text><text x="8322" y="5049.2" font-size="12.5" font-weight="400" fill="#222222">заявки, получение</text><text x="8322" y="5065.7" font-size="12.5" font-weight="400" fill="#222222">оператором и решение</text><text x="8322" y="5082.2" font-size="12.5" font-weight="400" fill="#222222">представлены</text><text x="8322" y="5098.7" font-size="12.5" font-weight="400" fill="#222222">отдельными событиями.</text><text x="8322" y="5115.2" font-size="12.5" font-weight="400" fill="#222222">Статус заявки хранится</text><text x="8322" y="5131.7" font-size="12.5" font-weight="400" fill="#222222">как состояние на дату</text><text x="8322" y="5148.2" font-size="12.5" font-weight="400" fill="#222222">(глава 4).</text></g><g transform="rotate(-0.8 8830 5102.4)"><rect x="8742" y="5012.9" width="176" height="183" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="8742" y="5010.9" width="176" height="183" rx="2" fill="#ffffff"/><text x="8752" y="5032.7" font-size="12.5" font-weight="400" fill="#222222">Предложение и</text><text x="8752" y="5049.2" font-size="12.5" font-weight="400" fill="#222222">зачисление. Из оффера</text><text x="8752" y="5065.7" font-size="12.5" font-weight="400" fill="#222222">нельзя вывести дату</text><text x="8752" y="5082.2" font-size="12.5" font-weight="400" fill="#222222">зачисления, факт оплаты</text><text x="8752" y="5098.7" font-size="12.5" font-weight="400" fill="#222222">или начало обучения:</text><text x="8752" y="5115.2" font-size="12.5" font-weight="400" fill="#222222">каждое утверждение</text><text x="8752" y="5131.7" font-size="12.5" font-weight="400" fill="#222222">строится по</text><text x="8752" y="5148.2" font-size="12.5" font-weight="400" fill="#222222">собственному событию</text><text x="8752" y="5164.7" font-size="12.5" font-weight="400" fill="#222222">и доказательству (глава</text><text x="8752" y="5181.2" font-size="12.5" font-weight="400" fill="#222222">6).</text></g><g transform="rotate(-1.1 6250 5168.4)"><rect x="6162" y="5012.9" width="176" height="315" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="6162" y="5010.9" width="176" height="315" rx="2" fill="#ffffff"/><text x="6172" y="5032.7" font-size="12.5" font-weight="400" fill="#222222">Допуск. Сначала</text><text x="6172" y="5049.2" font-size="12.5" font-weight="400" fill="#222222">находят действующее</text><text x="6172" y="5065.7" font-size="12.5" font-weight="400" fill="#222222">правило для области и</text><text x="6172" y="5082.2" font-size="12.5" font-weight="400" fill="#222222">категории, затем</text><text x="6172" y="5098.7" font-size="12.5" font-weight="400" fill="#222222">проверяют критерии на</text><text x="6172" y="5115.2" font-size="12.5" font-weight="400" fill="#222222">подтверждённых данных</text><text x="6172" y="5131.7" font-size="12.5" font-weight="400" fill="#222222">человека. Один</text><text x="6172" y="5148.2" font-size="12.5" font-weight="400" fill="#222222">отрицательный</text><text x="6172" y="5164.7" font-size="12.5" font-weight="400" fill="#222222">результат при «И» даёт</text><text x="6172" y="5181.2" font-size="12.5" font-weight="400" fill="#222222">«нет»; при отсутствии</text><text x="6172" y="5197.7" font-size="12.5" font-weight="400" fill="#222222">отрицаний и наличии</text><text x="6172" y="5214.2" font-size="12.5" font-weight="400" fill="#222222">неизвестного итог</text><text x="6172" y="5230.7" font-size="12.5" font-weight="400" fill="#222222">остаётся неизвестным.</text><text x="6172" y="5247.2" font-size="12.5" font-weight="400" fill="#222222">Допустимый путь</text><text x="6172" y="5263.7" font-size="12.5" font-weight="400" fill="#222222">означает право</text><text x="6172" y="5280.2" font-size="12.5" font-weight="400" fill="#222222">участвовать в</text><text x="6172" y="5296.7" font-size="12.5" font-weight="400" fill="#222222">процедуре, а не</text><text x="6172" y="5313.2" font-size="12.5" font-weight="400" fill="#222222">результат (глава 6).</text></g><g transform="rotate(-0.4 3670 5430.9)"><rect x="3582" y="5357.9" width="176" height="150" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="3582" y="5355.9" width="176" height="150" rx="2" fill="#ffffff"/><text x="3592" y="5377.7" font-size="12.5" font-weight="400" fill="#222222">Поиск обучения.</text><text x="3592" y="5394.2" font-size="12.5" font-weight="400" fill="#222222">Основной объект</text><text x="3592" y="5410.7" font-size="12.5" font-weight="400" fill="#222222">выдачи: Реализация,</text><text x="3592" y="5427.2" font-size="12.5" font-weight="400" fill="#222222">набор или занятие.</text><text x="3592" y="5443.7" font-size="12.5" font-weight="400" fill="#222222">Данные для ответа:</text><text x="3592" y="5460.2" font-size="12.5" font-weight="400" fill="#222222">Нормализованные</text><text x="3592" y="5476.7" font-size="12.5" font-weight="400" fill="#222222">фасеты, календарь и</text><text x="3592" y="5493.2" font-size="12.5" font-weight="400" fill="#222222">статус доступности.</text></g><g transform="rotate(1 2380 5439.2)"><rect x="2292" y="5357.9" width="176" height="166.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="2292" y="5355.9" width="176" height="166.5" rx="2" fill="#ffffff"/><text x="2302" y="5377.7" font-size="12.5" font-weight="400" fill="#222222">Карточка программы.</text><text x="2302" y="5394.2" font-size="12.5" font-weight="400" fill="#222222">Основной объект</text><text x="2302" y="5410.7" font-size="12.5" font-weight="400" fill="#222222">выдачи: Программа с</text><text x="2302" y="5427.2" font-size="12.5" font-weight="400" fill="#222222">реализациями. Данные</text><text x="2302" y="5443.7" font-size="12.5" font-weight="400" fill="#222222">для ответа: Учебный</text><text x="2302" y="5460.2" font-size="12.5" font-weight="400" fill="#222222">план, квалификация,</text><text x="2302" y="5476.7" font-size="12.5" font-weight="400" fill="#222222">ответственные</text><text x="2302" y="5493.2" font-size="12.5" font-weight="400" fill="#222222">участники и конкретные</text><text x="2302" y="5509.7" font-size="12.5" font-weight="400" fill="#222222">предложения.</text></g><g transform="rotate(-0.8 10335 5439.2)"><rect x="10247" y="5357.9" width="176" height="166.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="10247" y="5355.9" width="176" height="166.5" rx="2" fill="#ffffff"/><text x="10257" y="5377.7" font-size="12.5" font-weight="400" fill="#222222">Калькулятор бюджета.</text><text x="10257" y="5394.2" font-size="12.5" font-weight="400" fill="#222222">Основной объект</text><text x="10257" y="5410.7" font-size="12.5" font-weight="400" fill="#222222">выдачи: Статьи</text><text x="10257" y="5427.2" font-size="12.5" font-weight="400" fill="#222222">маршрута. Данные для</text><text x="10257" y="5443.7" font-size="12.5" font-weight="400" fill="#222222">ответа: Базис</text><text x="10257" y="5460.2" font-size="12.5" font-weight="400" fill="#222222">начислений, дата и</text><text x="10257" y="5476.7" font-size="12.5" font-weight="400" fill="#222222">валюта, покрытие,</text><text x="10257" y="5493.2" font-size="12.5" font-weight="400" fill="#222222">обязательные и</text><text x="10257" y="5509.7" font-size="12.5" font-weight="400" fill="#222222">оценочные расходы.</text></g><g transform="rotate(-1.1 6250 5439.2)"><rect x="6162" y="5357.9" width="176" height="166.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="6162" y="5355.9" width="176" height="166.5" rx="2" fill="#ffffff"/><text x="6172" y="5377.7" font-size="12.5" font-weight="400" fill="#222222">Проверка допуска.</text><text x="6172" y="5394.2" font-size="12.5" font-weight="400" fill="#222222">Основной объект</text><text x="6172" y="5410.7" font-size="12.5" font-weight="400" fill="#222222">выдачи: Результаты</text><text x="6172" y="5427.2" font-size="12.5" font-weight="400" fill="#222222">критериев для набора.</text><text x="6172" y="5443.7" font-size="12.5" font-weight="400" fill="#222222">Данные для ответа:</text><text x="6172" y="5460.2" font-size="12.5" font-weight="400" fill="#222222">Правила, категория,</text><text x="6172" y="5476.7" font-size="12.5" font-weight="400" fill="#222222">цикл, документы,</text><text x="6172" y="5493.2" font-size="12.5" font-weight="400" fill="#222222">экзамены и</text><text x="6172" y="5509.7" font-size="12.5" font-weight="400" fill="#222222">альтернативные пути.</text></g><g transform="rotate(1 8400 5439.2)"><rect x="8312" y="5357.9" width="176" height="166.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="8312" y="5355.9" width="176" height="166.5" rx="2" fill="#ffffff"/><text x="8322" y="5377.7" font-size="12.5" font-weight="400" fill="#222222">Порядок поступления.</text><text x="8322" y="5394.2" font-size="12.5" font-weight="400" fill="#222222">Основной объект</text><text x="8322" y="5410.7" font-size="12.5" font-weight="400" fill="#222222">выдачи:</text><text x="8322" y="5427.2" font-size="12.5" font-weight="400" fill="#222222">Индивидуальное дело и</text><text x="8322" y="5443.7" font-size="12.5" font-weight="400" fill="#222222">варианты. Данные для</text><text x="8322" y="5460.2" font-size="12.5" font-weight="400" fill="#222222">ответа: Канал,</text><text x="8322" y="5476.7" font-size="12.5" font-weight="400" fill="#222222">документы, срок,</text><text x="8322" y="5493.2" font-size="12.5" font-weight="400" fill="#222222">событие передачи,</text><text x="8322" y="5509.7" font-size="12.5" font-weight="400" fill="#222222">решение и оформление.</text></g><g transform="rotate(1 11410 5455.7)"><rect x="11322" y="5357.9" width="176" height="199.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="11322" y="5355.9" width="176" height="199.5" rx="2" fill="#ffffff"/><text x="11332" y="5377.7" font-size="12.5" font-weight="400" fill="#222222">Международный</text><text x="11332" y="5394.2" font-size="12.5" font-weight="400" fill="#222222">маршрут. Основной</text><text x="11332" y="5410.7" font-size="12.5" font-weight="400" fill="#222222">объект выдачи: Серия</text><text x="11332" y="5427.2" font-size="12.5" font-weight="400" fill="#222222">проверок по двум и</text><text x="11332" y="5443.7" font-size="12.5" font-weight="400" fill="#222222">более областям. Данные</text><text x="11332" y="5460.2" font-size="12.5" font-weight="400" fill="#222222">для ответа: Исходный</text><text x="11332" y="5476.7" font-size="12.5" font-weight="400" fill="#222222">документ, требуемое</text><text x="11332" y="5493.2" font-size="12.5" font-weight="400" fill="#222222">признание, целевое</text><text x="11332" y="5509.7" font-size="12.5" font-weight="400" fill="#222222">предложение и</text><text x="11332" y="5526.2" font-size="12.5  y="6013.2" font-size="12.5" font-weight="400" fill="#222222">на место, но свободных</text><text x="6387" y="6029.7" font-size="12.5" font-weight="400" fill="#222222">мест нет. Ожидается:</text><text x="6387" y="6046.2" font-size="12.5" font-weight="400" fill="#222222">Правовое условие и</text><text x="6387" y="6062.7" font-size="12.5" font-weight="400" fill="#222222">наличие свободного</text><text x="6387" y="6079.2" font-size="12.5" font-weight="400" fill="#222222">места имеют отдельные</text><text x="6387" y="6095.7" font-size="12.5" font-weight="400" fill="#222222">результаты и источники.</text></g><g transform="rotate(1 6465 6193.4)"><rect x="6377" y="6120.4" width="176" height="150" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="6377" y="6118.4" width="176" height="150" rx="2" fill="#dcdcdc"/><text x="6387" y="6140.2" font-size="12.5" font-weight="400" fill="#222222">Результат конкурса есть</text><text x="6387" y="6156.7" font-size="12.5" font-weight="400" fill="#222222">только за прошлый год.</text><text x="6387" y="6173.2" font-size="12.5" font-weight="400" fill="#222222">Ожидается: Он</text><text x="6387" y="6189.7" font-size="12.5" font-weight="400" fill="#222222">сохраняется как</text><text x="6387" y="6206.2" font-size="12.5" font-weight="400" fill="#222222">историческое</text><text x="6387" y="6222.7" font-size="12.5" font-weight="400" fill="#222222">наблюдение, текущий</text><text x="6387" y="6239.2" font-size="12.5" font-weight="400" fill="#222222">порог и личное решение</text><text x="6387" y="6255.7" font-size="12.5" font-weight="400" fill="#222222">не выводятся.</text></g><g transform="rotate(-0.8 5820 5865.2)"><rect x="5732" y="5783.9" width="176" height="166.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="5732" y="5781.9" width="176" height="166.5" rx="2" fill="#dcdcdc"/><text x="5742" y="5803.7" font-size="12.5" font-weight="400" fill="#222222">Учреждение найдено в</text><text x="5742" y="5820.2" font-size="12.5" font-weight="400" fill="#222222">общем реестре,</text><text x="5742" y="5836.7" font-size="12.5" font-weight="400" fill="#222222">программа — нет.</text><text x="5742" y="5853.2" font-size="12.5" font-weight="400" fill="#222222">Ожидается: Статус</text><text x="5742" y="5869.7" font-size="12.5" font-weight="400" fill="#222222">организации</text><text x="5742" y="5886.2" font-size="12.5" font-weight="400" fill="#222222">подтверждён, статус</text><text x="5742" y="5902.7" font-size="12.5" font-weight="400" fill="#222222">программы неизвестен</text><text x="5742" y="5919.2" font-size="12.5" font-weight="400" fill="#222222">до проверки</text><text x="5742" y="5935.7" font-size="12.5" font-weight="400" fill="#222222">применимого источника.</text></g><g transform="rotate(-0.4 9690 5856.9)"><rect x="9602" y="5783.9" width="176" height="150" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="9602" y="5781.9" width="176" height="150" rx="2" fill="#dcdcdc"/><text x="9612" y="5803.7" font-size="12.5" font-weight="400" fill="#222222">Подтверждена</text><text x="9612" y="5820.2" font-size="12.5" font-weight="400" fill="#222222">подлинность диплома.</text><text x="9612" y="5836.7" font-size="12.5" font-weight="400" fill="#222222">Ожидается: Признание</text><text x="9612" y="5853.2" font-size="12.5" font-weight="400" fill="#222222">для поступления и</text><text x="9612" y="5869.7" font-size="12.5" font-weight="400" fill="#222222">профессиональный</text><text x="9612" y="5886.2" font-size="12.5" font-weight="400" fill="#222222">допуск проверяются</text><text x="9612" y="5902.7" font-size="12.5" font-weight="400" fill="#222222">отдельно по цели и</text><text x="9612" y="5919.2" font-size="12.5" font-weight="400" fill="#222222">органу.</text></g><g transform="rotate(0.2 10120 5856.9)"><rect x="10032" y="5783.9" width="176" height="150" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="10032" y="5781.9" width="176" height="150" rx="2" fill="#dcdcdc"/><text x="10042" y="5803.7" font-size="12.5" font-weight="400" fill="#222222">Одним платежом</text><text x="10042" y="5820.2" font-size="12.5" font-weight="400" fill="#222222">покрыты два</text><text x="10042" y="5836.7" font-size="12.5" font-weight="400" fill="#222222">начисления. Ожидается:</text><text x="10042" y="5853.2" font-size="12.5" font-weight="400" fill="#222222">Сохраняются одна</text><text x="10042" y="5869.7" font-size="12.5" font-weight="400" fill="#222222">операция и два</text><text x="10042" y="5886.2" font-size="12.5" font-weight="400" fill="#222222">распределения с</text><text x="10042" y="5902.7" font-size="12.5" font-weight="400" fill="#222222">суммами, валютой и</text><text x="10042" y="5919.2" font-size="12.5" font-weight="400" fill="#222222">датой.</text></g><g transform="rotate(0.2 11625 5848.7)"><rect x="11537" y="5783.9" width="176" height="133.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="11537" y="5781.9" width="176" height="133.5" rx="2" fill="#dcdcdc"/><text x="11547" y="5803.7" font-size="12.5" font-weight="400" fill="#222222">CoE выдан до начала</text><text x="11547" y="5820.2" font-size="12.5" font-weight="400" fill="#222222">занятий. Ожидается:</text><text x="11547" y="5836.7" font-size="12.5" font-weight="400" fill="#222222">Подтверждён документ</text><text x="11547" y="5853.2" font-size="12.5" font-weight="400" fill="#222222">о зачислении.</text><text x="11547" y="5869.7" font-size="12.5" font-weight="400" fill="#222222">Фактическое участие в</text><text x="11547" y="5886.2" font-size="12.5" font-weight="400" fill="#222222">занятиях остаётся</text><text x="11547" y="5902.7" font-size="12.5" font-weight="400" fill="#222222">отдельным фактом.</text></g><g transform="rotate(-1.1 6250 5865.2)"><rect x="6162" y="5783.9" width="176" height="166.5" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="6162" y="5781.9" width="176" height="166.5" rx="2" fill="#dcdcdc"/><text x="6172" y="5803.7" font-size="12.5" font-weight="400" fill="#222222">Две альтернативы</text><text x="6172" y="5820.2" font-size="12.5" font-weight="400" fill="#222222">допуска, первая</text><text x="6172" y="5836.7" font-size="12.5" font-weight="400" fill="#222222">неизвестна, вторая</text><text x="6172" y="5853.2" font-size="12.5" font-weight="400" fill="#222222">выполнена. Ожидается:</text><text x="6172" y="5869.7" font-size="12.5" font-weight="400" fill="#222222">Выражение ANY</text><text x="6172" y="5886.2" font-size="12.5" font-weight="400" fill="#222222">выполнено.</text><text x="6172" y="5902.7" font-size="12.5" font-weight="400" fill="#222222">Неизвестность первой</text><text x="6172" y="5919.2" font-size="12.5" font-weight="400" fill="#222222">ветви и основание</text><text x="6172" y="5935.7" font-size="12.5" font-weight="400" fill="#222222">второй сохранены.</text></g><g transform="rotate(0.2 8615 5856.9)"><rect x="8527" y="5783.9" width="176" height="150" rx="3" fill="#000000" fill-opacity="0.16"/><rect x="8527" y="5781.9" width="176" height="150" rx="2" fill="#dcdcdc"/><text x="8537" y="5803.7" font-size="12.5" font-weight="400" fill="#222222">Найден запрос о</text><text x="8537" y="5820.2" font-size="12.5" font-weight="400" fill="#222222">заверении документа.</text><text x="8537" y="5836.7" font-size="12.5" font-weight="400" fill="#222222">Ожидается: Требование</text><text x="8537" y="5853.2" font-size="12.5" font-weight="400" fill="#222222">удостоверения — Q11.13,</text><text x="8537" y="5869.7" font-size="12.5" font-weight="400" fill="#222222">оформление — Q13.16,</text><text x="8537" y="5886.2" font-size="12.5" font-weight="400" fill="#222222">проверка подлинности</text><text x="8537" y="5902.7" font-size="12.5" font-weight="400" fill="#222222">— Q13.09, признание —</text><text x="8537" y="5919.2" font-size="12.5" font-weight="400" fill="#222222">Q13.05a.</text></g></g>
